  teach:`<p>Many confusions start with how the question is read. The 2026 reports give several examples: operating profit instead of the margin, ethics instead of legislation, consumers instead of business customers.</p>
  <p>For each question, find what it is really asking about before you start writing.</p>`,
  items:[
    {src:'Based on AQA June 2018 · Paper 2 report (Q3.1)', prompt:'"Analyse how cutting ticket prices and cabin crew pay could affect the margin per ticket sold." What should the answer focus on?',
     o:['Total revenue from all the tickets the airline sells in a year','Overall profit after all of the airline\'s costs have been paid','The gap between the price and the cost of one ticket','Demand for flights and how it reacts to lower prices'], a:2,
     why:'The examiner said many wrote about revenue or overall profit, "as opposed to the margin per ticket sold which is what the question asked".'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q2.3)', prompt:'"To what extent will new legislation be a threat to all businesses?" Which line would drift off the question?',
     o:['How compliance costs differ between large and small firms','How some firms gain sales when their rivals cannot meet the new rules','Whether firms should act ethically when the law does not require it','How long businesses have to adapt before the law starts'], a:2,
     why:'That is about ethics, not legislation.'},
    {src:'Based on AQA June 2018 · Paper 2 report', prompt:'A question asks you to analyse the "actions" the business could take. How many should you cover?',
     o:['One, developed fully','More than one','As many as you can list','None, just evaluate'], a:1,
     why:'The 2018 examiner gave "actions" rather than "action" as an example of why you need to read the question carefully.'},
    {src:'Based on AQA June 2023 · Paper 3 report (Q1)', prompt:'"Analyse why environmental issues are important when making operational decisions." Many students wrote good marketing arguments. What was missing?',
     o:['Data from the case to support the points','A link to operational decisions','A conclusion with a clear judgement','A business model such as Porter'], a:1,
     why:'The examiner said these arguments "failed to explicitly address the ‘operational decisions’ aspect of the question".'},
    {src:'Based on AQA June 2023 · Paper 3 report (Q5)', prompt:'A question asks you to assess the level of risk of a loan. A student writes a strong analysis of how the loan pays for growth. What is missing?',
     o:['Use of data from the appendix','A link back to the level of risk','A definition of a loan and interest','A second example from another business'], a:1,
     why:'In 2023 analysis on this question "often omitted reference to the level of risk".'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q4)', prompt:'"To what extent are these economic forecasts positive for the business?" Which line should you not take?',
     o:['Whether the forecast rise in incomes matters, given the income elasticity','Whether the forecasts might be wrong','Whether the business can pass on inflation through higher prices','Whether rivals face the same conditions'], a:1,
     why:'The question is about these forecasts. The 2026 examiner rejected answers that questioned whether they were accurate.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q21)', prompt:'"To what extent is stakeholder mapping useful in managing change?" Where should the answer start?',
     o:['With what stakeholder mapping shows managers','With Kotter and Schlesinger\'s ways of overcoming resistance','With a general discussion of why change is difficult','With the effect of the change on the business\'s profits'], a:0,
     why:'The examiner said some students "drifted into evaluation of change management without having established the use of stakeholder mapping first".'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q19)', prompt:'"Analyse how intrapreneurship might improve a business\'s financial performance." What should each chain finish on?',
     o:['Higher staff motivation','Revenue, costs or profit','More innovation in the business','Better employee engagement scores'], a:1,
     why:'The examiner said many students did not link the concept to financial performance and focused on motivation instead.'},
{src:"Exam-style · reading the question", prompt:"\"Analyse one benefit to a business of using debt factoring.\" How many benefits should you develop?",
 o:["One, developed fully with a clear chain of reasoning","Two or three, briefly","One benefit and one drawback","As many as time allows"], a:0,
 why:"The question says one benefit. Spend the time developing it fully. A drawback is not asked for."},
{src:"Exam-style · reading the question", prompt:"\"Assess the importance of cash-flow forecasting to a start-up.\" Which word tells you that you must make a judgement?",
 o:["Assess","Importance","Forecasting","Start-up"], a:0,
 why:"Assess is the command word. You need to weigh up how important it is, not just explain why it helps."},
{src:"Exam-style · reading the question", prompt:"\"Analyse how the change in exchange rates might affect the business's profit.\" A student writes two good paragraphs about revenue and stops. What is missing?",
 o:["A link through to costs and profit","A definition of exchange rates","A conclusion weighing up the two paragraphs","A diagram"], a:0,
 why:"The end point is profit. Revenue is only half of it, so the chain has to reach profit."},
{src:"Exam-style · reading the question", prompt:"\"To what extent should the business use social media rather than TV advertising?\" Which line deals with the \"rather than\"?",
 o:["Comparing the cost per customer reached by each method for this business","Explaining all of the benefits of social media","Explaining why advertising matters to businesses","Describing the business's target market"], a:0,
 why:"\"Rather than\" means the two methods must be compared, not discussed one at a time."},
{src:"Exam-style · reading the question", prompt:"\"Analyse the benefits to employees of the business becoming more decentralised.\" Which end point fits?",
 o:["Employees, for example more say over their work","The business's profit and its share price","Customers, for example faster and more personal service in store","Shareholders, for example higher dividends"], a:0,
 why:"The question asks about benefits to employees, so that is where each chain must finish."},
{src:"Exam-style · reading the question", prompt:"\"Calculate the percentage change in revenue between 2024 and 2025.\" What should you check before you start?",
 o:["Which year is the original value to divide by","Whether the answer needs a £ sign as well as a % sign","How many businesses are in the market","Whether revenue is the same as profit"], a:0,
 why:"Percentage change always divides by the original value, here 2024. The answer is a percentage, so no £ sign."},
{src:"Exam-style · reading the question", prompt:"\"Analyse the possible impact on the business of a fall in consumer incomes.\" Which piece of data is most useful?",
 o:["The income elasticity of demand for its products","Its gearing ratio","Its labour turnover","The number of shops it has and where they are located"], a:0,
 why:"YED tells you how much demand responds to a change in incomes."},
{src:"Exam-style · reading the question", prompt:"\"To what extent is the business's high gearing a problem?\" Which line keeps the answer on the question?",
 o:["Whether its profit easily covers the interest payments","How the business could become more efficient","The history of the business and who founded it","Whether the business has a strong brand"], a:0,
 why:"High gearing is a problem when interest is hard to afford. That is what the answer needs to weigh up."},
{src:"Exam-style · reading the question", prompt:"\"Analyse how the business might reduce its labour turnover.\" A student writes about recruitment adverts. What is the problem?",
 o:["Recruitment replaces leavers; it does not stop staff leaving","Recruitment is not on the specification","Adverts are too expensive for most businesses","There is no problem with this"], a:0,
 why:"Reducing labour turnover means keeping staff, for example through pay, training or better management."},
{src:"Exam-style · reading the question", prompt:"\"Assess whether the business should prioritise its shareholders or its employees.\" What must the judgement do?",
 o:["Say which group should come first for this business, and explain why","Say that both groups are equally important to every business","Avoid choosing, because the answer depends on the business","Say shareholders always come first because they own the business"], a:0,
 why:"A judgement makes a choice for this business and explains what it depends on."},
{src:"Exam-style · reading the question", prompt:"\"Analyse the impact of the new competitor on the business's market share.\" What is the end point?",
 o:["Market share","Revenue","Profit","Customer loyalty"], a:0,
 why:"Revenue or profit may change too, but the question asks about market share."},
{src:"Exam-style · reading the question", prompt:"\"Analyse why the business's gross profit margin has fallen.\" A student explains why operating profit fell. What went wrong?",
 o:["They answered about the wrong profit measure","They should have used more data","Operating profit is not on the specification","Nothing went wrong"], a:0,
 why:"Gross profit margin depends on revenue and cost of sales. Operating expenses are not part of it."}
  ]},
