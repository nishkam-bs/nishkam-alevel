<script>
/* =====================================================================
   CONCEPT CONFUSIONS COURSE (AO1)
   Every item is built on a mix-up named in an AQA examiner report,
   Papers 1, 2 and 3, 2017 to 2026. "Based on" means the confusion comes
   from the report; the wording of every item is our own.
   Stage numbers are stored in the tracking sheet as 300 + stage.
   ===================================================================== */
const TF=['True','False'];

const STAGES=[
/* ---------------- STAGE 1 ---------------- */
{ id:1, type:'drift', title:'Cash and profit', blurb:'Cash flow, profit, share prices and dividends are not the same thing.', serve:10, pass:8,
  labels:TF, showLabel:'True or false?',
  teach:`<p>Profit is revenue minus costs over a period. Cash flow is the timing of money coming in and going out. A sale on credit adds to profit now but brings in cash later.</p>
  <p>On the June 2026 Paper 3, students used the two words as if they meant the same thing, and their analysis fell apart as a result. Share prices cause a similar problem: the November 2020 Paper 3 report found many students thought a rise in share price gives the business more money.</p>
  <p>Decide whether each statement is true or false.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 3 report (Q5)', q:'A furniture maker sells £50,000 of tables to a hotel chain on 90 days\' credit.', ok:false,
     text:'This sale increases the business\'s profit and its cash balance this month.',
     why:'It counts towards revenue and profit when the sale is made, but the cash does not arrive for 90 days.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q5)', q:'A business has made a profit every month this year.', ok:true,
     text:'It can still run out of cash.',
     why:'If customers pay late, stock builds up or a large asset is bought, more cash can go out than comes in even though revenue is above costs.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q19)', q:'A business starts using debt factoring for the money its customers owe.', ok:true,
     text:'This improves its cash flow straight away but reduces its profit.',
     why:'The factor pays most of the money now, so cash arrives sooner. The factor keeps a fee, so the business ends up with less than the full value of its sales.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q19)', q:'A business starts using debt factoring for the money its customers owe.', ok:false,
     text:'Debt factoring increases the total amount the business receives from its sales.',
     why:'It gets the money sooner, not more of it. After the fee it receives less.'},
    {src:'Based on AQA November 2020 · Paper 3 report (Q1)', q:'A plc\'s share price rises by 20%.', ok:false,
     text:'The business now has more money to spend on investment.',
     why:'Existing shares are traded between investors, so the money goes to the shareholder who sells. The examiner said "a large number of responses" believed the business would have more money. A higher price does make it easier to raise finance if the business issues new shares later.'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q2.2)', q:'A company\'s profits have risen and its share price has gone up.', ok:false,
     text:'The company put its share price up because its profits rose.',
     why:'A business does not set its own share price. It rises because more investors want to buy the shares than sell them, often after good profit news. The 2022 examiner noted some students believed the business sets the price.'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q2.1)', q:'A company pays its shareholders a dividend.', ok:true,
     text:'A dividend is a share of the company\'s profit paid to shareholders as a return on their investment.',
     why:'The 2022 examiner said weak definitions missed exactly this: the sharing out of profit, or the idea of a return on investment.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q7)', q:'Current assets £40,000. Current liabilities £80,000. Gearing 15%.', ok:true,
     text:'The business has a low current ratio and low gearing.',
     why:'Current ratio = 40,000 ÷ 80,000 = 0.5, which is low. Gearing of 15% is low. In 2018 only 35% of students got a question like this right.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q7)', q:'A business has gearing of 65%.', ok:false,
     text:'This means it cannot pay its short-term debts.',
     why:'Gearing is about long-term borrowing compared with capital employed. Paying short-term debts is liquidity, measured by the current ratio. High gearing means more interest to pay, which can strain cash, but the two ratios measure different things.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q5)', q:'A profitable small business sees its cash balance fall from £60,000 to £54,000.', ok:false,
     text:'This is a serious threat to the survival of the business.',
     why:'Cash has fallen, but the business still holds £54,000 and makes a profit. The 2026 examiner credited answers that kept problems in proportion rather than treating them as an "existential crisis".'},
{src:"Exam-style · cash and profit", q:"A retailer pays £20,000 cash for stock at the end of March. None of it is sold until April.", ok:true,
 text:"This reduces March's cash balance but does not reduce March's profit.",
 why:"The cash leaves when the stock is paid for. The cost only counts against profit (as cost of sales) when the goods are sold, which is in April."},
{src:"Exam-style · cash and profit", q:"A business sells a factory it no longer needs for £2m.", ok:true,
 text:"Its cash balance rises by £2m, but the £2m is not sales revenue.",
 why:"Selling an asset brings in cash, but revenue comes from selling the business's goods or services."},
{src:"Exam-style · cash and profit", q:"A firm takes out a £500,000 bank loan.", ok:false,
 text:"The loan increases the firm's profit for the year.",
 why:"Borrowing brings in cash but it is not income, so profit does not change. The interest on the loan will reduce profit."},
{src:"Exam-style · cash and profit", q:"A manufacturer increases the credit it gives customers from 30 days to 60 days.", ok:true,
 text:"Cash will come in more slowly, even if sales and profit stay the same.",
 why:"The same sales are made, but customers keep the money for an extra month before paying."},
{src:"Exam-style · cash and profit", q:"A business agrees 60 days' credit with its suppliers instead of 30.", ok:true,
 text:"This improves its cash flow in the short term.",
 why:"It keeps the cash for longer before paying. The risk is that suppliers become less willing to help it in future."},
{src:"Exam-style · cash and profit", q:"A company's revenue fell by 10% this year, but its cash balance rose.", ok:false,
 text:"This cannot happen: if revenue falls, the cash balance must fall too.",
 why:"Cash can still rise if customers paid old debts, stock was run down, an asset was sold or money was borrowed."},
{src:"Exam-style · cash flow forecasts", q:"A cash-flow forecast shows a negative closing balance for August.", ok:false,
 text:"This means the business will make a loss in August.",
 why:"It means more cash goes out than is available, so the business needs an overdraft or other finance. It could still be profitable, for example if customers have not yet paid."},
{src:"Exam-style · sources of finance", q:"A start-up is profitable on paper but has very little cash because its customers pay after 60 days.", ok:true,
 text:"An overdraft is a sensible short-term way to cover the gap until customers pay.",
 why:"An overdraft is flexible and only used when needed, which suits a short-term cash gap. A long-term loan would be a poor match."},
{src:"Exam-style · shares and finance", q:"A plc issues new shares and raises £10m.", ok:true,
 text:"Unlike trading in existing shares, this brings money into the business.",
 why:"New shares are sold by the company itself, so it receives the money. When existing shares are traded, the money goes to the investor who sells."},
{src:"Exam-style · dividends", q:"A company pays £3m in dividends to its shareholders.", ok:false,
 text:"Paying the dividend reduces the company's profit for the year.",
 why:"Dividends are paid out of profit after it has been calculated. They reduce retained profit and cash, not the profit figure itself."},
{src:"Exam-style · retained profit", q:"A business has retained profit of £400,000.", ok:false,
 text:"This means it has £400,000 in its bank account.",
 why:"Retained profit is profit kept in the business rather than paid out. It may already have been spent on machinery, stock or other assets."},
{src:"Exam-style · profit measures", q:"Gross profit is £400,000. Operating profit is £50,000.", ok:true,
 text:"The business's operating expenses were £350,000.",
 why:"Operating profit = gross profit − operating expenses, so the expenses are £400,000 − £50,000."},
{src:"Exam-style · cash and profit", q:"Sales are slower than expected and finished goods pile up in the warehouse.", ok:true,
 text:"This ties up cash, even though the goods have not been sold.",
 why:"The business has paid for materials and labour, but no cash comes back until the goods are sold and paid for."},
{src:"Exam-style · cash and profit", q:"A business's accounts show exactly £0 profit for the year.", ok:false,
 text:"It must have had exactly the same amount of cash coming in as going out.",
 why:"Profit and cash are measured differently. Credit sales, stock and buying assets all affect the timing of cash without affecting profit in the same way."}
  ]},

/* ---------------- STAGE 2 ---------------- */
{ id:2, type:'mcq', title:'Numbers that look alike', blurb:'Margin or profit, contribution or revenue, units or pounds.', serve:10, pass:8,
  teach:`<p>Many marks are lost not because students can't calculate, but because they calculate the wrong thing: profit instead of margin, revenue instead of contribution, pounds instead of units.</p>
  <p>Every question here is built on a mistake an examiner reported. Work each one out before you look at the options.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 2 report (Q1.4)', prompt:'Revenue rises from £8m to £12m. Operating profit rises from £1.2m to £1.5m. What has happened to the operating profit margin?',
     o:['It has risen, because operating profit went up','It has fallen, from 15% to 12.5%','It has stayed the same','It has risen, from 15% to 18%'], a:1,
     why:'1.2 ÷ 8 = 15%. 1.5 ÷ 12 = 12.5%. Profit went up but revenue went up faster, so the margin fell. In 2026 many students wrote about operating profit when the question asked about the margin.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q5)', prompt:'Selling price £12. Variable cost £7 per unit. 1,000 units sold. Fixed costs £3,000. What is total contribution?',
     o:['£12,000','£5,000','£2,000','£7,000'], a:1,
     why:'(12 − 7) × 1,000 = £5,000. £12,000 is revenue. £2,000 is profit, which is contribution minus fixed costs.'},
    {src:'Based on AQA June 2024 · Paper 3 report (Q3)', prompt:'What is contribution per unit?',
     o:['The total cost of making one unit, including its share of fixed costs','The selling price minus the variable cost of one unit','The profit made on each unit once it is sold','Total revenue divided by the number of units sold'], a:1,
     why:'The 2024 examiner found students "misunderstanding contribution as unit cost". Contribution is what each unit adds towards fixed costs. It only becomes profit once fixed costs are covered.'},
    {src:'Based on AQA June 2017 · Paper 1 report (Q19)', prompt:'A café\'s break-even output is 4,000 cups a month. What does this mean?',
     o:['The café takes 4,000 hours of opening to reach the point of break-even','The café must sell 4,000 cups a month to cover all its costs','The café makes £4,000 of profit every month once it is open','The café breaks even after four months of trading'], a:1,
     why:'Break-even is a level of output, not a length of time. The 2017 examiner noted students defining it as a period of time.'},
    {src:'Based on AQA June 2024 · Paper 1 report (Q16)', prompt:'Break-even output is 6,000 units. The business sells 8,500 units at £20 each. What is the margin of safety?',
     o:['£50,000','2,500 units','8,500 units','£170,000'], a:1,
     why:'Actual output − break-even output = 2,500 units. In 2024 many students added a £ sign to this answer and lost marks.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q17)', prompt:'A market was worth £40m last year and is worth £46m this year. What is the market growth?',
     o:['15%','13%','£6m','6% more market share'], a:0,
     why:'(46 − 40) ÷ 40 × 100 = 15%. Divide by the original size. 13% comes from dividing by the new size, which a "relatively large proportion" did in 2018. Others confused market growth with market share.'},
    {src:'Based on AQA June 2017 · Paper 1 report (Q16)', prompt:'A machine costs £90,000. Net cash flows: Year 1 £30,000, Year 2 £40,000, Year 3 £40,000. What is the payback period?',
     o:['3 years','2 years 6 months','2 years','2 years 2 months'], a:1,
     why:'£70,000 is back after two years. The last £20,000 is half of Year 3\'s £40,000, so payback is 2 years 6 months. The 2017 examiner reported students saying payback came "after 3 years" rather than during the third year.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q5)', prompt:'Which of these equations is always correct?',
     o:['Total revenue = total costs + total contribution','Total revenue = contribution per unit × the quantity sold in the period','Total contribution = total revenue − total variable costs','Profit = total contribution + fixed costs'], a:2,
     why:'Contribution per unit × quantity is total contribution, not revenue. Total costs + total contribution comes to revenue plus fixed costs, so it overstates revenue. Profit = total contribution − fixed costs. The 2026 report named this accounting-equations question as one of the more challenging ones.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q5)', prompt:'Revenue £80,000. Variable costs £50,000. Fixed costs £20,000. Which statement is correct?',
     o:['Total contribution is £30,000 and profit is £10,000','Total contribution is £10,000 and profit is £30,000','Total contribution is £80,000 and profit is £10,000','Total contribution is £60,000 and profit is £30,000'], a:0,
     why:'Contribution = 80,000 − 50,000 = £30,000. Profit = 30,000 − 20,000 = £10,000.'},
    {src:'Based on AQA June 2017 · Paper 1 report (Q16 and Q17)', prompt:'Which method of investment appraisal uses discount factors?',
     o:['Payback','Average rate of return','Net present value','Break-even'], a:2,
     why:'Only NPV discounts future cash flows. In 2017 many students used the discount factors to calculate payback, so they answered the wrong question.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q8)', prompt:'A business budgeted for costs of £50,000. Actual costs were £56,000. What is the variance?',
     o:['£6,000 favourable','£6,000 adverse','£56,000 adverse','£6,000 positive'], a:1,
     why:'Costs above budget are bad for profit, so the variance is adverse. The 2018 report found confusion between adverse and favourable.'},
    {src:'Based on AQA June 2025 · Paper 1 report (Q16)', prompt:'Inventory £30,000. Receivables £20,000. Cash £10,000. Current liabilities £40,000. Net current assets £20,000. What is the current ratio?',
     o:['0.5','1.5','2.0','0.75'], a:1,
     why:'Current assets = 30,000 + 20,000 + 10,000 = £60,000. 60,000 ÷ 40,000 = 1.5. In 2025 the most common error was using the net current assets figure instead of adding up the current assets.'},
    {src:'Based on AQA June 2024 · Paper 1 report (Q17)', prompt:'Initial cost £100,000. Present values of the returns: Year 1 £45,000, Year 2 £48,000. What is the NPV?',
     o:['+£7,000','−£7,000','£93,000','£193,000'], a:1,
     why:'NPV = present values − initial cost = 93,000 − 100,000 = −£7,000. In 2024 students often took it away the wrong way round, and some missed that the answer was negative.'},
{src:"Exam-style · profit margins", prompt:"Revenue £500,000. Cost of sales £300,000. Operating expenses £150,000. What is the operating profit margin?",
 o:["10%","40%","30%","50%"], a:0,
 why:"Operating profit = 500,000 − 300,000 − 150,000 = £50,000. 50,000 ÷ 500,000 = 10%. 40% is the gross profit margin. 30% is operating expenses as a share of revenue."},
{src:"Exam-style · profit margins", prompt:"A shop buys a jacket for £60 and sells it for £80. What is the gross profit margin on the jacket?",
 o:["33.3%","25%","20%","75%"], a:1,
 why:"Gross profit £20 ÷ selling price £80 = 25%. 33.3% divides by the cost, which is a mark-up, not a margin."},
{src:"Exam-style · percentages", prompt:"A business's market share rises from 20% to 25%. Which statement is correct?",
 o:["It has risen by 5%","It has risen by 5 percentage points, a 25% increase","It has risen by 25 percentage points","It has risen by 5 percentage points, a 20% increase"], a:1,
 why:"25 − 20 = 5 percentage points. 5 ÷ 20 = a 25% increase. Dividing by the new figure gives the wrong 20%."},
{src:"Exam-style · capacity utilisation", prompt:"A factory can make 50,000 units a year. Output rises from 40,000 to 45,000 units. What happens to capacity utilisation?",
 o:["It rises from 80% to 90%","It rises by 5,000 units","It rises from 80% to 112.5%","It rises by 12.5 percentage points"], a:0,
 why:"40,000 ÷ 50,000 = 80%. 45,000 ÷ 50,000 = 90%. 12.5% is the growth in output, not the change in utilisation."},
{src:"Exam-style · unit costs", prompt:"Fixed costs £40,000. Variable cost £3 per unit. Output 10,000 units. What is the average cost per unit?",
 o:["£4","£7","£3","£70,000"], a:1,
 why:"Total cost = 40,000 + (3 × 10,000) = £70,000. £70,000 ÷ 10,000 = £7. £4 is only the fixed cost per unit."},
{src:"Exam-style · labour cost per unit", prompt:"Labour costs £120,000. Output 40,000 units. There are 8 staff. What is labour cost per unit?",
 o:["£3","£15,000","£5,000","£0.33"], a:0,
 why:"120,000 ÷ 40,000 = £3. £15,000 is the cost per worker. 5,000 is output per worker, which is labour productivity."},
{src:"Exam-style · inventory turnover", prompt:"Cost of sales £600,000. Revenue £900,000. Average inventory £50,000. What is inventory turnover?",
 o:["12 times","18 times","6 times","0.08 times"], a:0,
 why:"Inventory turnover = cost of sales ÷ average inventory = 600,000 ÷ 50,000 = 12 times. 18 uses revenue instead of cost of sales."},
{src:"Exam-style · receivables days", prompt:"Receivables £60,000. Revenue £730,000. Cost of sales £365,000. What are the receivables days?",
 o:["30 days","60 days","12 days","0.08 days"], a:0,
 why:"Receivables ÷ revenue × 365 = 60,000 ÷ 730,000 × 365 = 30 days. Using cost of sales gives 60 days, which is the wrong formula."},
{src:"Exam-style · payables days", prompt:"Payables £45,000. Cost of sales £547,500. Revenue £730,000. What are the payables days?",
 o:["30 days","22.5 days","12.2 days","45 days"], a:0,
 why:"Payables ÷ cost of sales × 365 = 45,000 ÷ 547,500 × 365 = 30 days. Using revenue gives 22.5 days."},
{src:"Exam-style · ROCE", prompt:"Operating profit £2m. Total equity £8m. Non-current liabilities £2m. Revenue £20m. What is ROCE?",
 o:["20%","25%","10%","80%"], a:0,
 why:"Capital employed = total equity + non-current liabilities = £10m. 2 ÷ 10 = 20%. 25% uses equity only. 10% is the operating profit margin."},
{src:"Exam-style · gearing", prompt:"Non-current liabilities £3m. Total equity £9m. What is the gearing ratio?",
 o:["25%","33.3%","300%","75%"], a:0,
 why:"Gearing = non-current liabilities ÷ capital employed = 3 ÷ (9 + 3) = 25%. 33.3% divides by equity only."},
{src:"Exam-style · cash flow", prompt:"Cash inflows for the month are £45,000 and cash outflows are £52,000. The opening balance is £10,000. What is the closing balance?",
 o:["£3,000","−£7,000","£17,000","£107,000"], a:0,
 why:"Net cash flow = £45,000 − £52,000 = −£7,000. Closing balance = £10,000 − £7,000 = £3,000. −£7,000 is the net cash flow, not the balance."},
{src:"Exam-style · investment appraisal", prompt:"A project costs £200,000 and makes a total profit of £100,000 over 5 years. What is the average rate of return?",
 o:["10%","50%","20%","2%"], a:0,
 why:"Average annual profit = 100,000 ÷ 5 = £20,000. 20,000 ÷ 200,000 = 10%. 50% uses the total profit instead of the yearly average."}
  ]},

/* ---------------- STAGE 3 ---------------- */
{ id:3, type:'drift', title:'Ownership and growth', blurb:'Plc, Ltd, organic growth, joint ventures and integration.', serve:10, pass:8,
  labels:TF, showLabel:'True or false?',
  teach:`<p>These are basic terms, but the reports show they are often misunderstood. In 2018 over 40% of students thought a plc was in the public sector. In 2023 organic growth was "the most misunderstood piece of business knowledge on the paper". In 2026 the question on becoming a limited company was the worst answered on Paper 3.</p>
  <p>If the term is wrong, every step built on it is wrong too.</p>`,
  items:[
    {src:'Based on AQA June 2018 · Paper 1 report (Q3)', q:'Tesco is a public limited company.', ok:false,
     text:'Tesco is in the public sector.',
     why:'"Public" means its shares can be sold to the public. It is owned by shareholders, so it is in the private sector. Over 40% of students got this wrong in 2018.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:'A sole trader turns his business into a private limited company (Ltd).', ok:true,
     text:'He now has limited liability, so his personal assets are protected if the business fails.',
     why:'The company is now a separate legal body. He can only lose what he has put into it.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:'A sole trader turns his business into a private limited company (Ltd).', ok:false,
     text:'The business can now sell shares to the public on the stock exchange.',
     why:'Only a plc can offer shares to the public. A Ltd sells shares privately. Students in 2026 mixed up Ltd and plc.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:'A sole trader turns his business into a private limited company (Ltd).', ok:false,
     text:'The business must now have outside shareholders who will want dividends.',
     why:'The owner can hold every share himself. Some 2026 answers invented shareholders who were not in the case.'},
    {src:'Based on AQA June 2023 · Paper 3 report', q:'A business chooses organic growth.', ok:false,
     text:'It is growing in an environmentally friendly way.',
     why:'Organic growth means growing from within, for example opening new sites or selling more, rather than by merging or taking over. A "notable minority" in 2023 thought it meant environmentally friendly.'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q2.4)', q:'Two businesses set up a joint venture.', ok:false,
     text:'The two businesses have merged into one company.',
     why:'In a joint venture both stay separate and share a project, with its costs and profits. The 2022 examiner said it was common to assume it was a merger, and some confused it with venture capital.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q10)', q:'A chocolate manufacturer buys a cocoa farm.', ok:false,
     text:'This is forward vertical integration.',
     why:'Buying a supplier is backward vertical integration. Forward would be buying a business closer to the customer, such as a chain of shops. The 2018 report noted confusion between the two.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q10)', q:'A car manufacturer buys a chain of car dealerships.', ok:true,
     text:'This is forward vertical integration.',
     why:'The dealerships are the next stage towards the customer.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q10)', q:'A clothing retailer takes over a rival clothing retailer.', ok:true,
     text:'This is horizontal integration.',
     why:'Same industry and same stage of production.'},
{src:"Exam-style · business forms", q:"A business is a private limited company (Ltd).", ok:true,
 text:"It cannot advertise its shares for sale to the general public.",
 why:"Only a plc can offer its shares to the public. A Ltd sells shares privately, for example to family, staff or chosen investors."},
{src:"Exam-style · business forms", q:"The founders of a Ltd turn it into a plc and float it on the stock exchange.", ok:true,
 text:"If they sell more than half of the shares, they can lose control of the business.",
 why:"Control goes with voting shares. Once outside investors hold a majority, they can outvote the founders."},
{src:"Exam-style · business forms", q:"A plumber runs her business as a sole trader.", ok:true,
 text:"She has unlimited liability, so her personal assets are at risk if the business fails.",
 why:"A sole trader and the business are not separate in law, so the owner is personally responsible for its debts."},
{src:"Exam-style · business forms", q:"A social enterprise runs a chain of cafés.", ok:false,
 text:"A social enterprise is not allowed to make a profit.",
 why:"It can make a profit and usually tries to. Most of the profit is put back into its social or environmental aims."},
{src:"Exam-style · growth", q:"Two businesses join together.", ok:true,
 text:"In a merger the two agree to combine. In a takeover one buys a controlling share of the other.",
 why:"That is the key difference. A takeover can happen without the target's managers agreeing."},
{src:"Exam-style · growth", q:"A business buys 51% of a rival's shares.", ok:false,
 text:"This is organic growth, because it is buying shares rather than opening new stores.",
 why:"Buying control of another business is external (inorganic) growth. Organic growth comes from within, for example opening new sites."},
{src:"Exam-style · growth", q:"A brewer buys an insurance company.", ok:true,
 text:"This is conglomerate integration.",
 why:"The two businesses are in unrelated industries."},
{src:"Exam-style · growth", q:"A bakery chain opens six new shops, paid for out of retained profit.", ok:true,
 text:"This is organic growth.",
 why:"It is growing from within, using its own resources."},
{src:"Exam-style · business forms", q:"A company's shares are listed on the London Stock Exchange.", ok:false,
 text:"Its shareholders can be made to pay its debts if it fails.",
 why:"Shareholders in a plc have limited liability. They can lose what they paid for their shares, but no more."},
{src:"Exam-style · share price", q:"A plc reports much higher profit than expected and announces a bigger dividend.", ok:true,
 text:"This is likely to push the share price up, because more investors want to buy the shares.",
 why:"The share price is set by supply and demand for the shares. Good news increases demand."},
{src:"Exam-style · growth", q:"Investors are trying to buy enough shares in a plc to take it over.", ok:true,
 text:"The takeover can happen even if the plc's directors oppose it, as long as enough shareholders sell.",
 why:"This is a hostile takeover. The shareholders, not the directors, decide whether to sell."},
{src:"Exam-style · growth", q:"A coffee brand grows by franchising.", ok:false,
 text:"The franchisor owns and runs each new outlet.",
 why:"The franchisee pays for, owns and runs the outlet. The franchisor supplies the brand and the system, and receives fees and royalties."},
{src:"Exam-style · finance", q:"A small tech start-up receives venture capital.", ok:false,
 text:"Venture capital is when two businesses share a new project and its profits.",
 why:"That is a joint venture. Venture capital is investment in a young, risky business, usually in return for a share of ownership."},
{src:"Exam-style · ownership and objectives", q:"A family business with a strong ethical mission becomes a plc.", ok:true,
 text:"It may come under more pressure to focus on short-term profit.",
 why:"Outside shareholders may want returns quickly, which can pull against long-term or ethical aims."},
{src:"Exam-style · finance", q:"A Ltd wants to raise £50m from new investors without borrowing.", ok:true,
 text:"Becoming a plc and selling new shares to the public would let it do this.",
 why:"A share issue raises equity finance, so there is no interest to pay. The cost is giving up some ownership and control."}
  ]},

/* ---------------- STAGE 4 ---------------- */
{ id:4, type:'mcq', title:'People and pay', blurb:'Turnover, productivity, retention, PRP and the HR function.', serve:10, pass:8,
  teach:`<p>The people topics have a lot of terms that sound alike. Confusing labour turnover with labour productivity kept many students below Level 2 on a 2018 question. In 2026, students mixed up performance-related pay with piece rate.</p>
  <p>Read each option carefully. The wrong ones are the mistakes examiners saw.</p>`,
  items:[
    {src:'Based on AQA June 2018 · Paper 1 report (Q18)', prompt:'Which of these measures labour productivity?',
     o:['Staff leaving ÷ average number of staff × 100','Output ÷ number of employees','Labour costs ÷ output','Staff still employed ÷ staff at the start × 100'], a:1,
     why:'Productivity is output per worker. The first option is labour turnover. In 2018, confusing the two was "a mistake that accounted for many of the students who did not reach level 2".'},
    {src:'Based on AQA June 2019 · Paper 1 report (Q5)', prompt:'A firm starts the year with 200 staff. During the year 30 of them leave. What is the labour retention rate?',
     o:['15%','85%','30','17.6%'], a:1,
     why:'Retention = staff who stayed ÷ staff at the start × 100 = 170 ÷ 200 = 85%. 15% is the share who left. In 2019 students understood productivity better than retention.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q3.3)', prompt:'A sales team gets a bonus at the end of the year if it hits its sales target. What is this?',
     o:['Piece rate','Performance-related pay','Profit sharing','A higher basic salary for the team'], a:1,
     why:'PRP rewards meeting targets. Piece rate pays an amount for each unit produced.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q3.3)', prompt:'A machinist is paid £1.20 for every garment she finishes. What is this?',
     o:['Piece rate','Performance-related pay','Profit sharing','A salary'], a:0,
     why:'Pay per unit produced is piece rate. It only works where each worker\'s output is easy to count.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q3.3)', prompt:'Every employee receives a bonus worth 5% of the company\'s annual profit, shared out in proportion to salary. What is this?',
     o:['Piece rate','Performance-related pay','Profit sharing','Commission'], a:2,
     why:'It depends on the whole company\'s profit, not on an individual\'s targets or output.'},
    {src:'Based on AQA June 2025 · Paper 1 report (Q20)', prompt:'"Analyse how an innovation strategy might affect the role of the HR function." Which sentence answers the question?',
     o:['Staff will feel more motivated because they can see that the business values their ideas and wants to hear them.','HR will need to recruit staff with design skills and train others, so the right people are in place.','Employees may resist the change because they fear for their jobs.','Sales will rise because the products are new.'], a:1,
     why:'The question is about what the HR department does: recruitment, training and workforce planning. The 2025 examiner noted answers that "linked their logic to the impact on employees rather than the role of the HR function".'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q19)', prompt:'What is intrapreneurship?',
     o:['A paid work placement for students, often during the summer holidays','Employees acting like entrepreneurs inside an existing business','Wealthy individuals investing their own money in new start-up businesses','Workers making continuous small improvements to how they do their jobs'], a:1,
     why:'In 2018 some students confused it with internships and business angels, and some wrote about kaizen instead.'},
    {src:'Exam-style · organisational structure', prompt:'A manager has 12 people reporting directly to her. What does the number 12 describe?',
     o:['Her span of control','The chain of command','The number of levels of hierarchy','Her level of delegation'], a:0,
     why:'Span of control is the number of people a manager is directly responsible for. It is a number, not a measure of how controlling the manager is.'},
    {src:'Based on AQA June 2019 · Paper 1 report (Q6)', prompt:'A project team brings together people from different departments to solve one problem, and expertise matters more than job title. Which Handy culture is this?',
     o:['Power','Role','Task','Person'], a:2,
     why:'Task culture is built around teams and projects. Role culture is built around rules and job descriptions. In 2019 students were surer about power culture than role or task.'},
    {src:'Based on AQA June 2025 · Paper 1 report (Q8)', prompt:'A business going through retrenchment needs fewer staff. How can a high labour turnover help?',
     o:['It means the staff who remain are likely to be more productive','Staff leaving on their own means fewer redundancies are needed','It cuts recruitment and training costs while the business shrinks','It shows staff are motivated to move on to better jobs'], a:1,
     why:'If people are already leaving, the business can shrink by not replacing them. In 2025 this was the hardest multiple-choice question because students did not see the link.'},
{src:"Exam-style · labour turnover", prompt:"During the year 18 staff leave. The average number employed is 120. What is labour turnover?",
 o:["15%","18%","85%","6.7%"], a:0,
 why:"Labour turnover = staff leaving ÷ average number employed × 100 = 18 ÷ 120 × 100 = 15%."},
{src:"Exam-style · labour productivity", prompt:"25 staff produce 10,000 units a month. After training, 24 staff produce 10,800 units. What happens to labour productivity?",
 o:["It rises from 400 to 450 units per worker","It rises by 800 units","It falls, because there are fewer staff","It rises from 400 to 432 units per worker"], a:0,
 why:"10,000 ÷ 25 = 400. 10,800 ÷ 24 = 450. 432 divides the new output by the old number of staff."},
{src:"Exam-style · Herzberg", prompt:"Which of these is a hygiene factor in Herzberg's two-factor theory?",
 o:["Recognition for good work","Company policy and administration","Responsibility","The work itself"], a:1,
 why:"Company policy, pay, working conditions and supervision are hygiene factors. Recognition, responsibility and the work itself are motivators."},
{src:"Exam-style · Maslow", prompt:"A worker on a zero-hours contract does not know whether she will get enough shifts to pay next month's rent. Which of Maslow's needs is least met?",
 o:["Esteem","Safety (security)","Social","Self-actualisation"], a:1,
 why:"Uncertain income threatens her security, which is a safety need."},
{src:"Exam-style · Taylor", prompt:"Which approach fits Taylor's scientific management most closely?",
 o:["Giving teams the freedom to decide for themselves how to organise their work","Breaking a job into simple tasks, timing them and paying by output","Rotating staff between jobs so they do not get bored","Consulting employees before decisions are made"], a:1,
 why:"Taylor believed there was one best way to do each task, found by measurement, and that workers were motivated by pay, for example piece rate."},
{src:"Exam-style · job design", prompt:"A supermarket worker who only stacked shelves is now also responsible for ordering stock and training new staff. What is this?",
 o:["Job enlargement","Job enrichment","Job rotation","Delayering"], a:1,
 why:"Enrichment adds responsibility and more challenging tasks. Enlargement adds more tasks at the same level."},
{src:"Exam-style · decision making", prompt:"A manager asks her team for their views, then makes the final decision herself. What is this?",
 o:["Delegation","Consultation with the team","Empowerment","A democratic vote"], a:1,
 why:"Consultation means asking for views. Delegation would mean passing the decision itself to the team."},
{src:"Exam-style · organisational structure", prompt:"A retail chain lets each store manager decide staffing and local promotions. What is this?",
 o:["Centralisation","Decentralisation of decisions","Delayering","A wider span of control"], a:1,
 why:"Decision-making authority has been passed down from head office to the stores."},
{src:"Exam-style · organisational structure", prompt:"A business removes a layer of middle managers. What is the most likely effect on the remaining managers' spans of control?",
 o:["They become wider, as each has more direct reports","They become narrower","They stay the same","The chain of command gets longer"], a:0,
 why:"The staff who reported to the removed managers now report to the managers above, so each manager has more direct reports."},
{src:"Exam-style · workforce planning", prompt:"What is workforce planning?",
 o:["Working out the number and skills of staff needed in future","Writing the job description and person specification for a single vacancy","Arranging an induction programme for new starters","Drawing up the shift rota for the coming week"], a:0,
 why:"It compares the workforce the business will need with the one it has, then plans recruitment, training or redundancies to close the gap."},
{src:"Exam-style · employee relations", prompt:"Which of these is an example of collective bargaining?",
 o:["A trade union negotiating pay for all its members at a factory","An employee asking her manager for a pay rise","A manager setting a target for each worker","Staff completing an engagement survey"], a:0,
 why:"Collective bargaining is negotiation between employers and representatives of a group of workers, usually a trade union."},
{src:"Exam-style · non-financial motivation", prompt:"Staff in a bank branch move between the counter, the phones and processing applications each week. Which non-financial method is this?",
 o:["Job rotation","Job enrichment","Piece rate","Delegation"], a:0,
 why:"Moving staff between tasks at a similar level is job rotation. Job enrichment would give them more responsibility."},
{src:"Exam-style · labour turnover", prompt:"Labour turnover at a care home rises from 8% to 20%. What is the most likely direct cost to the home?",
 o:["More spending on recruiting and training replacement staff","Lower wages for the staff who stay","Higher productivity from the remaining staff","Less absence among the remaining staff"], a:0,
 why:"Every leaver has to be replaced, which costs money in advertising, interviews and training. New staff also take time to become fully productive."},
{src:"Exam-style · non-financial motivation", prompt:"Which of these is a non-financial method of motivation?",
 o:["Profit sharing","Commission","Team working","Piece rate"], a:2,
 why:"The other three pay workers more money."}
  ]},

/* ---------------- STAGE 5 ---------------- */
{ id:5, type:'weak', title:'Use the theory accurately', blurb:'Find the step where a model is used wrongly, then fix it.', serve:5, pass:4,
  teach:`<p>Examiners reward models that are used accurately. They do not reward a model that is named and then used wrongly. In 2025, Lewin's force field analysis was "frequently only superficially understood". The same year, many students thought training was a hygiene factor.</p>
  <p>Each chain has one step that misuses a model or term. Tap it, then choose the best replacement. Both must be right first time to score.</p>`,
  items:[
    {src:'Based on AQA June 2025 · Paper 3 report (Q1)', q:'Analyse why now may be the right time for the business to make the change, using force field analysis.',
     s:['Managers have identified three driving forces and five restraining forces.','Because there are more restraining forces, the model shows the change should not go ahead.','The strongest driving force is that unit costs are 30% higher than rivals\'.','If managers weaken the main restraining force, staff resistance, through consultation, the change is more likely to succeed.'],
     bad:1, problem:'Lewin\'s model weighs the strength of the forces, not how many there are. The 2025 examiner found terminology being used "without showing a full grasp of the mechanics of the model".',
     fixes:['The model compares the total strength of the forces, so one very strong driving force can outweigh several weak restraining ones.','The model says that a change will always go ahead as long as the managers in charge are committed to it and want it enough.','Restraining forces only count in the model if they come from outside the business, such as competitors or the government.'], fix:0},
    {src:'Based on AQA June 2025 · Paper 2 report (Q2.3)', q:'Analyse how the new training plan might affect motivation, using Herzberg.',
     s:['The manager plans to put every member of staff through a training course.','Training gives staff a chance to develop and take on more responsibility.','Herzberg would see training as a hygiene factor, like working conditions.','Staff who feel they are growing in the job are more likely to work harder and stay.'],
     bad:2, problem:'Training links to growth, advancement and responsibility, which Herzberg treats as motivators. The 2025 examiner named "training was a hygiene factor" as a common misconception.',
     fixes:['Herzberg would see training as a motivator, because it offers growth and the chance of advancement.','Herzberg did not write about training anywhere in his theory, so it cannot be used to support this argument.','Herzberg would see training as a basic need at the bottom of the hierarchy.'], fix:0},
    {src:'Based on AQA June 2022 · Paper 2 report (Q2.3)', q:'Analyse how the restructure might affect the motivation of senior managers, using Maslow.',
     s:['Senior managers already earn high salaries and have secure jobs.','So their physiological and safety needs are likely to be met.','Herzberg\'s hygiene factors show that their esteem needs now matter most.','The restructure removes their decision-making power, so it may lower motivation by reducing status and recognition.'],
     bad:2, problem:'This mixes Herzberg into a Maslow argument. Esteem needs come from Maslow\'s hierarchy. The 2022 examiner noted students confusing Maslow with Herzberg.',
     fixes:['Under Maslow, the next needs that matter to them are esteem needs, such as status and recognition.','Herzberg\'s motivators are the same as Maslow\'s lower-order needs.','Taylor would say they are only interested in money.'], fix:0},
    {src:'Based on AQA June 2018 · Paper 2 report (Q3.2)', q:'Using force field analysis, analyse one driving force and one restraining force for the airline\'s plan to cut cabin crew pay.',
     s:['The cabin crew union could threaten strike action.','This is a restraining force, because it works against the pay cut going ahead.','Falling incomes are expected to reduce demand for flights.','This is a restraining force, because it pushes the airline to cut costs.'],
     bad:3, problem:'A force that pushes the change forward is a driving force. In 2018 a minority of students got the two mixed up.',
     fixes:['This is a driving force.','This is neither force, because it is external.','This is a restraining force, because falling demand reduces the airline\'s revenue and makes the change harder.'], fix:0},
    {src:'Based on AQA June 2025 · Paper 3 report (Q5)', q:'Analyse whether a SWOT analysis would help the business plan its next strategy.',
     s:['The business\'s old factory, with unit costs higher than rivals\', is a threat to the business.','A new competitor entering the market would put further pressure on prices.','This competitor is a threat, because it comes from outside the business.','Seeing both side by side helps managers decide whether to invest in new equipment first.'],
     bad:0, problem:'An old factory is inside the business, so it is a weakness. Threats come from outside. The 2025 examiner found internal weaknesses being mislabelled as threats.',
     fixes:['The business\'s old factory, with unit costs higher than rivals\', is a weakness, because it is a problem inside the business.','The old factory is an opportunity to invest.','The old factory is a strength, because it has already been paid for, so the business has no borrowing to repay on it.'], fix:0},
    {src:'Based on AQA June 2024 · Paper 1 report (Q23)', q:'Analyse how strategic drift may have affected the retailer.',
     s:['Over ten years, customers moved towards shopping online.','The retailer kept opening large stores while rivals invested in websites and delivery.','This shows the retailer had decided to drift its strategy away from online sales.','As a result its market share fell and its stores were left with spare capacity.'],
     bad:2, problem:'Strategic drift is not a decision. It happens when a business keeps the same strategy while the market changes. The 2024 examiner said many students saw it as "a deliberate and planned change in strategy".',
     fixes:['This shows the retailer carried on with the same store-based strategy and failed to adapt as the market changed.','This shows the retailer chose an emergent strategy of drifting.','This shows the retailer planned to drift so that it could save money.'], fix:0},
{src:"Exam-style · price elasticity", q:"Analyse how a 10% price rise might affect the revenue of a business whose product has a PED of −0.4.",
 s:["The business plans to raise its price by 10%.","Because demand is price inelastic, quantity demanded will not change.","Quantity demanded will fall by about 4%, which is smaller than the rise in price.","So total revenue is likely to rise, by roughly 5.6%."],
 bad:1, problem:"Inelastic does not mean demand stays the same. It means quantity demanded changes by a smaller percentage than the price.",
 fixes:["Because demand is price inelastic, quantity demanded will fall by a smaller percentage than the price rises.","Because demand is price inelastic, customers will buy more of the product as the price goes up.","Because demand is price inelastic, the business can raise its price as high as it wants without losing a single customer."], fix:0},
{src:"Exam-style · Boston Matrix", q:"Analyse how the Boston Matrix could help a drinks company decide where to spend its marketing budget.",
 s:["The company's energy drink has a high share of a fast-growing market.","This makes it a star, which usually needs heavy investment to keep its share.","Its cola has a high share of a market that is barely growing.","This makes it a question mark, so it should get most of the marketing budget."],
 bad:3, problem:"A high share of a low-growth market is a cash cow. It usually needs little investment and produces cash for the rest of the portfolio.",
 fixes:["This makes it a cash cow, which can generate cash to fund the star.","This makes it a dog, so the company should withdraw it from the market as soon as it possibly can.","This makes it a problem child, because any product in a slow-growing market needs extra support."], fix:0},
{src:"Exam-style · Ansoff", q:"Analyse the risk of a UK supermarket's plan to open stores in Poland selling its existing range.",
 s:["The supermarket already has a range of products that sells well in the UK.","Opening stores in Poland with the same range is diversification.","It does not know Polish customers' tastes or local competitors as well as it knows the UK.","So there is a real risk that sales in Poland fall short of forecast."],
 bad:1, problem:"Existing products in a new market is market development, not diversification. Diversification would need new products as well.",
 fixes:["Selling the same range in a new country is market development.","Opening stores in Poland is market penetration, because the supermarket is selling more of its existing products.","This is product development, because the stores in Poland count as new products for the business."], fix:0},
{src:"Exam-style · Porter's five forces", q:"Analyse how Porter's five forces could explain low profits for UK budget hotels.",
 s:["Customers can compare hotel prices in seconds on booking websites.","This gives buyers strong bargaining power, so hotels find it hard to raise prices.","New hotels open regularly because barriers to entry are high.","More rivals compete for the same guests, which keeps prices and margins down."],
 bad:2, problem:"If new hotels open regularly, barriers to entry are low, not high. Low barriers mean a high threat of new entrants.",
 fixes:["New hotels open regularly because barriers to entry are low, so the threat of new entrants is high.","New hotels open regularly because suppliers have strong power, which pushes the hotels' costs up.","New hotels open regularly because the threat of substitutes is high, so customers switch to other kinds of holiday."], fix:0},
{src:"Exam-style · resistance to change", q:"Analyse why staff might resist the move to a new IT system, using Kotter and Schlesinger.",
 s:["Managers announced the new system by email without explaining why it was needed.","Staff heard a rumour that it was being brought in to cut jobs, and believed it.","Kotter and Schlesinger would call this low tolerance of change.","Resistance could delay the launch, so managers should explain the reasons openly and involve staff."],
 bad:2, problem:"Believing a rumour because managers have not explained the change is misunderstanding and lack of trust, not low tolerance of change.",
 fixes:["Kotter and Schlesinger would call this misunderstanding and lack of trust.","Kotter and Schlesinger would call this parochial self-interest, because every member of staff only cares about pay.","Kotter and Schlesinger would call this a restraining force, which they say is always stronger than any driving force."], fix:0},
{src:"Exam-style · break-even", q:"Analyse how a price rise could affect a café's break-even output.",
 s:["The café raises the price of a coffee from £3.00 to £3.40.","Variable cost per coffee stays at £1.00.","Contribution per coffee rises from £2.00 to £2.40.","So the café now needs to sell more coffees to cover its fixed costs."],
 bad:3, problem:"Higher contribution per unit means fewer units are needed to cover fixed costs, so break-even output falls.",
 fixes:["So the café now needs to sell fewer coffees to cover its fixed costs, and break-even output falls.","So break-even output rises, because higher prices always mean the café sells fewer coffees each week.","So break-even output stays the same, because the café's fixed costs have not changed."], fix:0}
  ]},

/* ---------------- STAGE 6 ---------------- */
{ id:6, type:'drift', title:'Making and selling', blurb:'Scale and scope, lean and capital intensive, capacity and stock.', serve:10, pass:8,
  labels:TF, showLabel:'True or false?',
  teach:`<p>Operations has several pairs that students mix up. Economies of scale come from producing more. Economies of scope come from producing a wider range. Lean production is about cutting waste. Capital intensive is about using more machinery compared with labour.</p>
  <p>The 2024 Paper 3 report put it well: most students knew high capacity utilisation meant the business was busy, but fewer understood what that meant for costs and customers.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 2 report (Q1.4)', q:'A supermarket starts selling clothes, insurance and petrol as well as food.', ok:false,
     text:'The savings from sharing its stores, brand and delivery network across these products are economies of scale.',
     why:'Savings from producing a wider range are economies of scope. Economies of scale come from producing more of the same. In 2026 students mixed these up.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q1.4)', q:'A supermarket doubles the number of stores selling the same range.', ok:true,
     text:'Buying stock in larger quantities lowers its average cost per item. This is an economy of scale.',
     why:'Bulk buying is a purchasing economy of scale.'},
    {src:'Based on AQA June 2019 · Paper 1 report (Q3)', q:'A business grows so large that communication between departments becomes slow.', ok:true,
     text:'This is a diseconomy of scale, so its unit costs rise.',
     why:'Diseconomies of scale mean average cost per unit rises as the business grows. The 2019 examiner thought confusion about the term "unit costs" caused errors on this.'},
    {src:'Based on AQA June 2024 · Paper 1 report (Q24)', q:'A manufacturer introduces lean production.', ok:false,
     text:'Lean production means replacing workers with machines.',
     why:'That is becoming more capital intensive. Lean production means cutting waste, such as stock, defects and waiting time, through methods like JIT and kaizen. The 2024 examiner noted confusion with capital-intensive production.'},
    {src:'Based on AQA June 2023 · Paper 2 report', q:'A packaging firm becomes more capital intensive.', ok:true,
     text:'It uses a higher proportion of machinery and technology compared with labour.',
     why:'The 2023 examiner said students who did not know the term "capital intensive" found it hard to give a creditworthy answer.'},
    {src:'Based on AQA June 2024 · Paper 3 report (Q1)', q:'A dessert parlour is running at 98% capacity utilisation.', ok:false,
     text:'This is always good for the business, because fixed costs are spread over more customers.',
     why:'Fixed cost per customer is low, but there is no room for extra demand, staff are stretched, queues form and there is little time for maintenance.'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q3.2)', q:'A business reorders stock when it falls to 400 units. Stock is never allowed to fall below 150 units.', ok:false,
     text:'The buffer stock is 400 units.',
     why:'400 is the re-order level. Buffer stock is the minimum held, 150 units. In 2022 many students used the re-order level instead of the buffer stock.'},
    {src:'Based on AQA June 2019 · Paper 1 report (Q11)', q:'An order is placed on 3 March and the delivery arrives on 10 March.', ok:true,
     text:'The lead time is 7 days.',
     why:'Lead time is the gap between ordering and receiving stock. It was the idea students were least sure of in the 2019 inventory question.'},
    {src:'Based on AQA June 2018 · Paper 2 report (Q3.1)', q:'An airline fills more of the seats on each flight.', ok:true,
     text:'The cost per seat falls, because the fixed cost of running the flight is shared across more passengers.',
     why:'This is capacity utilisation at work. The 2018 examiner said answers that explained the margin per ticket this way were "very much in the minority".'},
{src:"Exam-style · just-in-time", q:"A car maker moves to just-in-time production.", ok:false,
 text:"It will need a much larger warehouse for its components.",
 why:"Under JIT components arrive just before they are needed, so very little stock is held."},
{src:"Exam-style · just-in-time", q:"A bakery uses just-in-time deliveries for its flour.", ok:true,
 text:"A one-day delay from its supplier could stop production.",
 why:"With little or no buffer stock, the bakery depends on every delivery arriving on time."},
{src:"Exam-style · lean production", q:"A factory introduces kaizen.", ok:false,
 text:"Kaizen means making large, one-off changes to the production process.",
 why:"Kaizen is continuous improvement: many small changes, often suggested by the staff who do the work."},
{src:"Exam-style · capacity utilisation", q:"A factory is running at 60% capacity utilisation.", ok:true,
 text:"Its fixed cost per unit is higher than it would be at 90%.",
 why:"The same fixed costs are spread over fewer units."},
{src:"Exam-style · capacity utilisation", q:"A business wants higher capacity utilisation, but demand will not grow.", ok:true,
 text:"It could reduce its maximum capacity, for example by closing a production line.",
 why:"Utilisation = output ÷ capacity. If output cannot rise, cutting capacity (rationalisation) raises the percentage."},
{src:"Exam-style · quality", q:"A manufacturer talks about its approach to quality.", ok:false,
 text:"Quality assurance means inspecting finished products at the end of the line to find faults.",
 why:"That is quality control. Quality assurance tries to stop faults happening by building quality into every stage."},
{src:"Exam-style · productivity", q:"Labour productivity rises by 10% and wages stay the same.", ok:true,
 text:"Labour cost per unit falls.",
 why:"The same wage bill is spread over more units."},
{src:"Exam-style · productivity", q:"Wages rise by 5% and labour productivity rises by 5%.", ok:false,
 text:"Labour cost per unit rises by 5%.",
 why:"Higher pay is matched by more output per worker, so labour cost per unit stays roughly the same."},
{src:"Exam-style · inventory", q:"A clothing retailer decides to hold more buffer stock.", ok:true,
 text:"This lowers the risk of running out but raises storage costs.",
 why:"More stock protects against late deliveries or unexpected demand, but it takes space, ties up cash and may go out of fashion."},
{src:"Exam-style · inventory", q:"An inventory control chart shows stock hitting zero before each delivery arrives.", ok:false,
 text:"The re-order level has been set too high.",
 why:"Stock is running out, so the re-order level is too low for the lead time, or deliveries are taking longer than planned."},
{src:"Exam-style · economies of scale", q:"Two firms make the same product. One is ten times bigger than the other.", ok:false,
 text:"The larger firm will always have lower unit costs.",
 why:"Diseconomies of scale can push unit costs up, and a smaller firm may be more flexible or better run."},
{src:"Exam-style · technology", q:"A business automates part of its production line.", ok:true,
 text:"This can raise fixed costs while lowering variable cost per unit.",
 why:"The machines are a large fixed cost, but each unit may need less labour."},
{src:"Exam-style · flexibility", q:"A trainer brand lets customers design their own colours online, then makes the trainers in a large automated factory.", ok:false,
 text:"This is mass production of one standard product.",
 why:"This is mass customisation: products tailored to each customer, made with the efficiency of large-scale production."},
{src:"Exam-style · lean production", q:"A business adopts lean production.", ok:true,
 text:"It aims to cut waste, including waiting time and faulty products.",
 why:"Lean production targets every kind of waste: stock, defects, waiting, movement and overproduction."},
{src:"Exam-style · suppliers", q:"A manufacturer describes one of its suppliers as very dependable.", ok:false,
 text:"This mainly means the supplier charges low prices.",
 why:"Dependability means delivering the right quantity and quality on time, every time. Price is a separate factor."}
  ]},

/* ---------------- STAGE 7 ---------------- */
{ id:7, type:'mcq', title:'Strategy words', blurb:'Ansoff, differentiation, emergent strategy, B2B and more.', serve:8, pass:6,
  teach:`<p>Strategy questions often turn on one word. In 2024, "a worrying number of students" wrote about diversification when the question was about differentiation. In 2026, most students answered a question about selling to businesses as though the customers were members of the public.</p>
  <p>Pick the option that uses the term correctly.</p>`,
  items:[
    {src:'Based on AQA June 2018 · Paper 1 report (Q22)', prompt:'A UK bakery chain starts selling its existing range of bread in France. Which Ansoff strategy is this?',
     o:['Market penetration','Market development','Product development','Diversification'], a:1,
     why:'An existing product in a new market. The 2018 examiner reported answers that confused market development with market penetration.'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q22)', prompt:'The same bakery runs price promotions to win more customers in its existing UK shops. Which Ansoff strategy is this?',
     o:['Market penetration','Market development','Product development','Diversification'], a:0,
     why:'An existing product in an existing market. This is the lowest-risk Ansoff strategy.'},
    {src:'Based on AQA June 2019 · Paper 1 report (Q8)', prompt:'A toy maker buys a chain of coffee shops. Which is correct?',
     o:['Market development: low risk','Diversification: the highest risk','Product development: medium risk','Market penetration: the lowest risk'], a:1,
     why:'A new product in a new market is diversification, the riskiest of the four. In 2019 fewer than half of students showed they understood both market penetration and diversification.'},
    {src:'Based on AQA June 2024 · Paper 3 report (Q6)', prompt:'A question asks how innovation helps a business differentiate its products. What is differentiation?',
     o:['Moving into a new market with a new product, the riskiest of the four options','Making a product different from rivals\' so customers see it as distinctive','Charging different segments different prices for the same product','Cutting costs below those of rivals so prices can be lower'], a:1,
     why:'The first option is diversification. The 2024 examiner saw "a worrying number of students writing about diversification instead of differentiation".'},
    {src:'Based on AQA June 2018 · Paper 1 report (Q14)', prompt:'A hotel chain plans to open new city-centre hotels. A pandemic hits and it quickly starts renting rooms out as offices. What is this switch?',
     o:['Strategic drift','Emergent strategy','Intended strategy','Diversification by takeover'], a:1,
     why:'An emergent strategy is an unplanned response to events. Strategic drift is the opposite problem: failing to adapt. In 2018 students were sure about emergent strategy but much less sure about strategic drift.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q3.1)', prompt:'A garden machinery maker sells to garden centres, not to the public. What matters most in keeping these customers?',
     o:['Eye-catching packaging and in-store displays that encourage impulse buying by shoppers','Reliable delivery, trade prices and a good relationship with each buyer','A national TV advertising campaign aimed at families with gardens','Celebrity endorsements and influencer posts on social media'], a:1,
     why:'This is B2B. Business buyers buy in bulk, repeatedly and on rational grounds, so reliability, price and relationships matter. In 2026 most students wrote about individual consumers instead.'},
    {src:'Based on AQA June 2024 · Paper 3 report (Q5)', prompt:'A dessert business plans to grow by franchising. Which statement is correct?',
     o:['The business opens every new outlet itself and employs a manager to run each one','Franchisees pay to use the brand and run their own outlets, so the business grows without funding each site','Franchising is a form of takeover, because the business buys each new outlet from its owner','Franchisees become employees of the business and are paid a salary, plus a bonus linked to the profit of their outlet'], a:1,
     why:'The franchisor supplies the brand and system. The franchisee invests in and runs the outlet, usually paying a fee and royalties. The 2024 examiner found "some patchy understanding of franchising".'},
    {src:'Based on AQA June 2025 · Paper 1 report (Q21)', prompt:'A UK business decides to become a multinational. What does that mean?',
     o:['It sells its products to customers abroad, exporting them from its factory in the UK','It has operations, such as factories or offices, in more than one country','It sells online to customers in any country through its website','It buys most of its materials and components from overseas suppliers'], a:1,
     why:'Exporting is not the same as being a multinational. The 2025 examiner noted that some answers "focused mainly on exporting".'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q1.1)', prompt:'What is extrapolation?',
     o:['Extending a past trend to predict the future','Measuring how closely two variables are related','Asking customers about their future buying plans','Testing a product in one area before a full launch'], a:0,
     why:'The second option is correlation. The 2022 examiner noted some students confused the two.'},
{src:"Exam-style · Porter's generic strategies", prompt:"A supermarket keeps prices below rivals by buying in huge volumes and keeping its stores basic. Which of Porter's strategies is this?",
 o:["Cost leadership","Differentiation","Differentiation focus","Market development"], a:0,
 why:"It competes on having the lowest costs in a broad market."},
{src:"Exam-style · Porter's generic strategies", prompt:"A small brewery sells premium beers only to specialist bars, at high prices. Which of Porter's strategies is this?",
 o:["Cost focus","Differentiation focus","Cost leadership","Market penetration"], a:1,
 why:"It offers something distinctive to a narrow segment."},
{src:"Exam-style · Porter's generic strategies", prompt:"What does Porter mean by a business being \"stuck in the middle\"?",
 o:["Having neither the lowest costs nor a clear point of difference","Operating in a market that is not growing","Being halfway through a change programme when demand changes","Selling to businesses and the public at once"], a:0,
 why:"Without either a cost advantage or a differentiation advantage, the business has no clear reason for customers to choose it."},
{src:"Exam-style · Porter's generic strategies", prompt:"A business is \"stuck in the middle\". What would Porter advise it to do?",
 o:["Choose a clear focus on either lower costs or a real point of difference","Cut its prices and improve quality at the same time across its whole range","Expand into as many markets as possible","Copy whatever its biggest rival does"], a:0,
 why:"Porter argued a business needs a clear source of competitive advantage: either the lowest costs or a distinctive product."},
{src:"Exam-style · Porter's generic strategies", prompt:"Which of these businesses is following a cost focus strategy?",
 o:["A low-cost hotel chain only for business travellers","A luxury hotel brand found in capital cities around the world","A national supermarket chain with the lowest prices in the whole country","A designer clothing label"], a:0,
 why:"Cost focus means competing on low cost within a narrow segment. The supermarket is cost leadership across a broad market."},
{src:"Exam-style · mission and objectives", prompt:"Which of these is an objective rather than a mission statement?",
 o:["To bring joy to every home","To increase market share from 12% to 15% by 2028","To be the most trusted and best-loved name in British travel","To put customers at the heart of everything"], a:1,
 why:"An objective is a specific, measurable target with a time limit. The others are broad statements of purpose."},
{src:"Exam-style · objectives", prompt:"Which of these is a functional objective?",
 o:["To become the market leader in Europe","To cut labour turnover to 8% within two years","To double the size of the whole group through takeovers by 2030","To enter the Asian market through acquisition"], a:1,
 why:"It is a target for one function, HR. The others are corporate objectives for the whole business."},
{src:"Exam-style · strategic direction", prompt:"What is retrenchment?",
 o:["Cutting back the scale of the business, for example by closing sites","Moving into new markets with new products to spread the risk","Raising prices to improve margins","Investing in new technology to replace older machinery"], a:0,
 why:"Retrenchment means shrinking the business, often to cut costs or focus on its strongest areas."},
{src:"Exam-style · international operations", prompt:"A UK bank moves its own call centre to India. The bank still employs the staff. What is this?",
 o:["Offshoring of the call centre","Outsourcing","Franchising","A joint venture"], a:0,
 why:"Offshoring moves an activity abroad. It only becomes outsourcing if another firm does the work."},
{src:"Exam-style · international operations", prompt:"A UK bank pays an Indian company to run its call centre. What is this?",
 o:["Offshoring, because the bank still employs the staff","Outsourcing, because another firm does the work","Delayering, because a layer of staff is removed","Licensing, because the Indian firm uses the brand"], a:1,
 why:"Paying another business to carry out an activity is outsourcing. Here it is also offshoring, because the work is done abroad."},
{src:"Exam-style · mergers", prompt:"Two businesses merge and say the deal will create synergy. What does this mean?",
 o:["Together they perform better than the two did separately","Both keep separate brands and head offices","All senior managers keep their jobs","Regulators have approved the deal"], a:0,
 why:"Synergy is the idea that 2 + 2 = 5, for example through shared costs or combined expertise. In practice it is often overestimated."}
  ]},

/* ---------------- STAGE 8 ---------------- */
{ id:8, type:'mcq', title:'Outside the business', blurb:'Fiscal and monetary, exchange rates, elasticity, law and ethics.', serve:8, pass:6,
  teach:`<p>The external environment causes some of the most reported mix-ups. In 2025 the question on fiscal policy was the hardest on Paper 1, because students confused it with monetary policy and with legislation. In 2022 the most common error on exchange rates was getting the mechanism "entirely backwards".</p>
  <p>Take your time with the direction of each effect.</p>`,
  items:[
    {src:'Based on AQA June 2019 · Paper 1 report (Q9)', prompt:'The government increases subsidies to farmers. What kind of policy is this?',
     o:['Monetary policy','Fiscal policy','Legislation','Exchange rate policy'], a:1,
     why:'Fiscal policy is government spending and taxation. Monetary policy is interest rates, set by the Bank of England. In 2019 a significant number could not tell which a subsidy was.'},
    {src:'Based on AQA June 2025 · Paper 1 report (Q19)', prompt:'Which of these is fiscal policy?',
     o:['The Bank of England raises interest rates','The government raises VAT on medicines','A new law sets safety standards for medical devices','The pound falls against the euro'], a:1,
     why:'A tax change is fiscal policy. In 2025 fiscal policy "was often confused with monetary policy and sometimes with legislation".'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q1.4)', prompt:'A product has a price elasticity of demand of −0.5. The price rises by 10%. What happens?',
     o:['Demand does not change, because it is inelastic','Demand falls by 5% and revenue rises','Demand falls by 20%','Demand rises by 5%'], a:1,
     why:'Inelastic means demand changes by a smaller percentage than price, not that it stays the same. The 2022 examiner called "no change in demand" a common misconception.'},
    {src:'Based on AQA June 2022 · Paper 1 report (Q8)', prompt:'Demand for a product is price inelastic. The business raises its price. What happens to total revenue?',
     o:['It rises','It falls','It stays the same','It cannot be known'], a:0,
     why:'Quantity falls by a smaller percentage than the price rises, so revenue goes up. In 2022 a wrong answer was more popular than the right one because students did not understand price inelastic demand.'},
    {src:'Based on AQA June 2018 · Paper 2 report (Q3.1)', prompt:'Air travel has an income elasticity of demand of +1.5. What does this tell you?',
     o:['If the price of flights falls by 10%, demand rises by about 15%','If incomes fall by 10%, demand falls by about 15%','Demand for air travel is price inelastic, so fares can rise','Air travel is an inferior good, so demand falls as incomes rise'], a:1,
     why:'Income elasticity links demand to incomes, not to price. In 2018 many students confused the income elasticity figure with price elasticity.'},
    {src:'Based on AQA June 2026 · Paper 1 report (Q11)', prompt:'A budget supermarket\'s own-brand range has an income elasticity of −0.4. Incomes rise by 5%. What happens to demand?',
     o:['It rises by 2%','It falls by 2%','It rises by 0.4%','No change, because it is inelastic'], a:1,
     why:'Negative YED means an inferior good: as incomes rise, people buy less. −0.4 × 5 = −2%. In 2026 most students could not apply a negative income elasticity, which made this the most challenging multiple-choice question.'},
    {src:'Based on AQA June 2022 · Paper 2 report (Q3.4)', prompt:'The pound falls against the euro. A UK business exports to Spain and buys all its materials in the UK. What is the likely effect?',
     o:['Its costs rise, because the materials it needs to export its products cost more','Its products become cheaper for Spanish customers, so sales are likely to rise','Its products become more expensive in euros, so Spanish sales are likely to fall','There is no effect on the business, because it buys all its materials from UK suppliers'], a:1,
     why:'A weaker pound means each euro buys more pounds, so UK goods cost less in euros. The examiner also said import effects were irrelevant here because the business used UK suppliers.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q2.3)', prompt:'A question asks about the effect of new legislation on businesses. Which of these is about legislation?',
     o:['A business pays above the minimum wage because it is the right thing to do','A business must now report its carbon emissions by law, which adds to its costs','A business chooses fair trade suppliers even though they charge it higher prices','A business gives 1% of its profit each year to local charities chosen by its staff'], a:1,
     why:'Legislation is compulsory. The other three are voluntary ethical choices. In 2026 many students wrote about ethics when the question was about legislation.'},
    {src:'Based on AQA June 2022 · Paper 1 report (Q11)', prompt:'A country has poor roads and an unreliable power supply. In a SWOT analysis for a business thinking of moving there, what is this?',
     o:['Weak infrastructure, which could be a threat','A weakness of the business, because it will raise its costs','A strength, because land and labour are likely to be cheap','Monetary policy, because the government controls it'], a:0,
     why:'Infrastructure means the basic networks a country provides, such as transport, energy and communications. It is external, so it is not a weakness of the business. In 2022 not understanding infrastructure caused the problems on this question.'},
{src:"Exam-style · interest rates", prompt:"The Bank of England raises interest rates. Which business is likely to be hit hardest?",
 o:["A highly geared house builder","A discount supermarket with large cash reserves","A water company with no debt selling an essential service","A software firm with no borrowing that exports to the USA"], a:0,
 why:"It pays more interest on its borrowing, and its customers face higher mortgage costs, so demand for new homes falls too."},
{src:"Exam-style · exchange rates", prompt:"The pound rises against the dollar. A UK clothing retailer buys most of its stock from US suppliers, priced in dollars. What happens?",
 o:["Its stock becomes cheaper in pounds, so its costs fall","Its stock becomes dearer in pounds, so its costs rise","Its UK sales fall because its prices rise","Nothing, because it sells only in the UK"], a:0,
 why:"Each pound buys more dollars, so the same dollar price costs fewer pounds."},
{src:"Exam-style · exchange rates", prompt:"The pound rises in value against other currencies. Which statement is correct?",
 o:["UK exports become cheaper abroad and imports become more expensive in the UK","UK exports become dearer abroad and imports cheaper in the UK","UK exports and imports both become cheaper","There is no effect on prices, only on profit"], a:1,
 why:"A strong pound makes imports cheap and exports dear."},
{src:"Exam-style · inflation", prompt:"Inflation is 6%. A worker's pay rises by 3%. What has happened to her real income?",
 o:["It has risen by 3%, because her pay went up","It has fallen by roughly 3%, because prices rose faster than her pay","It has risen by 9%","It is unchanged, because her pay has gone up"], a:1,
 why:"Prices are rising faster than her pay, so she can buy less than before."},
{src:"Exam-style · economic growth", prompt:"GDP falls for two quarters in a row. Which business is likely to see the biggest fall in demand?",
 o:["A luxury cruise operator (YED +2.5)","A discount supermarket chain (YED −0.3)","A water company (YED +0.1)","A bakery selling bread (YED +0.2)"], a:0,
 why:"With a YED of +2.5, demand falls much faster than incomes. The supermarket's negative YED means demand may even rise."},
{src:"Exam-style · unemployment", prompt:"Unemployment rises sharply in an area. What is a likely benefit for a local employer?",
 o:["It becomes easier to recruit, and pressure for pay rises falls","Demand for its luxury products rises","It has to pay higher wages to keep its staff","Its exports become cheaper for overseas buyers"], a:0,
 why:"More people are looking for work, so vacancies are easier to fill and staff are less likely to push for higher pay."},
{src:"Exam-style · ethics and the law", prompt:"Which of these is an ethical choice rather than a legal requirement?",
 o:["Paying the National Living Wage to staff aged 21 and over","Paying a supplier in a poor country more than the market price","Following health and safety rules","Paying corporation tax on its profits"], a:1,
 why:"The others are required by law. Paying above the market price is a voluntary choice."},
{src:"Exam-style · price elasticity", prompt:"Demand for a product is price elastic. The business cuts its price. What happens to total revenue?",
 o:["It rises","It falls","It stays the same","It depends only on costs"], a:0,
 why:"Quantity demanded rises by a bigger percentage than the price falls, so revenue goes up."},
{src:"Exam-style · income elasticity", prompt:"A product has an income elasticity of +0.5. Incomes rise by 4%. What happens to demand?",
 o:["It rises by 2%","It rises by 8%","It falls by 2%","It rises by 0.5%"], a:0,
 why:"0.5 × 4% = 2%. Positive YED means demand moves in the same direction as incomes."},
{src:"Exam-style · price elasticity", prompt:"A product has a PED of −2. The business raises its price by 5%. What happens?",
 o:["Quantity falls by about 10% and revenue falls","Quantity falls by about 2.5% and revenue rises","Quantity falls by 5% and revenue stays the same","Quantity rises by 10% and revenue rises"], a:0,
 why:"−2 × 5% = −10%. Demand is price elastic, so the fall in quantity outweighs the higher price and revenue falls."},
{src:"Exam-style · exchange rates", prompt:"The pound falls 10% against the euro. A UK exporter keeps its sterling prices the same. Demand in Europe is price inelastic. What happens?",
 o:["Euro prices fall, but sales rise only a little","Euro prices fall and sales rise by more than 10%","Euro prices rise and sales fall a little","Nothing changes, as prices are in pounds"], a:0,
 why:"European customers pay fewer euros, but because demand is inelastic the rise in sales is smaller than the fall in price."}
  ]},

/* ---------------- STAGE 9 ---------------- */
{ id:9, type:'mcq', title:'Read the key word', blurb:'One word in the question decides which concept you need.', serve:8, pass:6,
