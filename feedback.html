async function fetchSheet(id,label){
  // Try multiple methods to get the sheet data
  const methods=[
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`,
    `https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=0`,
    `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`
  ];
  for(const url of methods){
    try{
      const r=await fetch(url);
      if(!r.ok){console.log(`[${label}] ${url.split('?')[1]||'base'}: HTTP ${r.status}`);continue}
      const c=await r.text();
      if(c.startsWith("<!")||c.includes("accounts.google")){console.log(`[${label}] Got login page — sheet not shared`);continue}
      const rows=csv(c);
      console.log(`[${label}] Got ${rows.length} rows from ${url.includes('gviz')?'gviz':'csv export'}`);
      if(rows.length>1)return rows;
    }catch(e){console.log(`[${label}] Error: ${e.message}`)}
  }
  console.log(`[${label}] All methods failed`);
  return[];
}

function csv(t){const rows=[];let row=[],cell="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=""}else if(c==='\n'||(c==='\r'&&t[i+1]==='\n')){row.push(cell);cell="";rows.push(row);row=[];if(c==='\r')i++}else cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}return rows}

function parseRows(rows){
  if(rows.length<2)return[];const d=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||!r[1])continue;
    // Handle both schemas: D=combined "13/16" or D=Marks E=MarkAwarded
    const mr=(r[3]||"").trim();let ma="",mt="";
    const m=mr.match(/(\d+)\s*\/\s*(\d+)/);
    if(m){ma=m[1];mt=m[2]}else{ma=mr;mt=mr}
    // Detect schema by checking if column 4 looks like a level or a number
    const col4=(r[4]||"").trim();
    let lv,w1,w2,e1,e2,tool;
    if(col4.match(/^(Good|Reasonable|Weak|Poor)$/i)||!col4.match(/^\d/)){
      // Schema: D=Marks(combined), E=Level, F=WWW1, G=WWW2, H=EBI1, I=EBI2, J=Tool
      lv=col4;w1=(r[5]||"").trim();w2=(r[6]||"").trim();e1=(r[7]||"").trim();e2=(r[8]||"").trim();tool=(r[9]||"").trim();
    } else {
      // Schema: D=Marks, E=MarkAwarded, F=Level, G=WWW1, H=WWW2, I=EBI1, J=EBI2, K=Tool
      ma=(r[4]||ma).trim();lv=(r[5]||"").trim();w1=(r[6]||"").trim();w2=(r[7]||"").trim();e1=(r[8]||"").trim();e2=(r[9]||"").trim();tool=(r[10]||"").trim();
    }
    d.push({ts:r[0]||"",nm:(r[1]||"").trim(),q:(r[2]||"").trim(),ma,mt,lv,w1,w2,e1,e2,tool,_raw:r});
  }
  return d;
}

function filt(data,s){
  const names=s.sh||[s.fn.toLowerCase()];
  const ex=s.ex;
  const isAmbiguous=s.fn.toLowerCase()==="avleen";
  console.log(`[Filter] Looking for ${s.fn} ${s.sn} (${ex}). Search names: ${names.join(', ')}. Total rows to search: ${data.length}`);
  const matched=data.filter(d=>{
    const n=d.nm.toLowerCase().trim();
    if(names.some(sn=>n===sn))return true;
    if(!isAmbiguous&&names.some(sn=>n.includes(sn)||sn.includes(n)))return true;
    if(isAmbiguous){
      const surname=s.sn.toLowerCase();
      const note=(s.nt||"").toLowerCase();
      if(n.includes(surname)||n.includes(note))return true;
    }
    if(ex){
      if(d._raw&&d._raw.some(cell=>(cell||"").trim()===ex))return true;
      if(d.nm.includes(ex))return true;
    }
    return false;
  });
  console.log(`[Filter] Found ${matched.length} matches for ${s.fn}: ${matched.map(m=>m.q).join(' | ')}`);
  return matched;
}

function fbPr(s,p,ad,gd){
  const allSubs=[...ad,...gd];
  let t=`You are ${s.fn}'s A-Level Business teacher. Write bullet-pointed feedback based on ALL the data below. Be specific — name exact topics, question types, and what they did or didn't do. No generic comments like "some areas strong" or "keep practising". Every bullet must name a specific topic or skill.\n\n`;
  t+=`FORMAT:\n## WWW\n- bullet (specific topic or skill they demonstrated, max 20 words)\n(4-6 bullets)\n\n## EBI\n- bullet (specific topic or error, what exactly went wrong)\n(4-6 bullets)\n\n## TARGETS\n- bullet (specific action: name the topic, the tool to use, or the question type to practise)\n(3-5 bullets)\n\n`;
  t+=`RULES:\n- Every WWW bullet must name the specific topic or skill (e.g. "Correct on all legal structure and liability questions in MCQ Pack 1")\n- Every EBI bullet must name the specific error (e.g. "Got Q46 wrong — PED is inelastic so a price rise increases revenue, not decreases it")\n- Every TARGET must be a specific action (e.g. "Practise 5 PED/revenue questions using the Calculation Practice tool this week")\n- If a weakness from the KAT mock also appears in their submissions, call it out as a pattern\n- Never write "A*" — say "top grade"\n- Bullets only, no paragraphs\n\n`;

  t+=`=== KAT MOCK DATA ===\n`;
  t+=`MCQs: ${p.mcq.www}. ${p.mcq.ebi}\n`;
  t+=`Calculations: ${p.calc.www}. ${p.calc.ebi}\n`;
  t+=`Analysis (AO3): ${p.ao3.www}. ${p.ao3.ebi}\n`;
  t+=`Evaluation: ${p.eval.www}. ${p.eval.ebi}\n`;
  t+=`Application: ${p.app.www}. ${p.app.ebi}\n`;
  t+=`Data use: ${p.data.www}. ${p.data.ebi}\n`;
  t+=`Overall: ${p.std.www}. ${p.std.ebi}\n\n`;

  if(allSubs.length){
    t+=`=== ALL SUBMISSIONS (${allSubs.length} total) ===\n`;
    allSubs.forEach(e=>{
      t+=`- "${e.q}": ${e.ma}/${e.mt} (${e.lv}) [${e.tool||'unknown'}]`;
      if(e.w1)t+=`\n  WWW: ${e.w1}`;if(e.w2)t+=` | ${e.w2}`;
      if(e.e1)t+=`\n  EBI: ${e.e1}`;if(e.e2)t+=` | ${e.e2}`;
      t+=`\n`;
    });
  } else {
    t+=`No submissions yet. Tell them to start submitting work — the more they do, the better the feedback.\n`;
  }
  return t;
}

function render(s,p,ad,gd,fb){
  hi("ldV");sh("resV");const sv=document.getElementById("stuV");sv.classList.remove("hide");
  const allSubs=[...ad,...gd].sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  const total=allSubs.length;
  const good=allSubs.filter(d=>d.lv.toLowerCase()==="good").length;
  const reas=total-good;

  let h=`<div class="ban"><h2>${esc(s.fn)} ${esc(s.sn)}</h2><span class="badge bg-${gcl(p.g)}">KAT Grade: ${p.g}</span></div>`;
  h+=`<div class="sbar" style="grid-template-columns:1fr 1fr">
    <div class="st nv"><div class="v">${total}</div><div class="l">Submissions</div></div>
    <div class="st nv"><div class="v">${p.g}</div><div class="l">KAT Grade</div></div>
  </div>`;

  // Build enriched category data by merging profile + sheet submissions
  const mcqSubs=allSubs.filter(e=>e.tool==="mcqpack"||e.q.toLowerCase().includes("mcq"));
  const essaySubs=allSubs.filter(e=>e.tool==="openessay"||e.tool==="marker"||e.q.toLowerCase().includes("essay")||e.q.toLowerCase().includes("extent")||e.q.toLowerCase().includes("legislation"));
  
  // Enrich MCQ card with submission data
  let mcqWww=p.mcq.www, mcqEbi=p.mcq.ebi;
  if(mcqSubs.length){
    const subWwws=mcqSubs.map(e=>e.w1).filter(w=>w&&w!=="—");
    const subEbis=mcqSubs.map(e=>e.e1).filter(e=>e&&e!=="—");
    if(subWwws.length)mcqWww+=" | Submissions: "+subWwws.join(". ");
    if(subEbis.length)mcqEbi+=" | Submissions: "+subEbis.join(". ");
  }
  // Enrich Analysis/Eval/App with essay submission data
  let ao3Www=p.ao3.www, ao3Ebi=p.ao3.ebi;
  let evalWww=p.eval.www, evalEbi=p.eval.ebi;
  let appWww=p.app.www, appEbi=p.app.ebi;
  if(essaySubs.length){
    const eWwws=essaySubs.map(e=>e.w1).filter(w=>w&&w!=="—");
    const eEbis=essaySubs.map(e=>e.e1).filter(e=>e&&e!=="—");
    if(eWwws.length)ao3Www+=" | Essays: "+eWwws.join(". ");
    if(eEbis.length)ao3Ebi+=" | Essays: "+eEbis.join(". ");
    const eWww2=essaySubs.map(e=>e.w2).filter(w=>w&&w!=="—");
    const eEbi2=essaySubs.map(e=>e.e2).filter(e=>e&&e!=="—");
    if(eWww2.length)appWww+=" | Essays: "+eWww2.join(". ");
    if(eEbi2.length)evalEbi+=" | Essays: "+eEbi2.join(". ");
  }

  const cats=[
    {t:"MCQs",www:mcqWww,ebi:mcqEbi,tag:p.mcq.tag},
    {t:"Calculations",www:p.calc.www,ebi:p.calc.ebi,tag:p.calc.tag},
    {t:"Analysis (AO3)",www:ao3Www,ebi:ao3Ebi,tag:p.ao3.tag},
    {t:"Evaluation & Conclusions",www:evalWww,ebi:evalEbi,tag:p.eval.tag},
    {t:"Application & Models",www:appWww,ebi:appEbi,tag:p.app.tag},
    {t:"Data in Essays",www:p.data.www,ebi:p.data.ebi,tag:p.data.tag}
  ];
  h+=`<div class="cg">`;
  cats.forEach(c=>{
    const col=c.tag==="gn"?"c-gn":c.tag==="rd"?"c-rd":"c-am";
    const tc=c.tag==="gn"?"tag-gn":c.tag==="rd"?"tag-rd":"tag-am";
    const tt=c.tag==="gn"?"Strong":c.tag==="rd"?"Needs work":"Developing";
    h+=`<div class="cc ${col}"><h4>${c.t}</h4><span class="tag ${tc}">${tt}</span>`;
    if(c.www&&c.www!=="—")h+=`<ul style="margin:6px 0 3px 12px;font-size:.76rem;line-height:1.45"><li style="color:var(--gn)">${esc(c.www)}</li></ul>`;
    if(c.ebi&&c.ebi!=="—")h+=`<ul style="margin:3px 0 0 12px;font-size:.76rem;line-height:1.45"><li style="color:var(--am)">${esc(c.ebi)}</li></ul>`;
    h+=`</div>`;
  });
  h+=`</div>`;

  const sc=p.std.tag==="gn"?"c-gn":p.std.tag==="rd"?"c-rd":"c-nv";
  h+=`<div class="cc ${sc}" style="margin-bottom:16px"><h4>Overall Standard</h4><ul style="margin:6px 0 0 12px;font-size:.78rem;line-height:1.5"><li style="color:var(--gn)">${esc(p.std.www)}</li><li style="color:var(--am)">${esc(p.std.ebi)}</li></ul></div>`;

  if(total>0){
    h+=`<div class="fl"><h3>Your submissions</h3><ul>`;
    allSubs.slice().reverse().slice(0,10).forEach(e=>{
      const lc=e.lv.toLowerCase()==="good"?"var(--gn)":"var(--am)";
      h+=`<li><strong>${esc(e.q.length>55?e.q.substring(0,55)+"...":e.q)}</strong> — <span style="color:${lc}">${esc(e.ma)}/${esc(e.mt)} (${esc(e.lv)})</span>`;
      if(e.w1)h+=`<br><span style="font-size:.75rem;color:var(--gn)">✓ ${esc(e.w1)}</span>`;
      if(e.e1)h+=`<br><span style="font-size:.75rem;color:var(--am)">→ ${esc(e.e1)}</span>`;
      h+=`</li>`;
    });
    h+=`</ul></div>`;
  } else {
    h+=`<div class="fl f-am"><h3>No submissions yet</h3><ul><li>You haven't submitted any work through the website tools yet</li><li>Start using the open essay tool, calculation practice, or knowledge quizzes</li><li>The more you submit, the more specific this feedback becomes</li></ul></div>`;
  }

  if(fb){const parsed=parseFB(fb);
    if(parsed.www)h+=`<div class="fl f-gn"><h3>What's going well</h3>${parsed.www}</div>`;
    if(parsed.ebi)h+=`<div class="fl f-am"><h3>Even better if</h3>${parsed.ebi}</div>`;
    if(parsed.targets)h+=`<div class="fl f-nv"><h3>Your targets</h3>${parsed.targets}</div>`;
  } else {
    h+=`<div class="fl f-gn"><h3>What's going well</h3><ul>`;
    cats.filter(c=>c.d.tag==="gn").forEach(c=>{h+=`<li>${esc(c.d.www)}</li>`});
    h+=`<li>${esc(p.std.www)}</li></ul></div>`;
    h+=`<div class="fl f-am"><h3>Even better if</h3><ul>`;
    cats.filter(c=>c.d.tag!=="gn").forEach(c=>{h+=`<li>${esc(c.d.ebi)}</li>`});
    h+=`</ul></div>`;
  }

  h+=`<div class="imp"><button class="ibtn" id="ibtn" onclick="gen()">⚡ Improve my grade</button></div>`;
  h+=`<div id="gw" class="gw hide"></div>`;
  h+=`<p class="note">The more work you submit, the more detailed this feedback becomes.</p>`;
  sv.innerHTML=h;
}

function parseFB(t){const r={www:"",ebi:"",targets:""};const ps=t.split(/##\s*/i);for(const p of ps){const l=p.toLowerCase();if(l.startsWith("www"))r.www=md(p.replace(/^www\s*/i,"").trim());else if(l.startsWith("ebi"))r.ebi=md(p.replace(/^ebi\s*/i,"").trim());else if(l.startsWith("target"))r.targets=md(p.replace(/^targets?\s*/i,"").trim())}return r}

async function gen(){
  const btn=document.getElementById("ibtn");btn.disabled=true;btn.innerHTML='<span class="sp" style="width:16px;height:16px;border-width:2px;margin:0"></span> Generating...';
  const s=curS,p=curP,allW=[...curAL,...curGC];
  let pr=`Create 6 practice questions for ${s.fn}. Target their weak areas:\n`;
  const weak=[];if(p.mcq.tag!=="gn")weak.push("MCQs: "+p.mcq.ebi);if(p.calc.tag!=="gn")weak.push("Calcs: "+p.calc.ebi);if(p.ao3.tag!=="gn")weak.push("Analysis: "+p.ao3.ebi);if(p.eval.tag!=="gn")weak.push("Eval: "+p.eval.ebi);if(p.app.tag!=="gn")weak.push("App: "+p.app.ebi);if(p.data.tag!=="gn")weak.push("Data: "+p.data.ebi);
  pr+=weak.join("\n")+"\n\n";
  if(allW.length){pr+=`Submissions (${allW.length}):\n`;allW.slice(-6).forEach(e=>{pr+=`- "${e.q}": ${e.ma}/${e.mt} (${e.lv})`;if(e.e1)pr+=` EBI:${e.e1}`;pr+=`\n`});pr+="\n"}
  pr+=`Format:\n## Q1\n[question]\n## A1\n[answer]\n...through Q6/A6\n\nRules:\n- Target weak areas\n- Mix: calculations, retrieval, analysis\n- ONE trap (obvious answer wrong)\n- ONE rearranged calculation\n- ONE model applied to real business\n- Step-by-step answers\n- Use (a),(b),(c) for sub-parts\n- Never write "A*"\n`;
  const gw=document.getElementById("gw");
  try{
    const resp=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:3500,messages:[{role:"user",content:pr}]})});
    if(resp.ok){const j=await resp.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      const parsed=parseQA(txt);
      if(parsed.length){
        let h=`<p class="gi">Based on your data, here are questions targeting your gaps. Some are deliberately tricky — I'm trying to catch you out. Have a proper go before checking the answers.</p>`;
        h+=parsed.map((qa,i)=>`<div class="qb"><div class="qn">Question ${i+1}</div>${md(qa.q)}</div>`).join("");
        h+=`<button class="sabtn" onclick="togA()">Show model answers</button>`;
        h+=`<div id="ab" class="hide">`+parsed.map((qa,i)=>`<div class="ab"><div class="an">Answer ${i+1}</div>${md(qa.a)}</div>`).join("")+`</div>`;
        gw.innerHTML=h;gw.classList.remove("hide");
      }
    }
  }catch(e){}
  btn.innerHTML='⚡ Generate more questions';btn.disabled=false;
}

function parseQA(t){const r=[];const ps=t.split(/##\s*/);let cq=null;for(const p of ps){const s=p.trim();if(!s)continue;if(/^Q\d/i.test(s)){cq=s.replace(/^Q\d+\s*/i,"").trim()}else if(/^A\d/i.test(s)&&cq){r.push({q:cq,a:s.replace(/^A\d+\s*/i,"").trim()});cq=null}}return r}
function togA(){const a=document.getElementById("ab");const b=a.previousElementSibling;if(a.classList.contains("hide")){a.classList.remove("hide");b.textContent="Hide model answers"}else{a.classList.add("hide");b.textContent="Show model answers"}}

    const resp=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,messages:[{role:"user",content:tp}]})});
    if(resp.ok){const j=await resp.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");h+=`<div class="fl f-nv"><h3>Teaching priorities</h3>${md(txt)}</div>`}
  }catch(e){}
  tv.innerHTML=h;
}

function sh(id){document.getElementById(id).classList.remove("hide")}
function hi(id){document.getElementById(id).classList.add("hide")}
function se(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block"}
function lm(m){document.getElementById("ldM").textContent=m}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fD(ts){try{const d=new Date(ts);if(isNaN(d))return ts.substring(0,10);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}catch(e){return ts.substring(0,10)}}
function gcl(g){return g==="A*"?"astar":g.toLowerCase()}
function md(t){let h=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');h=h.replace(/((?:<li>.*?<\/li>\s*(?:<br>)?)+)/g,'<ul>$1</ul>').replace(/<br><\/ul>/g,'</ul>').replace(/<ul><br>/g,'<ul>');return'<p>'+h+'</p>'}
function reset(){hi("resV");document.getElementById("stuV").classList.add("hide");document.getElementById("tchV").classList.add("hide");sh("loginV");document.getElementById("err").style.display="none";ns.value="";document.getElementById("en").value="";document.getElementById("pw").value=""}
