<script>
/* =====================================================================
   JUDGEMENT COURSE (AO4)
   Built from AQA examiner reports 2017–2026. Stage numbers are stored in the
   tracking sheet as 100 + stage, so they never mix with the other courses.
   ===================================================================== */
const LEAN_Q='Will the introduction of lean production always lead to lower unit costs? Justify your view.';
const MNC_Q='A UK business\'s domestic market has stopped growing. The business has decided to become a multinational corporation. To what extent is this decision likely to increase profits?';

const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b,step=1)=>a+step*Math.floor(Math.random()*(Math.floor((b-a)/step)+1));
const f=n=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:2});
const r1=x=>Math.round(x*10)/10, r2=x=>Math.round(x*100)/100;

const STAGES=[
/* ---------------- STAGE 1 ---------------- */
{ id:1, type:'drift', title:'Summary or judgement?', blurb:'Tell a real judgement from a conclusion that just repeats.', serve:8, pass:6,
  labels:['A real judgement','Not a judgement yet'], showLabel:'A student\'s conclusion:',
  teach:`<p>On the long questions, 7 of 16, 8 of 20 and 9 of 24 marks on Paper 3 are for evaluation. The Paper 3 reports for 2023 and 2024 both say weaker responses "often simply summarised when attempting to evaluate, rather than genuinely trying to weigh-up their arguments."</p>
  <p>A real judgement answers the question, says which side carries more weight and why, and says what the answer depends on. A summary just lists both sides again.</p>
  <p>Read each conclusion and decide which it is.</p>`,
  items:[
    {src:'AQA June 2024 · Paper 1 · Q24', q:LEAN_Q, ok:false,
     text:'Overall, lean production has advantages such as less waste and lower stock costs, but it also has disadvantages such as supply chain risk and training costs. So it can lower unit costs, but it may not.',
     why:'This lists both sides again and sits on the fence. Nothing is weighed and there is no condition.'},
    {src:'AQA June 2024 · Paper 1 · Q24', q:LEAN_Q, ok:true,
     text:'Lean production will usually lower unit costs for a high-volume manufacturer with reliable suppliers, because the savings on stock and defects apply to every unit made. It will not always do so: where the supply chain is long or fragile, one stoppage can leave fixed costs spread over far fewer units. The answer depends mainly on how reliable the suppliers are.',
     why:'It answers "always" directly, says why one side usually wins, and names the condition that decides it.'},
    {src:'AQA June 2025 · Paper 1 · Q21', q:MNC_Q, ok:false,
     text:'In conclusion, becoming a multinational could increase profits through new markets and economies of scale, but there are risks like exchange rates and cultural differences. Therefore it is likely to increase profits to some extent.',
     why:'"To some extent" is not a judgement. Which matters more, the new markets or the risks, and why?'},
    {src:'AQA June 2025 · Paper 1 · Q21', q:MNC_Q, ok:true,
     text:'Becoming a multinational is only likely to increase profits if the business takes a real advantage abroad with it. A stagnant UK market is a strong reason to look overseas, but without a lower cost base or a stronger brand than local rivals, the extra revenue may not cover the higher cost of running operations in another country. So the decision is most likely to raise profits in the long run for a business with a clear competitive advantage, and least likely for one that is simply escaping a flat home market.',
     why:'It weighs the reason to go against the cost of going and says exactly when the decision would pay off.'},
    {src:'AQA June 2025 · Paper 1 · Q22', q:'The marketing department of a business wishes to increase its market share in a growing market. To what extent is market research the most important activity of the marketing department in order to achieve this objective?', ok:false,
     text:'Market research is important, but other activities such as pricing and promotion are also important, so it depends on the business.',
     why:'"It depends on the business" is the classic empty ending. Depends on what about the business?'},
    {src:'AQA June 2024 · Paper 1 · Q22', q:'A business changes its human resource management (HRM) approach from hard HRM to soft HRM. To what extent is this change guaranteed to increase the motivation of all employees?', ok:true,
     text:'Moving to soft HRM is not guaranteed to motivate all employees. It is likely to motivate staff who value recognition and responsibility, but for workers who are mainly unhappy about pay or job security, Herzberg suggests this will do little until those hygiene factors are fixed. So how far it works depends on what is currently causing dissatisfaction in that workforce.',
     why:'It tackles both "guaranteed" and "all", uses theory to weigh, and gives a specific condition.'},
    {src:'AQA June 2023 · Paper 3 · Q4', q:'If the new production facility is built, Bodhi will aim to increase sales. To what extent is Bodhi likely to be able to increase sales using his current approach to promotion?', ok:false,
     text:'Overall, Bodhi will be able to increase sales. To increase sales further, Logger should also start paid advertising and offer discounts to new customers in Europe.',
     why:'The examiner criticised a conclusion on this question because it "drifts from the question – which did not ask how Logger should increase sales." It also adds ideas that were never analysed.'},
    {src:'AQA June 2018 · Paper 1 · Q24', q:'Are demographic factors now more significant than economic factors in influencing the performance of UK businesses? Justify your view.', ok:true,
     text:'For most UK businesses economic factors are still more significant, because changes in interest rates and incomes hit demand within months. Demographic change matters more for businesses whose market is defined by age, such as care homes or student housing, where an ageing population shifts demand permanently. So the answer depends on how closely a business\'s customers are tied to one age group.',
     why:'It makes a call, explains why it usually holds, and shows where it does not. That is the "depends on" the examiner rewards.'},
    {src:'AQA June 2019 · Paper 1 · Q22', q:'A competitive advantage can be achieved through low-cost or through differentiation. Which of these types of competitive advantage is it easier for a UK business to maintain? Justify your view.', ok:false,
     text:'Both types of competitive advantage have strengths and weaknesses. Low cost can be copied and differentiation can be expensive. Every business is different, so it is impossible to say which is easier.',
     why:'Refusing to decide is not a judgement. The question says "justify your view", so you must have one.'},
    {src:'AQA June 2024 · Paper 1 · Q23', q:'To what extent does rapid change in the external environment mean that strategic drift is inevitable for a business?', ok:true,
     text:'Rapid change makes strategic drift more likely but not inevitable. Drift happens when a business keeps the same strategy while its market moves on, so the deciding factor is not how fast the environment changes but how quickly the business notices and responds. A business that scans its environment and is willing to change its strategy can avoid drift even in a fast-moving market.',
     why:'It challenges "inevitable" and identifies the real deciding factor.'},
{src:"Exam-style · pricing", q:"To what extent is cutting prices the best way for a supermarket to increase its market share?", ok:false,
 text:"In conclusion, cutting prices has advantages and disadvantages. It could attract customers, but it might reduce profit. It depends on the supermarket.",
 why:"It lists both sides and ends with an empty \"it depends\". Depends on what about the supermarket?"},
{src:"Exam-style · pricing", q:"To what extent is cutting prices the best way for a supermarket to increase its market share?", ok:true,
 text:"Cutting prices is unlikely to be the best way for most supermarkets, because rivals can match a price cut within days, so any gain in share is short-lived while every sale earns less. It works best for a discounter with the lowest costs in the market, which can keep prices down for longer than rivals can afford to. So it depends on whether the supermarket has a cost advantage that rivals cannot copy.",
 why:"It answers \"the best\", says why price cuts usually fail, and names the condition that decides it."},
{src:"Exam-style · interest rates", q:"To what extent will a rise in interest rates reduce the profits of a house builder?", ok:true,
 text:"A rise in interest rates is likely to cut a house builder's profit significantly, because higher mortgage costs reduce demand for new homes at the same time as its own borrowing costs rise. The effect will be smaller for a builder with low gearing that sells mainly to cash buyers. So the size of the fall depends on how far its customers, and the business itself, rely on borrowing.",
 why:"It judges how big the effect is, explains why, and says what would make it smaller."},
{src:"Exam-style · interest rates", q:"To what extent will a rise in interest rates reduce the profits of a house builder?", ok:false,
 text:"Interest rates are important for house builders. Higher rates mean higher mortgages. However, other factors like the economy and government policy also matter. Overall, interest rates will affect profits to some extent.",
 why:"\"To some extent\" does not say how far. Nothing is weighed."},
{src:"Exam-style · labour turnover", q:"To what extent is high labour turnover a problem for a business?", ok:false,
 text:"High labour turnover is always a disaster, because no business can survive without keeping its staff, so every business must cut labour turnover to zero.",
 why:"It exaggerates and ignores businesses where some turnover is normal or even useful. There is no condition."},
{src:"Exam-style · labour turnover", q:"To what extent is high labour turnover a problem for a business?", ok:true,
 text:"High labour turnover is a serious problem where staff need long training, such as in nursing, because each leaver is costly to replace and service suffers. Where jobs are simple and applicants are plentiful it matters much less, and some turnover can bring in fresh ideas. So how much of a problem it is depends on how costly and slow each replacement is.",
 why:"It shows where the problem is serious and where it is not, and explains what decides it."},
{src:"Exam-style · e-commerce", q:"Do the benefits of e-commerce outweigh the drawbacks for a small independent bookshop?", ok:false,
 text:"To conclude, e-commerce could help the bookshop reach more customers. Another advantage is that it could start selling e-books and audiobooks too.",
 why:"It brings in a new argument and never weighs the benefits against the drawbacks."},
{src:"Exam-style · e-commerce", q:"Do the benefits of e-commerce outweigh the drawbacks for a small independent bookshop?", ok:true,
 text:"If the bookshop tries to compete online on price, the drawbacks are likely to outweigh the benefits, because large online retailers can always undercut it. If it uses its website to sell what they cannot, such as signed copies, events and personal recommendations, the extra reach costs little and builds on its strengths. So the decision depends on whether it competes online on price or on its local, specialist offer.",
 why:"It weighs the two sides for this business and identifies what decides the answer."},
{src:"Exam-style · motivation", q:"To what extent is the leadership style of the manager the main factor affecting employee motivation?", ok:false,
 text:"Leadership style is a factor. Pay is also a factor. Job design is a factor too. Every factor is important, so they are all the main factor.",
 why:"It refuses to rank the factors, which is what \"the main factor\" asks for."},
{src:"Exam-style · motivation", q:"To what extent is the leadership style of the manager the main factor affecting employee motivation?", ok:true,
 text:"Leadership style is often the main factor, because a manager shapes recognition, responsibility and how decisions are made every day. But where pay is below what rivals offer, Herzberg suggests a good leader cannot make up for that dissatisfaction. So leadership style is the main factor only once hygiene factors such as pay are at an acceptable level.",
 why:"It makes a call, uses theory to test it, and states the condition."}
  ]},
/* ---------------- STAGE 2 ---------------- */
{ id:2, type:'mcq', title:'What does it depend on?', blurb:'Find the condition that actually decides the answer.', serve:8, pass:6,
  teach:`<p>"It depends" only earns credit when you say what it depends on and why that factor decides it. On the June 2026 Paper 3 essay, the stronger answers ended with a judgement showing where the statement holds and where it does not. The condition has to be specific to the question.</p>
  <p>For each one, choose the condition that does the most work.</p>`,
  items:[
    {src:'AQA June 2024 · Paper 1 · Q24', prompt:LEAN_Q+' Which "depends on" is most useful?',
     o:['It depends on the size of the business and how many products it makes','It depends on how reliable its suppliers are, because JIT needs materials to arrive on time','It depends on whether the managers personally like the idea of lean production','It depends on whether the business has used lean production before at any of its sites'], a:1,
     why:'Lean relies on suppliers. If deliveries fail, production stops and unit costs rise.'},
    {src:'AQA June 2025 · Paper 1 · Q21', prompt:MNC_Q+' Which "depends on" is most useful?',
     o:['It depends on whether it has an advantage over local rivals, such as lower costs or a stronger brand','It depends on the state of the global economy over the next few years','It depends on how big the business is compared with others in the UK','It depends on whether the new country\'s government is friendly'], a:0,
     why:'Without an advantage over local firms, entering a new market adds cost without guaranteeing the revenue to cover it.'},
    {src:'AQA June 2025 · Paper 1 · Q22', prompt:'Is market research the most important marketing activity for increasing market share in a growing market? Which "depends on" is most useful?',
     o:['It depends on how much it already knows about why customers switch brands in this market','It depends on how large the marketing budget is this year','It depends on all of the 4Ps working together as a mix','It depends on whether the market research is primary or secondary, and how it is collected'], a:0,
     why:'Research matters most when the business does not yet understand its customers. If it already does, promotion or distribution may matter more.'},
    {src:'AQA June 2018 · Paper 1 · Q23', prompt:'Will UK businesses experience a fall in profit if governments adopt more protectionist policies? Which "depends on" is most useful?',
     o:['It depends on how Brexit changed trade rules between the UK and the European Union','It depends on whether it mainly exports, imports its inputs, or competes with imports at home','It depends on what happens to the exchange rate over the next year','It depends on how many other countries around the world also decide to bring in protectionist policies'], a:1,
     why:'Protectionism hurts exporters and importers of materials but can help firms that compete with imports at home.'},
    {src:'Exam-style · Paper 3 style', prompt:'Should a small manufacturer finance expansion with a bank loan rather than new share capital? Which "depends on" is most useful?',
     o:['It depends on what the bank manager says when the owners ask for the loan','It depends on whether the owners want to keep control','It depends on the general level of interest rates in the economy','It depends on how many shareholders the business already has and what each of them would prefer to happen'], a:1,
     why:'The real trade-off is control against the risk of fixed repayments. Interest rates matter only through that second point.'},
    {src:'Exam-style · Paper 2 style', prompt:'Will a 10% price rise increase a coffee chain\'s revenue? Which "depends on" is most useful?',
     o:['It depends on price elasticity: if demand is price inelastic, revenue will rise','It depends on what competitors think about the price rise','It depends on the quality of the coffee compared with rivals','It depends on whether the price rise is announced in advance'], a:0,
     why:'PED decides the direction of the revenue change. Quality and competitors only matter through their effect on PED.'},
    {src:'AQA June 2017 · Paper 2 · Q3.3', prompt:'Is Africa an attractive market for all businesses wanting to sell their products internationally? Which "depends on" is most useful?',
     o:['It depends on the product: everyday low-cost goods suit a young population on low incomes','It depends on the weather and climate in each African country','It depends on the business and what its managers want','It depends on how far African countries are from the UK and how long shipping takes to reach them'], a:0,
     why:'The data showed a young, fast-growing population with low average incomes. That favours some products and rules out others.'},
    {src:'Exam-style · Paper 1 style', prompt:'Will delayering improve a business\'s performance? Which "depends on" is most useful?',
     o:['It depends on whether staff can work with less supervision','It depends on how many managers there are in the business at the moment','It depends on the one-off cost of the redundancy payments','It depends on whether the managers who are made redundant are replaced by new ones within a year'], a:0,
     why:'Delayering works when staff can work with less supervision. The redundancy cost is a one-off, so it rarely decides the long-run outcome.'},
{src:"Exam-style · motivation", prompt:"\"Will introducing performance-related pay raise productivity?\" Which \"depends on\" is most useful?",
 o:["It depends on whether output can be measured fairly","It depends on how much the scheme costs to set up and run each year","It depends on whether most other businesses in the same industry already use a similar PRP scheme","It depends on what the trade union thinks about the scheme when it is announced"], a:0,
 why:"PRP only changes behaviour if performance can be measured fairly and the reward matters to the people receiving it."},
{src:"Exam-style · location", prompt:"\"Should a manufacturer move production to a lower-wage country?\" Which \"depends on\" is most useful?",
 o:["It depends on whether the labour savings outweigh extra transport and quality-control costs","It depends on how far away the new country is from the UK and how long flights take","It depends on whether the managers enjoy travelling abroad","It depends on what is happening to the exchange rate between the pound and other currencies"], a:0,
 why:"Lower wages are only an advantage if they are not eaten up by other costs of producing abroad."},
{src:"Exam-style · promotion", prompt:"\"Is a social media campaign the best way for a new restaurant to attract customers?\" Which \"depends on\" is most useful?",
 o:["It depends on whether its target customers use social media to choose where to eat","It depends on how many followers the owner has on a personal account","It depends on whether the restaurant's food looks good in photos","It depends on the cost of the campaign"], a:0,
 why:"A campaign only works if it reaches the people the restaurant wants. That decides whether it is the best method."},
{src:"Exam-style · mergers", prompt:"\"Will a merger with a rival increase the business's profit?\" Which \"depends on\" is most useful?",
 o:["It depends on whether the cost savings outweigh the cost of merging two cultures","It depends on which of the two businesses is bigger","It depends on whether the merger is reported positively in the national news","It depends on whether the competition authorities take a long time to approve the merger"], a:0,
 why:"Many mergers fail to deliver the promised savings because combining two organisations is harder and costlier than expected."},
{src:"Exam-style · finance", prompt:"\"Should a business with a cash-flow problem use debt factoring?\" Which \"depends on\" is most useful?",
 o:["It depends on whether the fee costs less than other options, such as an overdraft","It depends on how many customers the business has and how large each of them is","It depends on whether the business is a plc or a private limited company","It depends on what the accountant thinks is the most normal method to use"], a:0,
 why:"Factoring solves the cash problem at a price. Whether it is the right choice depends on what the alternatives cost."},
{src:"Exam-style · HR", prompt:"\"Will moving to flexible working improve staff retention?\" Which \"depends on\" is most useful?",
 o:["It depends on whether staff leave because of fixed hours or for other reasons, such as pay","It depends on what type of office the business has and where it is located","It depends on whether managers personally trust their staff to work without supervision","It depends on the government rules about flexible working requests and how they change"], a:0,
 why:"Flexible working only helps retention if inflexible hours are part of why people are leaving."},
{src:"Exam-style · quality", prompt:"\"Is quality assurance more effective than quality control?\" Which \"depends on\" is most useful?",
 o:["It depends on whether staff are trained to take responsibility","It depends on how many inspectors the business currently employs","It depends on the price of the product and whether customers would pay more for higher quality","It depends on whether customers complain"], a:0,
 why:"Quality assurance relies on every worker checking their own work. Without trained, committed staff it will not work."},
{src:"Exam-style · exchange rates", prompt:"\"Will a fall in the value of the pound benefit a UK manufacturer?\" Which \"depends on\" is most useful?",
 o:["It depends on how much it exports compared with how much of its materials it imports","It depends on whether the Bank of England decides to change interest rates in response","It depends on how many staff the business employs in its UK factories","It depends on whether the business is a plc or a private limited company"], a:0,
 why:"A weak pound helps exports but makes imported materials dearer. The balance between the two decides the overall effect."},
{src:"Exam-style · competition", prompt:"\"Will a new competitor entering the market reduce the business's profit?\" Which \"depends on\" is most useful?",
 o:["It depends on how strongly the business is differentiated, so customers stay loyal","It depends on how well known the competitor's name already is in other countries","It depends on how many shops the competitor opens in its first year of trading","It depends on how much market research the business carried out last year"], a:0,
 why:"If customers see the business as different and better, a new rival will win fewer of them."},
{src:"Exam-style · structure", prompt:"\"Is centralised decision-making better for a retail chain?\" Which \"depends on\" is most useful?",
 o:["It depends on how much local customer needs differ from one store to another","It depends on the number of stores the chain has and how quickly it is opening more","It depends on whether the head office is based in London or somewhere else","It depends on how much the store managers are paid compared with head office"], a:0,
 why:"Centralisation gives consistency and lower costs. It works less well when each store's customers want different things."}
  ]},
/* ---------------- STAGE 3 ---------------- */
{ id:3, type:'spot', title:'Attack the big word', blurb:'Find the word in the question that you must challenge.', serve:8, pass:6, seq:['s'],
  prompts:{s:'Tap the word or phrase you should challenge.',wrongS:'Not that. Look for the word that makes the claim absolute or makes you rank things.',wrongSE:'Not that one.'},
  teach:`<p>Many AQA essay titles contain a word that makes the claim easy to challenge: <i>always</i>, <i>guaranteed</i>, <i>all</i>, <i>inevitable</i>, <i>the most important</i>. The mark schemes say that challenging these supports evaluation.</p>
  <p>Tap the word or phrase in each question that your judgement must deal with head-on.</p>`,
  items:[
    {src:'AQA June 2024 · Paper 1 · Q24', parts:['Will the introduction of lean production ',['always','s'],' lead to lower unit costs? Justify your view.'],
     note:'"Always" means one clear exception is enough to disagree. Then explain when it does work.'},
    {src:'AQA June 2024 · Paper 1 · Q22', parts:['To what extent is this change ',['guaranteed','s'],' to increase the motivation of all employees?'],
     note:'"Guaranteed" is the main target. "All employees" is the second: show that different groups respond differently.'},
    {src:'AQA June 2024 · Paper 1 · Q23', parts:['To what extent does rapid change in the external environment mean that strategic drift is ',['inevitable','s'],' for a business?'],
     note:'"Inevitable" invites you to show how a business can avoid drift. The examiner noted many students misunderstood strategic drift itself.'},
    {src:'AQA June 2025 · Paper 1 · Q22', parts:['To what extent is market research ',['the most important','s'],' activity of the marketing department in order to achieve this objective?'],
     note:'"The most important" means you must compare it with something else and rank them.'},
    {src:'AQA June 2018 · Paper 1 · Q22', parts:['Do you believe that this is a ',['more risky','s'],' strategy than market development? Justify your view.'],
     note:'A comparison question. Your judgement must say which is riskier and why, not just describe the risks of each.'},
    {src:'AQA June 2019 · Paper 1 · Q22', parts:['Which of these types of competitive advantage is it ',['easier','s'],' for a UK business to maintain? Justify your view.'],
     note:'"Easier to maintain" is the test. Not which is better, but which lasts longer against competitors.'},
    {src:'AQA June 2017 · Paper 2 · Q3.3', parts:['To what extent is Africa an attractive market for ',['all businesses','s'],' wanting to sell their products internationally?'],
     note:'"All businesses" means you need different types of business. One example cannot answer it.'},
    {src:'AQA June 2019 · Paper 2 · Q1.5 (examiner report)', parts:['The question asked whether the use of market research will ',['guarantee','s'],' high sales.'],
     note:'The examiner wrote that the question "clearly asks whether the use of market research will guarantee high sales, not how will it help."'},
{src:"Exam-style · operations", parts:["Is lean production ",["the best","s"]," way for a car maker to reduce its costs? Justify your view."],
 note:"\"The best\" means comparing lean with other ways to cut costs, then deciding which comes out on top."},
{src:"Exam-style · external environment", parts:["To what extent will a rise in the minimum wage ",["always","s"]," reduce the profits of retailers?"],
 note:"\"Always\" means one clear exception is enough to disagree, for example a retailer that already pays above the minimum wage."},
{src:"Exam-style · objectives", parts:["Should ",["all","s"]," businesses aim to be market leaders? Justify your view."],
 note:"\"All\" means contrasting types of business. A niche business may be better off small."},
{src:"Exam-style · strategic analysis", parts:["To what extent is Porter's five forces model ",["essential","s"]," when a business is deciding whether to enter a new market?"],
 note:"\"Essential\" means it cannot be done without. Show where it helps a lot and where other information matters more."},
{src:"Exam-style · technology", parts:["Is investment in technology ",["certain","s"]," to improve the productivity of a business?"],
 note:"\"Certain\" is easy to challenge: staff may resist, need training, or the technology may not suit the business."},
{src:"Exam-style · motivation", parts:["To what extent is pay ",["the main","s"]," factor in motivating employees?"],
 note:"\"The main\" asks you to rank pay against other factors, not just explain why pay matters."},
{src:"Exam-style · growth", parts:["Is it ",["better","s"]," for a business to grow organically than by takeover? Justify your view."],
 note:"A comparison. Your judgement has to say which is better and when."},
{src:"Exam-style · competitive advantage", parts:["To what extent can a business ",["only","s"]," succeed in a market by having the lowest prices?"],
 note:"\"Only\" claims there is no other way. Differentiation is the obvious challenge."},
{src:"Exam-style · structure", parts:["Will a decentralised structure ",["guarantee","s"]," faster decision-making in a multinational?"],
 note:"\"Guarantee\" can be challenged by showing what could slow decisions down even after decentralising."},
{src:"Exam-style · market research", parts:["To what extent is market research ",["more important","s"]," for a start-up than for an established business?"],
 note:"A comparison: you must weigh the two businesses against each other, not just explain why research matters."}
  ]},

{ id:4, type:'build', title:'Build the judgement', blurb:'Put a conclusion in order. One card does not belong.', serve:3, pass:2,
  teach:`<p>A good conclusion moves in a clear order: answer the question, say what carries most weight and why, say what it depends on, then finish by answering the question again in its own words.</p>
  <p>This is a way of ordering your thinking, not a formula to copy. The 2024 examiner warned that formulaic conclusions "can hinder as often as they can help."</p>
  <p>One card in each set does not belong in a conclusion. You get two checks per question.</p>`,
  items:[
    {src:'AQA June 2024 · Paper 1 · Q24', q:LEAN_Q,
     start:'Conclusion begins', end:'Conclusion ends',
     cards:[
      {id:'A',t:'Lean production will usually lower unit costs, but not always.',w:'Answer the question straight away, including the word "always".'},
      {id:'B',t:'The savings on stock and defects carry more weight for a high-volume manufacturer, because they apply to every unit made.',w:'Say which side carries more weight and why.'},
      {id:'C',t:'This depends mainly on supplier reliability: one failed delivery can stop production while fixed costs carry on.',w:'Name the condition that decides it, and why.'},
      {id:'D',t:'So lean production lowers unit costs for most manufacturers most of the time, but not for those that cannot rely on their suppliers.',w:'Finish by answering the question in its own words.'}],
     decoy:{id:'E',t:'Lean production also improves the business\'s environmental image with customers.',w:'Trap: a new argument. The examiner says adding new issues in a conclusion harms the answer.'},
     order:['A','B','C','D']},
    {src:'AQA June 2025 · Paper 1 · Q21', q:MNC_Q,
     start:'Conclusion begins', end:'Conclusion ends',
     cards:[
      {id:'A',t:'Becoming a multinational is likely to increase profits only for some businesses.',w:'Answer directly.'},
      {id:'B',t:'Access to growing markets outweighs the extra costs where the business has a real advantage over local rivals.',w:'Weigh the two sides and say why one wins.'},
      {id:'C',t:'Without that advantage, the higher costs of operating abroad may exceed the extra revenue.',w:'Show when the other side wins.'},
      {id:'D',t:'So the decision is most likely to raise profits for a business with a clear cost or brand advantage it can take overseas.',w:'Finish by answering the question.'}],
     decoy:{id:'E',t:'Firstly, multinationals can benefit from economies of scale, and secondly they can spread risk across countries.',w:'Trap: this just repeats earlier arguments as a list. That is summarising, not judging.'},
     order:['A','B','C','D']},
    {src:'Based on AQA June 2017 · Paper 3 · Q4 (examiner report)', q:'Which is the bigger threat to KMH: the power of buyers or the likelihood of new entrants?',
     start:'Conclusion begins', end:'Conclusion ends',
     cards:[
      {id:'A',t:'Buyer power is the bigger threat to KMH.',w:'The examiner said students must "decide which is the bigger threat and explain why", not just analyse both.'},

/* ---------------- STAGE 5 ---------------- */
{ id:5, type:'weak', title:'Fix the conclusion', blurb:'Find the sentence that loses marks and replace it.', serve:5, pass:4,
  teach:`<p>Each conclusion below has one sentence that would cost marks. They are all mistakes examiners have reported: new arguments, repeating, questioning the data, exaggerating, and drifting from the question.</p>
  <p>Tap the weak sentence, then choose the best replacement. Both must be right first time to score.</p>`,
  items:[
    {src:'Based on AQA June 2025 · Paper 3 (examiner report)', q:'To what extent should the business choose Option A rather than Option B?',
     s:['Overall, Option A is the better choice.','Its higher forecast profit outweighs the extra risk because the business has enough cash to survive a slow first year.','Another benefit of Option A is that it would also improve staff motivation.','Therefore Option A is the better choice, as long as sales reach at least 80% of the forecast.'],
     bad:2, problem:'A new argument in the conclusion. The 2025 examiner warned that adding issues here "will harm the quality of your overall response".',
     fixes:['Option B\'s lower risk matters less here, because the main danger it avoids, running out of cash, is unlikely given the business\'s reserves.','Option A would also mean the business can enter new markets later.','Option B is also good in many ways.'], fix:0},
    {src:'Based on AQA June 2026 · Paper 3 (examiner report)', q:'To what extent is the fall in profit caused by the rise in material costs?',
     s:['The rise in material costs is the main cause of the fall in profit.','Material costs rose by 18% while revenue was flat, which explains most of the £40,000 fall.','However, the cost figures may not be accurate, so this cannot be certain.','The smaller cause was the loss of one contract, which only accounts for about £8,000.'],
     bad:2, problem:'In June 2026 the examiner rejected answers that questioned the accuracy of the data when the question was about that data.',
     fixes:['The figures are probably made up for the exam.','The cost rise matters more because it affects every job, while the lost contract was a one-off.','Material costs might go down again next year if suppliers cut their prices, so the business should wait and see what happens.'], fix:1},
    {src:'Based on AQA June 2026 · Paper 3 (examiner report)', q:'To what extent will the cash flow problem threaten the survival of the business?',
     s:['The cash flow problem is a real threat, but not an immediate one.','The business has an overdraft facility that covers the gap for the next three months.','Because of this, the business will definitely collapse within weeks.','Its survival depends on whether the large customer pays on time in March.'],
     bad:2, problem:'Exaggeration, and it contradicts the previous sentence. On a June 2026 Paper 3 question about cash flow, the examiner said some of the best evaluation recognised it was not an "existential crisis", and found "the willingness to avoid hyperbolic responses" heartening.',
     fixes:['So the threat is real but manageable for now.','Because of this, the business is completely safe forever.','Because of this, the owner should sell the business now while it still has value, before the cash runs out completely.'], fix:0},
    {src:'AQA June 2023 · Paper 3 · Q4 (examiner commentary)', q:'If the new production facility is built, Bodhi will aim to increase sales. To what extent is Bodhi likely to be able to increase sales using his current approach to promotion?',
     s:['On balance, Bodhi is unlikely to increase sales much using his current approach alone.','His Instagram account has 200 000 followers, but the content focuses on his surfing lifestyle and beliefs rather than on the surfboards.','To increase sales, Logger should start paid advertising and offer discounts to new customers.','This depends on how many of his followers match the age and income of the people who actually buy his boards.'],
     bad:2, problem:'The examiner said a conclusion on this question "drifts from the question – which did not ask how Logger should increase sales."',
     fixes:['Bodhi should hire an experienced marketing manager to run a paid campaign, because 200 000 followers is not enough to reach new customers in Europe and the rest of the world.','Whether followers turn into customers matters more than how many followers there are, because promotion only raises sales if it reaches people who are likely to buy.','Logger Boards is a successful business.'], fix:1},
    {src:'AQA June 2024 · Paper 1 · Q24', q:LEAN_Q,
     s:['Lean production will usually lower unit costs, but not always.','In the first paragraph I explained JIT, in the second I explained kaizen, and in the third I explained the risks.','The savings on stock apply to every unit, so for a high-volume firm they outweigh the training costs.','It depends on supplier reliability, because a single failed delivery can stop the line.'],
     bad:1, problem:'Describing what you wrote is not weighing it. Examiners say weaker conclusions "summarised" instead of judging.',
     fixes:['The training costs are a one-off, while the stock savings repeat every year, which is why the savings usually win.','Lean production was first used by Toyota.','In conclusion, there are many points on both sides.'], fix:0},
    {src:'AQA June 2018 · Paper 1 · Q22', q:'A UK business has decided to achieve higher growth through new product development. Do you believe that this is a more risky strategy than market development? Justify your view.',
     s:['New product development is usually the riskier strategy.','Market development sells a product the business already knows how to make, so only one thing is new.','Both strategies have risks, so it is hard to decide.','However, if the business knows its home customers very well, NPD may be less risky than entering an unfamiliar foreign market.'],
     bad:2, problem:'Sitting on the fence after you have already made a judgement weakens it. The question says "justify your view".',
     fixes:['Both strategies appear on Ansoff\'s matrix, one box apart, so they carry the same level of risk as each other in every situation.','With NPD the product itself is untested, and most new products fail, so the chance of losing the investment is higher.','I think both could work.'], fix:1},
{src:"Exam-style · pricing", q:"To what extent is cutting prices the best way for a supermarket to increase its market share?",
 s:["Cutting prices is not usually the best way to increase market share.","Rivals can match a price cut within days, so any gain is short-lived while margins fall.","Another way to increase share would be to open more stores in new towns.","It only works well for the lowest-cost supermarket, which can keep prices down for longer than its rivals."],
 bad:2, problem:"A new argument in the conclusion. A conclusion should weigh what has already been argued.",
 fixes:["For other supermarkets, a lasting point of difference is likely to hold share better than price.","Opening more stores in new towns would need more finance.","Supermarkets are some of the biggest businesses in the UK."], fix:0},
{src:"Exam-style · interest rates", q:"To what extent will a rise in interest rates reduce the profits of a house builder?",
 s:["A rise in interest rates is likely to cut a house builder's profit.","Higher mortgage costs reduce the number of buyers who can afford a new home.","This will definitely cause every house builder in the UK to go bankrupt.","The effect is smaller for a builder with low gearing and many cash buyers."],
 bad:2, problem:"An exaggeration that the rest of the conclusion contradicts. Keep effects in proportion.",
 fixes:["This is likely to reduce sales volumes and force some builders to offer discounts.","This will have no effect on profit, because house builders can always raise prices to make up for it.","This means interest rates are the only thing that matters to house builders in every situation."], fix:0},
{src:"Exam-style · labour turnover", q:"To what extent is high labour turnover a problem for a business?",
 s:["High labour turnover is a serious problem for some businesses but not all.","In my first paragraph I explained the costs, and in my second I explained the benefits.","Where training takes months, each leaver is costly to replace.","So it depends on how costly and slow it is to replace each worker."],
 bad:1, problem:"Describing what you wrote is not weighing it.",
 fixes:["Where jobs are simple and applicants are plentiful, replacing staff costs little.","Labour turnover can be calculated using a formula, which I showed earlier in the answer.","There are lots of points on both sides, so the answer is not straightforward to decide."], fix:0},
{src:"Exam-style · e-commerce", q:"Do the benefits of e-commerce outweigh the drawbacks for a small independent bookshop?",
 s:["For a small bookshop the benefits can outweigh the drawbacks, but only if it avoids competing on price.","Large online retailers can always undercut it on price.","However, the figures in the case about online sales might be out of date.","Selling signed copies and event tickets online builds on what makes the shop different."],
 bad:2, problem:"Questioning the data you have been given does not earn credit.",
 fixes:["Selling online on price alone would cost it margin without winning many customers.","However, the shop owner could also open a café to attract more customers into the shop.","However, we cannot be sure about anything, because the future is always uncertain."], fix:0},
{src:"Exam-style · motivation", q:"To what extent is the leadership style of the manager the main factor affecting employee motivation?",
 s:["Leadership style is often the main factor affecting motivation.","A manager shapes recognition, responsibility and how decisions are made day to day.","But where pay is below rivals', Herzberg suggests a good leader cannot make up for it.","Leadership matters because it is very important for motivation."],
 bad:3, problem:"This is circular: it says leadership matters because it matters. It adds no reason and does not finish the judgement.",
 fixes:["So leadership style is the main factor only once hygiene factors such as pay are acceptable.","Leadership matters because there are many different leadership styles, such as autocratic, democratic and laissez-faire.","So leadership is the only factor that has any real effect on how motivated staff are."], fix:0},
{src:"Exam-style · investment appraisal", q:"To what extent should a business choose Project X (NPV £40,000) rather than Project Y (NPV £25,000)? Both cost the same.",
 s:["Project X is likely to be the better choice.","Its NPV is £15,000 higher for the same initial cost.","Project Y is also good because it has a positive NPV.","X is the better choice unless its forecasts are much less certain than Y's."],
 bad:2, problem:"Being positive is not a reason to choose Y over X, so this adds nothing to the judgement.",
 fixes:["The main risk is that X's cash flows come later.","Project Y is also good, because any project with a positive NPV is worth doing.","Project Y should be chosen instead, because a smaller project is always less risky for any business."], fix:0}
  ]},
/* ---------------- STAGE 6 ---------------- */
{ id:6, type:'mcq', title:'Why it outweighs', blurb:'Pick the reason that really shows one side carries more weight.', serve:8, pass:6,
  teach:`<p>Saying one argument "outweighs" another is not enough. You need a reason. The strongest reasons compare the two sides on something you can measure or reason about:</p>
  <ul><li>size of the effect, ideally in proportion (for example, as a share of profit)</li><li>how likely it is</li><li>how long it lasts</li><li>whether it can be reversed</li></ul>
  <p>Choose the reason that does this best.</p>`,
  items:[
    {src:'Exam-style · proportion', prompt:'New regulations add £1.2m a year to costs for a firm with revenue of £60m and operating profit of £4m. Which judgement uses the figures best?',
     o:['£1.2m is a large amount of money for any business, so the regulation is very damaging','£1.2m is only 2% of revenue, so it will hardly affect the business at all','£1.2m is 30% of operating profit, so it is a serious threat despite being 2% of revenue','£1.2m is less than the firm\'s £4m profit, so the regulation can be ignored completely'], a:2,
     why:'Compare the cost with profit, not revenue. 1.2 ÷ 4 = 30%. Keeping an effect in proportion, neither ignoring it nor exaggerating it, is what the 2026 Paper 3 examiner praised.'},
    {src:'Exam-style · timescale', prompt:'Delayering cuts salary costs by £300,000 a year but costs £400,000 in one-off redundancy pay. Which reason best shows the savings outweigh the cost?',
     o:['The savings are bigger, so they will always outweigh the redundancy cost','The redundancy cost is paid once, but the savings repeat every year, so it gains from year two','Redundancy is bad for the morale of those who stay, so the savings may never actually be achieved','Salary costs are fixed costs, so cutting them has no effect on profit in the long run'], a:1,
     why:'£300k × 2 = £600k > £400k. Comparing one-off with recurring is a strong way to weigh.'},
    {src:'Exam-style · likelihood', prompt:'Option A could earn £5m (40% chance). Option B could earn £2m (90% chance). Which reason best supports choosing B for a cash-poor business?',
     o:['B is cheaper to set up, so it is always the better choice for any business','A has the higher possible payoff, so a business that is short of cash needs the bigger win more than others','B is far more likely to succeed, and a cash-poor firm cannot risk A\'s 60% chance of failing','A and B have the same expected value, so the business should toss a coin'], a:2,
     why:'This weighs likelihood against the firm\'s ability to absorb failure. That is a judgement, not just a description.'},
    {src:'Exam-style · reversibility', prompt:'Which reason best shows that a price cut is a lower-risk response than building a new factory?',
     o:['A price cut can be reversed; a factory cannot easily be undone','A price cut is cheaper, because it does not need any money to be spent up front at all','Factories take a long time to build, so the competition may have changed by the time it opens','A price cut always increases revenue, whereas a new factory only increases costs'], a:0,
     why:'Reversibility is a strong test of risk. The other options are true but do not explain why one is less risky.'},
    {src:'AQA June 2018 · Paper 1 · Q23', prompt:'"Protectionism will reduce the profits of UK businesses." Which judgement is strongest?',
     o:['It will reduce profits for all businesses, because trade becomes harder for everyone','It hurts exporters and firms importing materials, but can help firms competing with imports','Protectionism is bad for the economy, so profits will fall across the whole country','It will have no effect on most UK businesses, because the majority of them only sell within the UK'], a:1,
     why:'It weighs different businesses differently. "All businesses" answers like the first are exactly what examiners mark down.'},
    {src:'Exam-style · short term vs long term', prompt:'Investing in staff training will cut profit this year but should improve productivity. Which judgement is strongest?',
     o:['Training is always worth it, because better-skilled staff are always more productive','Training reduces profit this year, so it should be avoided while profits are under any pressure at all','The cost is paid now but the gain lasts while staff stay, so it pays if labour turnover is low','Training should only be given to managers, because they have the biggest effect on profit'], a:2,
     why:'It weighs short term against long term and links the condition (labour turnover) to the reason.'},
    {src:'Exam-style · data contradicts the argument', prompt:'A business argues its new loyalty scheme raised sales. Sales rose 3%, but the market grew 8%. Which judgement is strongest?',
     o:['Sales rose 3%, so the scheme has clearly worked and should be continued','Sales grew more slowly than the market, so it lost share: the scheme has not worked so far','The data may be wrong, so it is impossible to judge whether the scheme worked','The market grew by 8%, so the scheme must have been responsible for most of that growth across the industry'], a:1,
     why:'Comparing with the market is the key move. Never question the accuracy of data you have been given.'},
    {src:'Exam-style · biggest factor', prompt:'A café\'s profit fell 25%. Rent rose by £6,000 and coffee bean costs rose by £14,000. Which is the main cause, and why?',
     o:['Rent, because it is a fixed cost that has to be paid every month however many cups are actually sold','Coffee beans, because the rise is more than twice as large and grows with every cup sold','Both are equally important, because they both reduce profit by some amount','Neither, because the fall in profit must have been caused by fewer customers'], a:1,
     why:'£14,000 against £6,000. The examiner said analysing both causes "is not the same as making a judgement on which is the main cause".'},
{src:"Exam-style · weighing costs and revenue", prompt:"A supplier's price rise adds £50,000 a year to costs. A new contract adds £80,000 of revenue at a 25% profit margin. Which judgement is correct?",
 o:["The cost rise matters more: it cuts profit by £50,000, while the contract adds only £20,000","The contract matters more, because £80,000 is bigger than £50,000","They roughly cancel each other out, so profit stays the same","The contract matters more, because new revenue always outweighs a cost increase"], a:0,
 why:"Compare like with like. The contract adds £80,000 × 25% = £20,000 of profit. The cost rise takes away £50,000."},
{src:"Exam-style · forecasts", prompt:"A marketing campaign costs £30,000 and is forecast to bring 2,000 extra sales at £20 contribution each. Which judgement is best?",
 o:["It adds £10,000 if the forecast is right, but a 25% shortfall would wipe that out","It adds £40,000 of contribution, so it is clearly worth doing whatever happens","It costs £30,000, so it should be rejected","It adds £10,000 of profit, so it is guaranteed to be a success for the business"], a:0,
 why:"2,000 × £20 = £40,000, minus £30,000 = £10,000. At 1,500 sales the contribution only covers the cost."},
{src:"Exam-style · likelihood and size", prompt:"Strike action is 30% likely and would cost £2m. A supply problem is 80% likely and would cost £0.5m. Which is the bigger risk, using expected cost?",
 o:["Strike action: its expected cost is £0.6m against £0.4m","The supply problem, because it is much more likely to happen","They are equal, because both are risks","The supply problem, because its cost is certain"], a:0,
 why:"0.3 × £2m = £0.6m. 0.8 × £0.5m = £0.4m. Weighing likelihood and size together is stronger than using either alone."},
{src:"Exam-style · suppliers", prompt:"A business could save £20,000 a year by moving to a cheaper supplier, but quality complaints are expected to rise. Which reason best supports staying with its current supplier?",
 o:["The brand is built on quality, so lost repeat customers could cost more than £20,000","The new supplier is further away, so deliveries will take a day or two longer than now","Changing suppliers takes paperwork and a few meetings with the new supplier's sales team","The current supplier is a friend of the owner"], a:0,
 why:"It compares the saving with what the business could lose, in the same terms."},
{src:"Exam-style · finance", prompt:"Which reason best shows that a government grant is a lower-risk source of finance than a bank loan?",
 o:["A grant does not have to be repaid","A grant is quicker and easier to apply for than a bank loan for most small businesses","A grant can be any size the business wants, with no limit on how much it asks for","Banks are often closed at weekends"], a:0,
 why:"Risk here means the danger of payments the business cannot meet. A grant creates none."},
{src:"Exam-style · price elasticity", prompt:"A rival cuts its prices by 10%. The business's own products have a PED of −0.3. Which judgement is best?",
 o:["Its customers are not very price sensitive","It must match the cut straight away, or it will lose most of its customers within weeks","PED does not matter when a rival changes its price","It should cut its own price by 30%"], a:0,
 why:"Inelastic demand suggests customers are loyal or see few close substitutes, so matching the cut could cost more than it saves."},
{src:"Exam-style · using comparisons", prompt:"A business's profit fell 20%. Its managers blame the weather. Rivals in the same area increased their sales by 5%. Which judgement is strongest?",
 o:["The weather is unlikely to be the main cause, because rivals facing the same weather grew","The weather was the main cause, because the business says so","The rivals' figures may be wrong, so it is impossible to say what caused the fall","The weather caused the fall, because bad weather always reduces sales for every business"], a:0,
 why:"Comparing with rivals in the same conditions is a strong way to test a claimed cause."},
{src:"Exam-style · proportion", prompt:"A one-off legal fine of £500,000 hits a firm whose annual operating profit is £8m. Which judgement keeps it in proportion?",
 o:["It is about 6% of one year's profit, so it is a setback","It is a huge sum of money that could easily cause the whole business to collapse","It does not matter at all, because the business is profitable","It will reduce profit by £500,000 every year from now on"], a:0,
 why:"£0.5m ÷ £8m ≈ 6%. It is a one-off, so it does not recur."},
{src:"Exam-style · dependence on customers", prompt:"Which reason best shows that losing a key customer is a bigger threat to a small supplier than to a large one?",
 o:["That customer is likely to be a much larger share of the small supplier's revenue","Small suppliers have fewer staff, so they cannot easily find time to look for new customers","Large suppliers have more brands","Small suppliers pay less tax"], a:0,
 why:"The effect depends on the share of revenue at risk, not just the customer's size."},
{src:"Exam-style · short term and long term", prompt:"Which judgement best weighs a short-term cost against a long-term benefit?",
 o:["Solar panels cost £60,000 but save £15,000 a year, so they pay back in four years","Solar panels are good for the environment, so customers will choose the business over rivals","The cost of £60,000 is high, so it should be avoided while cash is tight this year","Saving money is always good"], a:0,
 why:"It uses the figures to show when the cost is recovered, which turns a general point into a judgement."}
  ]},
/* ---------------- STAGE 7 ---------------- */
{ id:7, type:'mcq', title:'Know when to judge', blurb:'Which questions need a conclusion, and what kind?', serve:7, pass:5,
  teach:`<p>Not every question needs a judgement. Writing one where it is not needed wastes time. Missing one where it is needed caps your mark.</p>
  <p>These come from the specification and from what examiners have said in their reports.</p>`,
  items:[
    {src:'AQA June 2024 · Paper 3 (examiner report)', prompt:'Do the 12-mark questions (Q1 and Q2) on Paper 3 need a conclusion?',
     o:['Yes, every answer on Paper 3 should end with a clear and balanced overall judgement','No: the examiner said a conclusion is not required for questions 1 or 2','Only if you have time left over at the end of the paper','Yes, but only a one-sentence summary of the two sides'], a:1,
     why:'The 2024 examiner wrote that a conclusion "is not required for questions 1 or 2 on this paper" and that some students\' conclusions were not answering the question set.'},
    {src:'Course rule · 9-mark questions', prompt:'What should the last sentence of a 9-mark "Analyse..." answer do?',
     o:['Give a balanced conclusion that weighs up both sides of the argument and makes a judgement','Start with "Therefore" and link the chain back to the words of the question','Introduce a second argument to show a wider range of knowledge','Ask a question that the examiner can think about after reading it'], a:1,
     why:'9-markers are analysis, not evaluation. One developed argument, finished with a "Therefore" sentence.'},
    {src:'AQA November 2020 · Paper 3 (examiner report)', prompt:'On Paper 3, how many marks are for evaluation (AO4) on a 24-mark question?',
     o:['3','9','16','12'], a:1,
     why:'The report says AO4 accounts for 7, 8 or 9 marks on 16, 20 and 24-mark questions, so a missing conclusion "severely restricts the maximum mark".'},
    {src:'AQA June 2023 · Paper 3 (examiner commentary)', prompt:'A Level 2 answer had snippets of judgement as each point was introduced but no final conclusion. What did the examiner say would most improve it?',
     o:['Adding more arguments on each side','A longer introduction defining the key terms','Adding a final judgement','Using more data from the case study in each paragraph'], a:2,
     why:'"The clearest and most effective improvement would be the addition of a final judgement, weighing up the two sides of the argument presented."'},
    {src:'AQA June 2023 · Paper 3 (examiner commentary)', prompt:'A conclusion is well written but is based on a calculation the student got wrong earlier. What happens?',
     o:['It still scores well, because the conclusion is marked separately from the rest','It will not score well, because it is based on flawed analysis','The examiner ignores the earlier mistake if the conclusion is strong enough','It scores full marks for evaluation but loses the marks for the calculation'], a:1,
     why:'Your judgement is only as strong as the analysis underneath it.'},
    {src:'AQA June 2023 · Paper 3 (examiner commentary)', prompt:'What did the examiner say great evaluation should do?',
     o:['Tie together the issues raised earlier in the answer','Introduce a fresh idea at the end to impress the examiner','Repeat the introduction so the answer feels complete','List every advantage and disadvantage one more time'], a:0,
     why:'"Great evaluation can be seen as tying together all of the issues raised earlier in the answer." Conclusions should be unique to your answer.'},
    {src:'AQA June 2017 · Paper 3 (examiner report)', prompt:'A question asks which of two factors is the main cause of a fall in profit. A student analyses both carefully but never says which is bigger. What is the problem?',
     o:['None, because thorough analysis of both factors is what earns the marks','They must decide which cause is bigger and defend that judgement','They should have analysed a third factor as well to show breadth','They should have questioned whether the profit figures were accurate'], a:1,
     why:'The 2017 examiner: students "need to think about the judgement they have to make in these questions, be clear what their judgement is and defend it."'},
{src:"Exam technique · command words", prompt:"Which of these tells you a judgement is needed?",
 o:["Analyse","To what extent","Explain","Calculate"], a:1,
 why:"\"To what extent\" asks how far something is true, so you must weigh it up and decide."},
{src:"Course rule · 9-mark questions", prompt:"On a 9-mark \"Analyse\" question, a student adds a counter-argument and a conclusion. What is the effect?",
 o:["It uses time that should go on one argument","It earns the evaluation marks for that question","It is required by the mark scheme on every question, whatever the command word is","It turns the answer into a Level 4 response automatically"], a:0,
 why:"Analyse questions reward depth of analysis, not evaluation."},
{src:"Exam technique · command words", prompt:"A question ends \"Justify your view\". What must the answer contain?",
 o:["A clear view, with reasons why it is right","A list of advantages and disadvantages only","An explanation of both sides without choosing","A definition of every key term"], a:0,
 why:"You need a view, and the reasons that support it."},
{src:"Exam technique · essays", prompt:"Where should judgement appear in a strong 25-mark answer?",
 o:["Throughout, and in a final conclusion","Only in the last sentence","Only in the introduction, so the examiner knows the answer from the start","Nowhere, as long as the analysis is strong"], a:0,
 why:"Weighing each argument as you go makes the final judgement stronger and better supported."},
{src:"Exam technique · conclusions", prompt:"A student ends with \"it depends\" but does not say on what. How will this be seen?",
 o:["As a weak judgement, because it does not say what decides the answer","As a strong judgement, because it shows balance","As a full answer to the question","As a new argument"], a:0,
 why:"\"It depends\" only earns credit when you name the factor and explain why it decides the answer."},
{src:"Exam technique · Paper 3", prompt:"Which of these is Paper 3 question 6 most likely to need that questions 1 and 2 do not?",
 o:["A final judgement that weighs up the arguments","A calculation using data from the appendices","A definition","A diagram"], a:0,
 why:"The longer questions carry evaluation marks, so they need a judgement."},
{src:"Exam technique · comparing options", prompt:"A 16-mark question asks you to assess two options. What should the conclusion do?",
 o:["Choose one option and explain why it is better for this business","Describe both options again","Say both options are equally good, so the business could choose either one","Suggest a third option"], a:0,
 why:"A choice, with a reason specific to the business, is what turns analysis into judgement."},
{src:"Exam technique · conclusions", prompt:"What is the difference between a summary and a judgement?",

/* ---------------- STAGE 8 ---------------- */
{ id:8, type:'calc', title:'Judge with numbers', blurb:'Work out the figure that should drive your judgement.', serve:5, pass:4,
  teach:`<p>The strongest judgements use a number you have worked out. Examiners keep noting a "lack of relevant calculations to support arguments and/or conclusions."</p>
  <p>Type your answer as a number. You get one try. After each one you will see how the figure could be used in a judgement.</p>`,
  items:[
    {src:'Based on AQA June 2019 · Paper 1 · Q18', given:'Option A costs <b>£2m</b>. It has a 60% chance of earning <b>£5m</b> and a 40% chance of earning <b>£0.5m</b>.', prompt:'Calculate the expected net gain of Option A.', unit:'£m', pre:true, ans:1.2, tol:0.01,
     traps:[{v:3.2,m:'That is the expected value before the cost is taken off. Net gain = expected value − cost.'}],
     work:'Expected value = (0.6 × £5m) + (0.4 × £0.5m) = £3m + £0.2m = £3.2m. Net gain = £3.2m − £2m = £1.2m.',
     use:'In a judgement: "Option A has the higher expected net gain, but if it fails the business loses £1.5m, which a firm with little cash may not survive."'},
    {src:'Based on AQA June 2019 · Paper 1 · Q18', given:'Option B costs <b>£0.5m</b>. It has a 90% chance of earning <b>£1.5m</b> and a 10% chance of earning <b>£0.8m</b>.', prompt:'Calculate the expected net gain of Option B (to 2 decimal places).', unit:'£m', pre:true, ans:0.93, tol:0.006,
     traps:[{v:1.43,m:'That is before the £0.5m cost is taken off.'}],
     work:'Expected value = (0.9 × £1.5m) + (0.1 × £0.8m) = £1.35m + £0.08m = £1.43m. Net gain = £1.43m − £0.5m = £0.93m.',
     use:'The 2019 examiner rewarded answers showing B "cannot make a loss either way" while A carries a probable significant loss. B\'s worst case is still +£0.3m.'},
    {src:'Exam-style · investment appraisal', given:'A project costs <b>£100,000</b> and brings in <b>£40,000</b> a year for 3 years. Discount factors at 8%: year 1 <b>0.926</b>, year 2 <b>0.857</b>, year 3 <b>0.794</b>.', prompt:'Calculate the net present value.', pre:'£', unit:'', ans:3080, tol:2,
     traps:[{v:20000,m:'You did not discount the cash flows. £120,000 − £100,000 ignores the time value of money.'},{v:103080,m:'That is the present value of the inflows. Now subtract the £100,000 cost.'}],
     work:'Present value = £40,000 × (0.926 + 0.857 + 0.794) = £40,000 × 2.577 = £103,080. NPV = £103,080 − £100,000 = £3,080.',
     use:'In a judgement: "the NPV is positive but only £3,080, so a small shortfall in forecast sales would make the project lose money."'},
    {src:'Exam-style · payback', given:'An investment costs <b>£150,000</b>. Net cash inflows: year 1 <b>£40,000</b>, year 2 <b>£50,000</b>, year 3 <b>£80,000</b>.', prompt:'Calculate the payback period in years (to 2 decimal places).', unit:'years', ans:2.75, tol:0.01,
     traps:[{v:3,m:'Payback happens during year 3, not at the end of it. Work out what fraction of year 3 is needed.'}],
     work:'After 2 years: £40,000 + £50,000 = £90,000. Still needed: £60,000. £60,000 ÷ £80,000 = 0.75 of year 3. Payback = 2.75 years (2 years 9 months).',
     use:'In a judgement: "payback of 2 years 9 months is inside the business\'s 3-year target, but only just, so a delay to sales would push it over."'},
    {src:'Exam-style · proportion', given:'New regulations add <b>£1.2m</b> a year to costs. Revenue is <b>£60m</b>. Operating profit is <b>£4m</b>.', prompt:'What percentage of operating profit is the extra cost?', unit:'%', ans:30, tol:0.05,
     traps:[{v:2,m:'That is the cost as a share of revenue. Compare it with profit to judge how serious it is.'}],
     work:'£1.2m ÷ £4m × 100 = 30%.',
     use:'In a judgement: "although the cost is only 2% of revenue, it would wipe out 30% of operating profit, so it is a serious threat unless it can be passed on in prices."'},
{src:"Exam-style · decision trees", gen(){const C=pick([1,1.5,2,2.5]),p=pick([0.5,0.6,0.7,0.8]),H=pick([4,5,6]),L=pick([0.2,0.5,1]),ev=r2(p*H+(1-p)*L),ans=r2(ev-C);
  return {given:`An option costs <b>£${C}m</b>. It has a ${Math.round(p*100)}% chance of earning <b>£${H}m</b> and a ${Math.round((1-p)*100)}% chance of earning <b>£${L}m</b>.`,prompt:'Calculate the expected net gain (to 2 decimal places, use − if negative).',pre:true,ans,tol:0.006,
    traps:[{v:ev,m:'That is the expected value before the cost. Net gain = expected value − cost.'}],
    work:`Expected value = (${p} × £${H}m) + (${r2(1-p)} × £${L}m) = £${f(ev)}m. Net gain = £${f(ev)}m − £${C}m = ${ans<0?'−£'+f(-ans):'£'+f(ans)}m.`,
    use:`In a judgement: the worst case is £${L}m − £${C}m = ${L-C<0?'−£'+f(r2(C-L)):'£'+f(r2(L-C))}m, so a business that cannot afford that outcome may prefer a safer option.`};}},
{src:"Exam-style · proportion", gen(){const P=pick([2,4,5,8,10]),R=P*pick([10,15,20]),pc=pick([10,15,20,25,40]),X=r2(P*pc/100);
  return {given:`A new tax adds <b>£${f(X)}m</b> a year to costs. Revenue is <b>£${R}m</b>. Operating profit is <b>£${P}m</b>.`,prompt:'What percentage of operating profit is the extra cost?',unit:'%',ans:pc,tol:0.05,
    traps:[{v:r1(X/R*100),m:'That is the cost as a share of revenue. Compare it with profit to judge how serious it is.'}],
    work:`£${f(X)}m ÷ £${P}m × 100 = ${pc}%.`,use:`In a judgement: "only ${r1(X/R*100)}% of revenue, but ${pc}% of profit".`};}},
{src:"Exam-style · one-off against recurring", gen(){const S=pick([40,60,80,120]),k=rint(1,3),fr=pick([0.25,0.5,0.75]),C=S*(k+fr),ans=(k+fr)*12;
  return {given:`Restructuring costs <b>£${f(C)}k</b> once. It saves <b>£${S}k</b> a year.`,prompt:'After how many months will the savings have covered the cost?',unit:'months',ans,tol:0,
    traps:[{v:k+fr,m:'That is the answer in years. Multiply by 12.'}],
    work:`£${f(C)}k ÷ £${S}k = ${k+fr} years = ${ans} months.`,use:`In a judgement: "after ${ans} months the business is better off every year, so the one-off cost is outweighed if it plans to keep the new structure."`};}},
{src:"Exam-style · main cause", gen(){const T=pick([40,50,60,80,100]),pa=pick([55,60,65,70,75]),a=T*pa/100;
  return {given:`Profit fell by <b>£${T}k</b>. Higher material costs account for <b>£${f(a)}k</b> of the fall. The rest was caused by a lost contract.`,prompt:'What percentage of the fall is explained by higher material costs?',unit:'%',ans:pa,tol:0.05,
    traps:[{v:100-pa,m:'That is the share caused by the lost contract.'}],
    work:`£${f(a)}k ÷ £${T}k × 100 = ${pa}%.`,use:`In a judgement: "material costs explain ${pa}% of the fall, so they are the main cause, more than ${f(pa/(100-pa))} times the effect of the lost contract."`};}},
{src:"Exam-style · margin for error", gen(){const PV=pick([100000,120000,150000,200000]),pc=pick([2,4,5,8,10]),N=PV*pc/100;
  return {given:`A project has an NPV of <b>£${f(N)}</b>. The present value of its cash inflows is <b>£${f(PV)}</b>.`,prompt:'By what percentage could the inflows fall before the NPV reaches zero?',unit:'%',ans:pc,tol:0.05,
    traps:[{v:r1(N/(PV-N)*100),m:'Divide by the present value of the inflows, not by the initial cost.'}],
    work:`£${f(N)} ÷ £${f(PV)} × 100 = ${pc}%.`,use:pc<=5?'In a judgement: "a shortfall of only '+pc+'% would make the project lose money, so it is risky."':'In a judgement: "the inflows could fall by '+pc+'% and the project would still break even."'};}}
  ]},

{ id:10, type:'write', title:'Write the conclusion', blurb:'Write the conclusion to a real 25-mark question.', pass:1,
  teach:`<p>This is the June 2024 Paper 1 question 24. The arguments are already written for you. Your job is the conclusion only.</p>
  <p>Answer the question, weigh the two sides, say what it depends on, and finish by answering the question again. Do not add a new argument. Aim for roughly 80 to 150 words.</p>`,
  items:[{src:'AQA June 2024 · Paper 1 · Q24', w:{
    intro:`<div class="qbox">${LEAN_Q} <span style="color:var(--muted);font-weight:400">(25 marks)</span></div>
      <div class="card" style="margin-bottom:14px"><span class="src">Argument for (already written)</span><p>Lean production cuts waste at every stage. With just-in-time, a manufacturer such as Toyota holds very little stock, so it saves on warehousing and on stock going out of date. Kaizen means workers keep finding small improvements, so defects and rework fall. Because these savings apply to every unit made, unit costs fall, especially for high-volume producers.</p></div>
      <div class="card" style="margin-bottom:18px"><span class="src">Argument against (already written)</span><p>Lean production depends on suppliers delivering exactly on time. During the 2021 semiconductor shortage, car makers relying on just-in-time had to halt production lines. When output stops, fixed costs are spread over fewer units, so unit costs rise. Lean also needs staff training and reliable local suppliers, which a small business making short runs may not have, so the savings may never appear.</p></div>`,
    placeholder:'Write your conclusion here...',
    checks:[
      {k:'answer',label:'First sentence answers the question, including "always"',test:x=>/(not always|won't always|will not always|doesn't always|does not always|usually|in most cases|mostly|generally|often|not necessarily)/.test(x.first)},
      {k:'weigh',label:'Says which side carries more weight',test:x=>/(outweigh|more significant|more important|matters more|carries more|bigger|greater|stronger|main reason|most significant|most important)/.test(x.low)},
      {k:'why',label:'Gives a reason for that weighting',test:x=>/\b(because|since|as)\b/.test(x.low)},
      {k:'depends',label:'Says what it depends on',test:x=>/(depends|as long as|provided|unless|only if|only when|only for|if the|where the|when the)/.test(x.low)},
      {k:'context',label:'Uses the arguments\' context (suppliers, stock, Toyota, defects...)',test:x=>/(supplier|supply|stock|toyota|defect|waste|semiconductor|chip|volume|training)/.test(x.low)},
      {k:'end',label:'Last sentence answers the question (unit costs)',test:x=>/unit cost/.test(x.last)}],
    warn:x=>/(furthermore|moreover|in addition|another (reason|factor|benefit|advantage|point)|also improves|environment)/.test(x.low)?{msg:'Is this a new argument? A conclusion should weigh what you have already written, not add to it.',block:true}
      :/(will always|always lead to lower|always lowers)/.test(x.first)?{msg:'Your first sentence agrees that it "always" works. The argument against shows an exception, so "always" is hard to defend.',block:true}
      :x.words>200?{msg:'This is long for a conclusion. Aim for roughly 80 to 150 words.'}
      :/(on one hand|firstly|secondly)/.test(x.low)?{msg:'This reads like a summary of the arguments. Weigh them instead.'}:null,
    minCompare:40, minAi:50,
    model:`<span class="src">One way to write it</span><p>Lean production will usually lower unit costs, but not always. For a high-volume manufacturer with reliable suppliers, the savings from holding less stock and making fewer defects apply to every unit, so they <span class="hl-w">outweigh</span> the one-off cost of training staff. The argument against matters most where the supply chain is long or fragile: the 2021 chip shortage showed that when deliveries stop, output falls while fixed costs carry on, so unit costs rise sharply. Which effect wins <span class="hl-w">depends mainly on</span> how reliable the business's suppliers are. So lean production is likely to lower unit costs for most manufacturers most of the time, but a business that cannot rely on its suppliers may find the risk of disruption outweighs the savings.</p>
      <p style="margin-top:14px;font-size:.9rem;color:var(--muted)">Notice it adds nothing new. Every idea comes from the two arguments above, and the first and last sentences both answer the question.</p>`,
    ai:`You are an experienced AQA A-level Business teacher giving feedback on a student's CONCLUSION ONLY to the 25-mark question: "Will the introduction of lean production always lead to lower unit costs? Justify your view."
The student was given two arguments. For: JIT and kaizen cut stock, waste and defects, so unit costs fall, especially for high-volume producers like Toyota. Against: lean depends on suppliers delivering on time (the 2021 semiconductor shortage halted car production lines, so fixed costs were spread over fewer units and unit costs rose); training costs; small short-run businesses may not see the savings.
Judge the conclusion only on: whether it answers the question directly including the word "always"; whether it says which side carries more weight AND why; whether it gives a specific "depends on" condition linked to the arguments; whether it stays proportionate; whether it avoids adding any new argument (the AQA examiner says new issues in conclusions harm the answer); whether the last sentence answers the question. Do not reward formulaic phrasing for its own sake; the examiner has warned that formulaic conclusions can hinder.
Do not give a mark or level. Write in plain British English, as a teacher speaking to a Year 13 student. No headings, no emoji. Give one sentence on what works, then two or three improvements, each quoting a short phrase they wrote ("You wrote: ...") and showing a better version ("You could write: ..."). Keep it under 220 words.`,
    doneTitle:'Course complete',
    doneText:'You can now tell a summary from a judgement and build one that weighs both sides. Use the same habit on every 16, 20, 24 and 25-mark answer: decide your answer before you start writing, and make sure every conclusion weighs, explains and says what it depends on.'
  }}]}
];
