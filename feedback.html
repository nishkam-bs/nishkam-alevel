/* ===== CSV PARSER — handles quoted multiline cells, CRLF, LF ===== */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < text.length && text[i + 1] === '"') {
          cell += '"'; i++;
        } else {
          inQuotes = false;
        }
      } else {
        cell += ch;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        row.push(cell); cell = "";
      } else if (ch === '\r') {
        row.push(cell); cell = "";
        rows.push(row); row = [];
        if (i + 1 < text.length && text[i + 1] === '\n') i++;
      } else if (ch === '\n') {
        row.push(cell); cell = "";
        rows.push(row); row = [];
      } else {
        cell += ch;
      }
    }
  }
  if (cell.length > 0 || row.length > 0) { row.push(cell); rows.push(row); }
  return rows;
}

/* ===== NAME NORMALISATION ===== */
function norm(val) {
  if (val == null) return "";
  return String(val).toLowerCase().trim().replace(/\u00A0/g, " ").replace(/\s+/g, " ").normalize("NFC");
}

/* ===== FETCH PUBLISHED CSV ===== */
async function fetchALevel() {
  const resp = await fetch(ALEVEL_CSV_URL);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const text = await resp.text();
  const rows = parseCSV(text);

  /* --- diagnostic logging --- */
  console.log("CSV characters:", text.length);

  console.log("First 3:", rows.slice(0, 3));
  console.log("Last 3:", rows.slice(-3));
  const sukhRows = rows.filter(r => r.some(cell => String(cell).toLowerCase().includes("sukhchain")));
  console.log("Sukhchain rows:", sukhRows);

  /* --- end diagnostic logging --- */

  return rows;
}

/* ===== HEADER-BASED COLUMN MAPPING ===== */
function buildHeaderMap(headerRow) {
  const map = { ts:0, nm:1, q:2, marks:3, lv:4, w1:5, w2:6, e1:7, e2:8, tool:9 };
  if (!headerRow) return map;
  for (let i = 0; i < headerRow.length; i++) {
    const h = norm(headerRow[i]);
    if (h.includes("time")) map.ts = i;
    else if (h.includes("student") || h === "name") map.nm = i;
    else if (h.includes("paper") || h.includes("question")) map.q = i;
    else if (h.includes("mark")) map.marks = i;
    else if (h.includes("level")) map.lv = i;
    else if (h.includes("www") && !h.includes("2")) map.w1 = i;
    else if (h.includes("www") && h.includes("2")) map.w2 = i;
    else if (h.includes("ebi") && !h.includes("2")) map.e1 = i;
    else if (h.includes("ebi") && h.includes("2")) map.e2 = i;
    else if (h.includes("tool")) map.tool = i;
  }
  return map;
}

/* ===== PARSE ALL DATA ROWS ===== */
function parseAllRows(rows) {
  if (rows.length < 2) return [];
  const hm = buildHeaderMap(rows[0]);
  const data = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r || !r[hm.nm]) continue;
    const mrRaw = (r[hm.marks] || "").trim();
    let ma = "", mt = "";
    const m = mrRaw.match(/(\d+)\s*\/\s*(\d+)/);
    if (m) { ma = m[1]; mt = m[2]; } else { ma = mrRaw; mt = mrRaw; }
    data.push({
      ts:   (r[hm.ts]   || "").trim(),
      nm:   (r[hm.nm]   || "").trim(),
      q:    (r[hm.q]    || "").trim(),
      ma, mt,
      lv:   (r[hm.lv]   || "").trim(),
      w1:   (r[hm.w1]   || "").trim(),
      w2:   (r[hm.w2]   || "").trim(),
      e1:   (r[hm.e1]   || "").trim(),
      e2:   (r[hm.e2]   || "").trim(),
      tool: (r[hm.tool] || "").trim()
    });
  }
  return data;
}

/* ===== FILTER FOR ONE STUDENT ===== */
function filterStudent(allData, student) {
  const searchNames = student.sh || [norm(student.fn)];
  const examNum = student.ex;
  const isAmbiguous = norm(student.fn) === "avleen";

  return allData.filter(d => {
    const n = norm(d.nm);

    // Exact match against any search name
    for (const sn of searchNames) {
      if (n === sn) return true;
    }

    // Partial match — but NOT for ambiguous names (avleen)
    if (!isAmbiguous) {
      for (const sn of searchNames) {
        if (n.includes(sn) || sn.includes(n)) return true;
      }
    }

    // Exam number match — check if the name field contains the exam number
    if (examNum && d.nm.includes(examNum)) return true;

    return false;
  });
}

  t+=`RULES:\n- Every WWW bullet must name the specific topic or skill\n- Every EBI bullet must name the specific error\n- Every TARGET must be a specific action\n- If a weakness from the KAT mock also appears in their submissions, call it out as a pattern\n- Never write "A*" — say "top grade"\n- Bullets only, no paragraphs\n\n`;

}

  pr+=weak.join("\n")+"\n\n";

  pr+=`Format:\n## Q1\n[question]\n## A1\n[answer]\n...through Q6/A6\n\nRules:\n- Target weak areas\n- Mix: calculations, retrieval, analysis\n- ONE trap (obvious answer wrong)\n- ONE rearranged calculation\n- ONE model applied to real business\n- Step-by-step answers\n- Use (a),(b),(c) for sub-parts\n- Never write "A*"\n`;

      if(d.sd.length){
        d.sd.slice(-3).forEach(sub=>{
          tp+=`- Submission: "${sub.q}" ${sub.ma}/${sub.mt} (${sub.lv})`;
          if(sub.e1)tp+=` EBI: ${sub.e1}`;
          tp+=`\n`;
        });
      }
    });
    tp+=`\n=== FORMAT ===\nWrite these sections:\n\n## URGENT INTERVENTIONS\nWhich students need immediate support? Name them, explain why, and say what specific action to take. 5-8 bullets.\n\n## CLASS-WIDE GAPS\nWhat topics or skills are weak across the whole class? Be specific — name the topics, the question types, and how many students are affected. 5-8 bullets.\n\n## STRENGTHS\nWhat is the class doing well? Where are students improving? 3-5 bullets.\n\n## PRIORITIES FOR NEXT WEEK\nWhat should you teach or set as homework this week? Name the topic, the question type, and why. 4-6 bullets.\n\nKeep each bullet under 25 words. Be direct. Never write "A*" — say "top grade".\n`;
    const resp=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2500,messages:[{role:"user",content:tp}]})});
    if(resp.ok){const j=await resp.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");h+=`<div class="fl f-nv"><h3>Teaching analysis</h3>${md(txt)}</div>`}
  }catch(e){}

  // Generate activities buttons
  h+=`<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">`;
  h+=`<button class="ibtn" onclick="genStudentActivities()" id="genStuBtn">📝 Generate student activities</button>`;
  h+=`<button class="ibtn" onclick="genTeachingActivity()" id="genTchBtn" style="background:linear-gradient(135deg,#1a3a2a,#2a5a3a)">📋 Generate teaching activity</button>`;
  h+=`</div>`;
  h+=`<div id="tchGenWrap" class="gw hide"></div>`;

  tv.innerHTML=h;
}

async function genStudentActivities(){
  const btn=document.getElementById("genStuBtn");btn.disabled=true;btn.innerHTML='<span class="sp" style="width:16px;height:16px;border-width:2px;margin:0"></span> Generating...';
  const gw=document.getElementById("tchGenWrap");

  let pr=`You are an A-Level Business teacher. Create a personalised activity sheet for each student in the class. This will be printed and given to students.\n\n`;
  pr+=`=== STUDENT PROFILES ===\n`;
  SS.forEach(s=>{
    const p=P[s.k];if(!p)return;
    const sd=filterStudent(tchAllData||[],s);
    pr+=`\n${s.fn} (KAT: ${p.g}):\n- Weak: ${p.std.ebi}\n- Calc: ${p.calc.ebi}\n- MCQ: ${p.mcq.ebi}\n- AO3: ${p.ao3.ebi}\n`;
    if(sd.length){sd.slice(-2).forEach(sub=>{if(sub.e1)pr+=`- Latest EBI: ${sub.e1}\n`})}
  });
  pr+=`\n=== FORMAT ===\nFor EACH student, write:\n\n## [Student name]\n**Focus:** [their 2-3 key topics to work on]\n\nThen 4 questions targeting their specific gaps. Mix: at least one calculation, one retrieval/definition, one short analysis, one that tests a common trap.\n\nAfter ALL students, write:\n\n## ANSWERS\nFull model answers for every question, grouped by student.\n\nRules:\n- Questions must be specific to each student's weaknesses\n- Calculations must show full working in answers\n- Include traps where relevant\n- Keep questions concise and exam-style\n- Never write "A*"\n`;

  try{
    const resp=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:8000,messages:[{role:"user",content:pr}]})});
    if(resp.ok){
      const j=await resp.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      gw.innerHTML=`<div class="fl"><h3>Student activities</h3><p style="font-size:.78rem;color:var(--tl);margin-bottom:10px">Print this and hand out — each student has their own section with targeted questions.</p>${md(txt)}</div>`;
      gw.classList.remove("hide");
    }
  }catch(e){}
  btn.innerHTML='📝 Generate student activities';btn.disabled=false;
}

async function genTeachingActivity(){
  const btn=document.getElementById("genTchBtn");btn.disabled=true;btn.innerHTML='<span class="sp" style="width:16px;height:16px;border-width:2px;margin:0"></span> Generating...';
  const gw=document.getElementById("tchGenWrap");

  // Find the most common class-wide weaknesses
  const allWeaks=[];
  SS.forEach(s=>{const p=P[s.k];if(!p)return;
    if(p.calc.tag==="rd")allWeaks.push("Calculations: "+p.calc.ebi);
    if(p.mcq.tag==="rd")allWeaks.push("MCQs: "+p.mcq.ebi);
    if(p.ao3.tag==="rd")allWeaks.push("AO3: "+p.ao3.ebi);
    if(p.eval.tag==="rd")allWeaks.push("Eval: "+p.eval.ebi);
  });

  let pr=`You are an A-Level Business teacher planning a lesson. Based on the class data below, design a 50-minute lesson activity that addresses the biggest class-wide gaps.\n\n`;
  pr+=`=== CLASS GAPS ===\n`;
  SS.forEach(s=>{const p=P[s.k];if(!p)return;pr+=`${s.fn}: KAT ${p.g}. Key gap: ${p.std.ebi}\n`});
  if(tchAllData&&tchAllData.length){
    const recentEbis=tchAllData.slice(-15).map(d=>d.e1).filter(e=>e&&e!=="—"&&e!=="None");
    if(recentEbis.length){pr+=`\nRecent submission EBIs:\n`;recentEbis.forEach(e=>{pr+=`- ${e}\n`})}
  }

  pr+=`\n=== FORMAT ===\nDesign a lesson activity with:\n\n## LESSON FOCUS\nOne sentence: what this lesson targets and why.\n\n## STARTER (5 mins)\nA quick retrieval or diagnostic activity. Give the exact questions.\n\n## MAIN ACTIVITY (30 mins)\nA structured task the whole class does. Give the exact resources, questions, or scenarios. Include differentiation — what the weaker students focus on vs the stronger ones.\n\n## STRETCH (10 mins)\nA harder challenge for students who finish early. Exam-style.\n\n## PLENARY (5 mins)\nHow to close the lesson. Exit ticket or key question.\n\n## RESOURCES NEEDED\nWhat to prepare or print.\n\nRules:\n- Be specific — give actual questions, not "ask students about X"\n- Include numbers and data where relevant\n- Differentiate between weaker and stronger students\n- Focus on the most common gaps across the class\n- Never write "A*"\n`;

  try{
    const resp=await fetch(WORKER,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:4000,messages:[{role:"user",content:pr}]})});
    if(resp.ok){
      const j=await resp.json();const txt=(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");
      gw.innerHTML=`<div class="fl"><h3>Teaching activity</h3><p style="font-size:.78rem;color:var(--tl);margin-bottom:10px">A lesson plan targeting your class's biggest gaps, ready to deliver.</p>${md(txt)}</div>`;
      gw.classList.remove("hide");
    }
  }catch(e){}
  btn.innerHTML='📋 Generate teaching activity';btn.disabled=false;
}

/* ===== HELPERS ===== */
function sh(id){document.getElementById(id).classList.remove("hide")}
function hi(id){document.getElementById(id).classList.add("hide")}
function se(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block"}
function lm(m){document.getElementById("ldM").textContent=m}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fD(ts){try{const d=new Date(ts);if(isNaN(d))return ts.substring(0,10);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}catch(e){return ts.substring(0,10)}}
function gcl(g){return g==="A*"?"astar":g.toLowerCase()}
function md(t){let h=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');h=h.replace(/((?:<li>.*?<\/li>\s*(?:<br>)?)+)/g,'<ul>$1</ul>').replace(/<br><\/ul>/g,'</ul>').replace(/<ul><br>/g,'<ul>');return'<p>'+h+'</p>'}
function reset(){hi("resV");document.getElementById("stuV").classList.add("hide");document.getElementById("tchV").classList.add("hide");sh("loginV");document.getElementById("err").style.display="none";ns.value="";document.getElementById("en").value="";document.getElementById("pw").value=""}
</script>
