<script>
/* =====================================================================
   APPLICATION COURSE (AO2)
   Built on what AQA examiner reports 2017–2026 say about using the case
   and the data. Bloom Garden Supplies, Kaya Fresh and Pellow Joinery are
   made-up businesses written for this course. "Based on" means the issue
   comes from the report; the wording of every item is our own.
   Stage numbers are stored in the tracking sheet as 400 + stage.
   ===================================================================== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b,s=1)=>a+s*Math.floor(Math.random()*((b-a)/s+1));
const f=n=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:2});
const r1=n=>Math.round(n*10)/10;

const BLOOM_INTRO='Bloom Garden Supplies Ltd makes compost and plant feed and sells them to garden centres, not to the public. Most of its sales come in spring.';
const BLOOM_TABLE=`<p style="font-size:.92rem;margin-bottom:8px">${BLOOM_INTRO}</p><div class="tablewrap"><table class="d"><thead><tr><th>Bloom Garden Supplies</th><th class="r">2024</th><th class="r">2025</th><th class="r">Industry 2025</th></tr></thead><tbody>
<tr><td>Revenue (£m)</td><td class="r">4.2</td><td class="r">4.6</td><td class="r">–</td></tr>
<tr><td>Orders delivered on time (%)</td><td class="r">94</td><td class="r">86</td><td class="r">95</td></tr>
<tr><td>Garden centre customers</td><td class="r">140</td><td class="r">126</td><td class="r">–</td></tr>
<tr><td>Labour turnover (%)</td><td class="r">11</td><td class="r">19</td><td class="r">10</td></tr>
<tr><td>Operating profit margin (%)</td><td class="r">8.0</td><td class="r">6.5</td><td class="r">9.0</td></tr></tbody></table></div>`;
const KAYA_TABLE=`<p style="font-size:.92rem;margin-bottom:8px">Kaya Fresh runs 12 convenience stores selling groceries and fresh food.</p><div class="tablewrap"><table class="d"><thead><tr><th>Kaya Fresh, per store</th><th class="r">2024</th><th class="r">2025</th></tr></thead><tbody>
<tr><td>Sales per week (£)</td><td class="r">21,000</td><td class="r">19,500</td></tr>
<tr><td>Customers per week</td><td class="r">2,500</td><td class="r">2,143</td></tr>
<tr><td>Average spend per customer (£)</td><td class="r">8.40</td><td class="r">9.10</td></tr>
<tr><td>Food waste (% of stock)</td><td class="r">6</td><td class="r">9</td></tr>
<tr><td>Staff</td><td class="r">9</td><td class="r">9</td></tr></tbody></table></div>`;
const PELLOW='Sam Pellow has run Pellow Joinery for 12 years, making fitted kitchens for homeowners. He employs three joiners, all of whom have worked for him for more than eight years. In March he changed the business from a sole trader to a private limited company, and he holds all the shares himself. Most jobs are booked six months ahead.';
const BLOOM_Q='Analyse how improving its on-time delivery rate could help Bloom Garden Supplies win back garden centre customers.';
const HARLOW_INTRO='Harlow Fitness runs six gyms in towns in Essex. Members pay a monthly fee. In January 2025 it raised the fee from £32 to £35.';
const HARLOW_TABLE=`<p style="font-size:.92rem;margin-bottom:8px">${HARLOW_INTRO}</p><div class="tablewrap"><table class="d"><thead><tr><th>Harlow Fitness</th><th class="r">2024</th><th class="r">2025</th><th class="r">Industry 2025</th></tr></thead><tbody>
<tr><td>Average number of members</td><td class="r">9,600</td><td class="r">8,880</td><td class="r">–</td></tr>
<tr><td>Monthly fee (£)</td><td class="r">32</td><td class="r">35</td><td class="r">30</td></tr>
<tr><td>Members leaving each month (%)</td><td class="r">4.0</td><td class="r">5.5</td><td class="r">4.0</td></tr>
<tr><td>Staff</td><td class="r">72</td><td class="r">72</td><td class="r">–</td></tr>
<tr><td>Revenue (£m)</td><td class="r">3.69</td><td class="r">3.73</td><td class="r">–</td></tr>
<tr><td>Operating profit (£m)</td><td class="r">0.48</td><td class="r">0.37</td><td class="r">–</td></tr></tbody></table></div>`;
const ASHBY='Priya and Tom Ashby own Ashby Cycles, two bike shops in York. Last year they opened a workshop that repairs bikes for local delivery riders, who pay a monthly fee for unlimited repairs. Repair income has grown every month since it opened. The workshop has two mechanics and is fully booked most days. The Ashbys have not decided whether to open a third shop.';

const STAGES=[
/* ---------------- STAGE 1 ---------------- */
{ id:1, type:'drift', title:'Applied or generic?', blurb:'Could the sentence be about any business? Then it is not applied.', serve:10, pass:8,
  labels:['Applied to this business','Could be about any business'], showLabel:'A sentence from a student\'s answer:',
  teach:`<p>Application means your point only makes sense for <b>this</b> business in <b>this</b> situation. The June 2026 Paper 2 report said lower-scoring answers "often relied on generic business points". The November 2020 report said students with the knowledge still lost marks by "providing very generic answers and not considering the context in the case".</p>
  <p>A quick test: cover the business's name. If the sentence still works for any company, it is generic.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 2 report', q:'Bloom sells compost to garden centres. Its on-time delivery rate fell from 94% to 86%.', ok:false,
     text:'Late deliveries can damage a business\'s reputation, which may reduce its sales.',
     why:'This is true of any business. It does not mention garden centres, compost, spring or the 86%.'},
    {src:'Based on AQA June 2026 · Paper 2 report', q:'Bloom sells compost to garden centres. Its on-time delivery rate fell from 94% to 86%.', ok:true,
     text:'A garden centre that runs out of compost in April loses sales at its busiest time, so after a few late deliveries it is likely to move its orders to a supplier that delivers on time.',

    {src:'Based on AQA November 2020 · Paper 2 report', q:'Kaya Fresh runs 12 convenience stores. Food waste has risen from 6% to 9% of stock.', ok:true,
     text:'With waste up from 6% to 9% of stock, Kaya is throwing away half as much again as last year, so more of what it pays its suppliers never turns into a sale.',
     why:'It uses Kaya\'s figures and works something out from them.'},
    {src:'Based on AQA June 2025 · Paper 2 report (Q3.1)', q:'A growing low-cost airline sets an objective of keeping labour turnover below 10%.', ok:true,

     why:'It links the objective to the airline\'s low-cost model. The 2025 examiner said weaker answers "did not focus on the context of a growing low-cost airline".'},
    {src:'Based on AQA June 2025 · Paper 2 report (Q3.1)', q:'A growing low-cost airline sets an objective of keeping labour turnover below 10%.', ok:false,

    {src:'Based on AQA June 2026 · Paper 2 report (Q2.1)', q:'A social enterprise runs cafés that train and employ people who have been out of work for a long time.', ok:true,

    {src:'Based on AQA June 2026 · Paper 2 report (Q2.1)', q:'A social enterprise runs cafés that train and employ people who have been out of work for a long time.', ok:false,
     text:'Performance can be measured using a range of measures such as revenue, profit and customer satisfaction.',
     why:'This could be any café chain. It ignores the social aim.'},
    {src:'Based on AQA November 2020 · Paper 2 report (Q2.3)', q:'An online furniture retailer holds three weeks of stock in a large rented warehouse.', ok:true,
     text:'Furniture is bulky, so three weeks of stock fills a large warehouse; with just-in-time the retailer could rent far less space, but it would then rely on suppliers delivering within days of each order.',
     why:'It uses the product and the warehouse to explain both the benefit and the risk. The 2020 examiner said many answers on JIT were not set "in the context of the data and situation provided".'},
    {src:'Based on AQA November 2020 · Paper 2 report (Q2.3)', q:'An online furniture retailer holds three weeks of stock in a large rented warehouse.', ok:false,
     text:'Just-in-time reduces storage costs and waste, which improves profit.',
     why:'A textbook definition with no furniture, no warehouse and no three weeks.'},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:true,
 text:"Harlow now charges £5 a month more than the average gym, so members who joined mainly on price have a clear reason to switch to a cheaper rival.",
 why:"It uses the fee, the industry figure and the kind of customer who is likely to leave."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:false,
 text:"Raising prices can lead to customers going elsewhere, which reduces sales.",
 why:"True of almost any business. Nothing here is about gyms, memberships or the £35 fee."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:true,
 text:"Each member who cancels takes £420 a year of fees with them, so a rising leaver rate matters far more to a gym than a single lost sale does to a shop.",
 why:"£35 × 12 = £420. It uses the subscription model, which is what makes this business different."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:false,
 text:"The business should improve customer service to keep its customers happy.",
 why:"Generic advice. It could be written about a bank, a hotel or a phone company."},
{src:"Exam-style · Ashby Cycles", q:ASHBY, ok:true,
 text:"Delivery riders cannot earn while their bike is off the road, so a workshop that fixes bikes quickly is worth paying a monthly fee for.",
 why:"It explains why this particular customer values this particular service."},
{src:"Exam-style · Ashby Cycles", q:ASHBY, ok:false,
 text:"Offering a new service can increase revenue and help the business grow.",
 why:"There are no bikes, riders or monthly fees in this sentence."},
{src:"Exam-style · Ashby Cycles", q:ASHBY, ok:true,
 text:"With the workshop fully booked most days, signing up more riders would mean hiring a third mechanic before the extra fees could be earned.",
 why:"It uses the capacity fact from the case to show what growth would require."},
{src:"Exam-style · Ashby Cycles", q:ASHBY, ok:false,
 text:"Capacity utilisation is high, which means fixed costs are spread over more output.",
 why:"Correct theory, but it is not applied to a bike workshop or its mechanics."},
{src:"Exam-style · Pellow Joinery", q:PELLOW, ok:true,
 text:"With jobs booked six months ahead, Sam could raise his prices on new bookings with little risk of running out of work.",
 why:"It uses the order book from the case to support a pricing decision."},
{src:"Exam-style · Pellow Joinery", q:PELLOW, ok:false,
 text:"A business with strong demand can increase its prices.",
 why:"No joinery, no kitchens, no six-month order book."},
{src:"Exam-style · international trade", q:"A Scottish salmon farm exports 60% of its fish to France. The pound has fallen against the euro.", ok:true,
 text:"French buyers now pay fewer euros for the same Scottish salmon, which could win orders from Norwegian farms that compete in the same market.",
 why:"It uses the product, the market and the competitors."},
{src:"Exam-style · international trade", q:"A Scottish salmon farm exports 60% of its fish to France. The pound has fallen against the euro.", ok:false,
 text:"A weaker pound makes exports cheaper, so demand is likely to rise.",
 why:"Correct but generic. It does not mention salmon, France or the 60%."},
{src:"Exam-style · operations", q:"A small brewery is running at 95% capacity. A national pub chain wants to stock its beer.", ok:true,
 text:"At 95% the brewery could only supply a small part of a national order, so it would need new tanks before it could accept, which means borrowing or using retained profit.",
 why:"It uses the 95% and the size of the customer to show what accepting the order would involve."},
{src:"Exam-style · operations", q:"A small brewery is running at 95% capacity. A national pub chain wants to stock its beer.", ok:false,
 text:"High capacity utilisation means the business may struggle to meet extra demand.",
 why:"A general statement about capacity that ignores the brewery and the pub chain."}
  ]},

/* ---------------- STAGE 2 ---------------- */
{ id:2, type:'mcq', title:'Pick the right data', blurb:'Choose the figures that support the point, and read them correctly.', serve:8, pass:6,
  teach:`<p>You will rarely need every number in an appendix. The June 2026 Paper 2 report said stronger answers "were selective in their use of data". In 2018 the examiner described answers that "listed appendices" and ended up with "a wealth of under-developed points".</p>
  <p>Read the data carefully as well. In 2025 the Paper 3 examiner showed an answer whose arguments were "flawed" because it misread the appendix.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 2 report', table:BLOOM_TABLE, prompt:BLOOM_Q+' Which data would you use first?',
     o:['Revenue rose from £4.2m to £4.6m, so the business is still growing','On-time deliveries fell from 94% to 86%, below the industry\'s 95%','The operating profit margin fell from 8% to 6.5%, below the industry\'s 9%','Labour turnover rose from 11% to 19%, almost double the industry average'], a:1,
     why:'The question starts from on-time delivery, so that is the first figure you need.'},
    {src:'Based on AQA June 2026 · Paper 2 report', table:BLOOM_TABLE, prompt:'Same question. Which second piece of data best shows why it matters?',
     o:['Garden centre customers fell from 140 to 126','Revenue rose from £4.2m to £4.6m in a year','Labour turnover rose from 11% to 19% over the year','The industry operating profit margin is 9.0%'], a:0,
     why:'The end point is winning back customers, and this shows 14 have already been lost.'},
    {src:'Based on AQA June 2026 · Paper 2 report', table:BLOOM_TABLE, prompt:'Analyse why Bloom\'s operating profit margin might have fallen. Which data helps explain it?',
     o:['Labour turnover rose from 11% to 19%','Garden centre customers fell from 140 to 126','The industry on-time delivery rate is 95%, well above Bloom\'s','Revenue rose by £0.4m'], a:0,
     why:'Recruiting and training replacements add to operating costs, which squeezes the margin. The other figures do not explain costs.'},
    {src:'Based on AQA June 2025 · Paper 3 report (Q3)', table:BLOOM_TABLE, prompt:'Which statement misreads the data?',
     o:['Revenue rose even though customers fell, so each remaining customer is buying more','Bloom is losing customers, so its revenue must be falling','Bloom\'s delivery rate is now 9 percentage points below the industry average','Labour turnover has nearly doubled'], a:1,
     why:'Revenue actually rose. An argument built on a misreading falls apart, which is what the 2025 examiner described.'},
    {src:'Based on AQA June 2026 · Paper 2 report', table:KAYA_TABLE, prompt:'Analyse how reducing food waste could improve Kaya Fresh\'s profit. Which data matters most?',
     o:['Food waste rose from 6% to 9% of stock','Average spend rose from £8.40 to £9.10','Staff per store stayed at 9','There are 12 stores'], a:0,

    {src:'Based on AQA June 2026 · Paper 2 report', table:KAYA_TABLE, prompt:'Analyse why Kaya\'s sales per store have fallen. Which pair of figures explains it?',
     o:['Customers fell from 2,500 to 2,143 a week, while spend per customer rose','Food waste rose from 6% to 9% of stock while staff numbers stayed at 9','Average spend rose from £8.40 to £9.10, so sales per store must have risen','There are 9 staff in each store and 12 stores in total'], a:0,
     why:'About 14% fewer customers outweighed the higher spend per customer. You need both figures to show it.'},
    {src:'Based on AQA June 2025 · Paper 3 report (Q3)', table:KAYA_TABLE, prompt:'A student writes: "Kaya\'s sales fell because customers are spending less." What is wrong?',
     o:['Nothing, the statement is correct','Average spend rose; the fall comes from fewer customers','Sales per store did not actually fall between 2024 and 2025','Average spend is not shown anywhere in the table'], a:1,
     why:'Spend went up from £8.40 to £9.10. The whole fall comes from fewer people coming in.'},
    {src:'AQA June 2025 · Paper 3 report (Q3)', prompt:'A question tells you to use Appendix C to assess whether a factory can open within a year. What happens if you only make qualitative points and ignore the appendix?',
     o:['Nothing, as long as the points are good','You are unlikely to reach Level 3 or 4','You lose one mark','You need to write more'], a:1,
     why:'The 2025 examiner said: "without accurate use of Appendix C data, responses were not likely to achieve a level 3 or 4 mark."'},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Analyse how the rise in Harlow's monthly fee might have affected its membership. Which data would you use first?",
 o:["The fee rose from £32 to £35","Staff numbers stayed the same at 72 across the six gyms","Operating profit fell from £0.48m to £0.37m over the year","There are six gyms, all in towns in Essex"], a:0,
 why:"The question starts from the fee, so you need the fee figures. The industry average shows Harlow is now dearer than most gyms."},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Same question. Which second piece of data shows the effect on members?",
 o:["Members fell from 9,600 to 8,880 and the leaver rate rose","Revenue rose from £3.69m to £3.73m, so more money came in overall","Staff numbers stayed at 72, so the cost of staff did not change much","The industry leaver rate is 4.0% a month, the same as Harlow's in 2024"], a:0,
 why:"The end point is membership, and these two figures show it falling."},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Which statement misreads the Harlow data?",
 o:["Revenue rose slightly because the higher fee more than made up for losing members","Harlow lost members, so its revenue must have fallen","Operating profit fell even though revenue rose","The leaver rate is now 1.5 percentage points above the industry"], a:1,
 why:"Revenue rose from £3.69m to £3.73m. Fewer members does not have to mean less revenue when each pays more."},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Analyse why Harlow's operating profit fell. What does the data tell you?",
 o:["Revenue rose, so costs must have risen by more than revenue","Revenue fell, so profit fell","Fewer members means lower costs, so profit should have risen","Profit fell because staff numbers rose"], a:0,
 why:"Revenue rose by about £0.04m but operating profit fell by £0.11m, so costs rose by about £0.15m. Staff numbers did not change."},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Which calculation shows how much of Harlow's profitability has been lost?",
 o:["Operating profit margin, which fell from about 13% to about 10%","Revenue per member, which rose from £384 to £420 a year","Members per gym, which fell from 1,600 to 1,480 across the six gyms","The size of the fee rise: about 9.4%"], a:0,
 why:"0.48 ÷ 3.69 = 13.0%. 0.37 ÷ 3.73 = 9.9%. The margin shows how much profit each pound of revenue now makes."},
{src:"Exam-style · Harlow Fitness", table:HARLOW_TABLE, prompt:"Harlow's monthly leaver rate rose from 4.0% to 5.5%. Which statement is accurate?",
 o:["It rose by 1.5 percentage points, which is a 37.5% increase","It rose by 1.5%","It rose by 37.5 percentage points","It rose by 1.5 percentage points, which is a 27.3% increase"], a:0,
 why:"5.5 − 4.0 = 1.5 percentage points. 1.5 ÷ 4.0 = 37.5%. Dividing by the new figure gives the wrong 27.3%."},
{src:"Exam-style · Bloom Garden Supplies", table:BLOOM_TABLE, prompt:"Analyse how Bloom's rising labour turnover might have affected its delivery performance. Which data would you use?",
 o:["Turnover rose from 11% to 19% as on-time deliveries fell to 86%","Revenue rose from £4.2m to £4.6m despite losing customers","The operating profit margin fell from 8.0% to 6.5% in a year","Garden centre customers fell from 140 to 126 over the year"], a:0,
 why:"The start point is labour turnover and the end point is delivery performance, so you need both."},
{src:"Exam-style · Bloom Garden Supplies", table:BLOOM_TABLE, prompt:"A student writes: \"Bloom's operating profit fell in 2025.\" What does the table actually show?",
 o:["It did fall, from about £336,000 to about £299,000","It rose, because revenue rose","It cannot be worked out from the table","It fell by 1.5%"], a:0,
 why:"Operating profit = margin × revenue. 8.0% × £4.2m = £336,000. 6.5% × £4.6m = £299,000. The 1.5 is the fall in the margin in percentage points, not the change in profit."},
{src:"Exam-style · Kaya Fresh", table:KAYA_TABLE, prompt:"Which figures suggest that Kaya's staff are serving fewer customers each than last year?",
 o:["Customers per week fell from 2,500 to 2,143 while staff stayed at 9","Average spend per customer rose from £8.40 to £9.10","Food waste rose from 6% to 9% of the stock bought","Sales per week fell from £21,000 to £19,500"], a:0,
 why:"Same number of staff, fewer customers: about 238 customers per member of staff each week, down from about 278."},
{src:"Exam-style · Kaya Fresh", table:KAYA_TABLE, prompt:"By what percentage did Kaya's sales per store fall?",
 o:["About 7.1%","About 7.7%","£1,500","About 14.3%"], a:0,
 why:"£1,500 ÷ £21,000 = 7.1%. 7.7% divides by the new figure. 14.3% is the fall in customers."},
{src:"Exam-style · choosing data", prompt:"An appendix gives five years of data. The question asks about the effect of a change the business made last year. Which data matters most?",
 o:["The figures from just before and just after the change","All five years, described one after another in date order","The oldest year, to show where the business started","The average of all five years"], a:0,
 why:"Comparing before and after shows whether the change made a difference. Describing every year wastes time."},
{src:"Exam-style · choosing data", prompt:"A question asks about a business's liquidity. Which pair of figures do you need?",
 o:["Current assets and current liabilities","Revenue and operating profit","Non-current liabilities and total equity","Cost of sales and average inventory"], a:0,
 why:"Liquidity is the ability to pay short-term debts, measured by the current ratio. The third option is for gearing."}
  ]},

{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:false,
 text:"Members fell from 9,600 to 8,880 and the leaver rate went up to 5.5%.",
 why:"Two figures copied out of the table."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:true,
 text:"Harlow lost 720 members, 7.5% of its total, yet revenue still edged up, so the higher fee has so far brought in more than the lost members took away.",
 why:"9,600 − 8,880 = 720, and 720 ÷ 9,600 = 7.5%. Linking it to revenue gives it meaning."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:true,
 text:"Operating profit fell by about 23% even though revenue rose, so Harlow's costs must have grown faster than its income.",
 why:"(0.48 − 0.37) ÷ 0.48 = 23%. The comparison with revenue tells you something the figures alone don't."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:false,
 text:"Operating profit was £0.48m in 2024 and £0.37m in 2025.",
 why:"Quoted, not used."},
{src:"Exam-style · Harlow Fitness", q:HARLOW_INTRO, ok:true,
 text:"If 5.5% of members leave every month, Harlow loses roughly 490 members a month and has to sign up that many just to stay the same size.",
 why:"5.5% × 8,880 ≈ 488. It shows what the percentage means in practice."},
{src:"Exam-style · Kaya Fresh", q:"Kaya Fresh runs 12 convenience stores.", ok:false,

{src:"Exam-style · Kaya Fresh", q:"Kaya Fresh runs 12 convenience stores.", ok:true,

/* ---------------- STAGE 4 ---------------- */
{ id:4, type:'calc', title:'Work it out', blurb:'Turn the figures into a number that makes your point.', serve:6, pass:5,
  teach:`<p>The June 2026 reports for Papers 2 and 3 both show that answers which calculated from the data did better than answers that just quoted it. In 2022 the Paper 2 examiner said there was "a distinct lack of relevant calculations to support arguments".</p>
  <p>These are the small calculations you do inside a paragraph, not separate calculation questions. The numbers change each time you try. After each one, read how it strengthens the argument.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 3 report (Q3)', gen(){const bill=rint(40,90)*1000,pct=pick([5,10,15,20]);
      return {given:`A business has a wage bill of <b>£${f(bill)}</b> a year. The owner is considering a <b>${pct}%</b> pay rise.`,prompt:'Calculate the extra cost per year.',pre:'£',ans:bill*pct/100,tol:0.5,
        traps:[{v:bill*(1+pct/100),m:'That is the new wage bill, not the extra cost.'}],
        work:`£${f(bill)} × ${pct}% = £${f(bill*pct/100)}.`,use:'Now compare it with profit. A cost the business can easily absorb is a very different argument from one that wipes out its profit.'};}},
    {src:'Based on AQA June 2026 · Paper 3 report (Q3)', gen(){const extra=rint(6,20)*1000,profit=rint(50,150)*1000;
      const wrong=r1(extra/(profit-extra)*100),ans=r1(extra/profit*100);
      return {given:`A pay rise would add <b>£${f(extra)}</b> a year to costs. Operating profit is currently <b>£${f(profit)}</b>.`,prompt:'By what percentage would operating profit fall?',unit:'%',ans,tol:0.1,
        traps:wrong-ans>0.25?[{v:wrong,m:'Divide by the original profit, not the new one.'}]:[],
        work:`£${f(extra)} ÷ £${f(profit)} × 100 = ${r1(extra/profit*100)}%.`,use:'"Profit would fall by about '+Math.round(extra/profit*100)+'%" lets you judge how serious the cost is, instead of just saying "costs rise".'};}},
    {src:'Based on AQA June 2025 · Paper 3 report (Q3)', gen(){const rev=pick([3.6,4.2,4.8,5.4,6.0]),cust=pick([120,150,160,200,240]);const ans=Math.round(rev*1e6/cust);
      return {given:`A B2B supplier has revenue of <b>£${rev}m</b> from <b>${cust}</b> business customers.`,prompt:'Calculate the average revenue per customer, in pounds.',pre:'£',ans,tol:1,
        work:`£${f(rev*1e6)} ÷ ${cust} = £${f(ans)}.`,use:'This shows how much revenue is at risk each time one customer is lost. In B2B, losing one customer can matter a lot.'};}},
    {src:'Based on AQA June 2026 · Paper 2 report', gen(){const ind=rint(92,97),firm=ind-rint(4,12);
      return {given:`A firm delivers <b>${firm}%</b> of orders on time. The industry average is <b>${ind}%</b>.`,prompt:'How many percentage points below the industry average is the firm?',unit:'percentage points',ans:ind-firm,tol:0,
        traps:[{v:r1((ind-firm)/ind*100),m:'That is a percentage difference. The question asks for percentage points: just subtract.'}],
        work:`${ind} − ${firm} = ${ind-firm} percentage points.`,use:'Comparing with the industry tells you whether a figure is actually bad, not just lower than last year.'};}},
    {src:'Based on AQA June 2018 · Paper 1 report (Q17)', gen(){const old=pick([120,140,160,180,200,250]),pct=pick([5,10,15,20]),nw=old*(1-pct/100);
      return {given:`A business had <b>${old}</b> customers last year and has <b>${nw}</b> this year.`,prompt:'Calculate the percentage fall in customers.',unit:'%',ans:pct,tol:0.05,
        traps:[{v:r1((old-nw)/nw*100),m:'You divided by the new figure. Always divide by the original.'}],
        work:`${old} − ${nw} = ${old-nw}. ${old-nw} ÷ ${old} × 100 = ${pct}%.`,use:'"Lost '+pct+'% of its customers in a year" shows the scale of the problem far better than two raw numbers.'};}},
    {src:'Based on AQA June 2026 · Paper 2 report', gen(){const ind=pick([8,10,12]),firm=ind*pick([1.5,2,2.5]);
      return {given:`Labour turnover at the business is <b>${firm}%</b>. The industry average is <b>${ind}%</b>.`,prompt:'How many times the industry average is the business\'s labour turnover?',unit:'times',ans:firm/ind,tol:0.01,
        traps:[{v:firm-ind,m:'That is the difference in percentage points. The question asks how many times bigger.'}],
        work:`${firm} ÷ ${ind} = ${f(firm/ind)}.`,use:'"Labour turnover is '+f(firm/ind)+' times the industry average" is a strong, specific piece of evidence.'};}},
    {src:'Based on AQA June 2022 · Paper 2 report (Q1.1)', gen(){const s=rint(18,30),d=pick([1,1.5,2,2.5]),yrs=pick([2,3]);
      return {given:`Market share was <b>${s+2*d}%</b> two years ago, <b>${s+d}%</b> last year and is <b>${s}%</b> this year.`,prompt:`If the trend continues, what will market share be in ${yrs} years' time?`,unit:'%',ans:s-d*yrs,tol:0.05,
        work:`Share falls by ${d} points a year. ${s} − ${d} × ${yrs} = ${s-d*yrs}%.`,use:'Extrapolating the trend shows where the business is heading if it does nothing, which makes a strong reason to act.'};}},
{src:"Exam-style · Harlow Fitness", gen(){const fee1=pick([28,30,32,34]),fee2=fee1+pick([2,3,4]),m1=rint(20,30)*400,fall=pick([5,7.5,10]),m2=m1*(1-fall/100);const ans=m2*fee2-m1*fee1;
  return {given:`A gym chain had <b>${f(m1)}</b> members paying <b>£${fee1}</b> a month. It raised the fee to <b>£${fee2}</b> and now has <b>${f(m2)}</b> members.`,prompt:'Calculate the change in monthly revenue. Use a minus sign if it has fallen.',pre:'£',ans,tol:0.5,
    traps:[{v:m1*(fee2-fee1),m:'That assumes no members left. Work out revenue before and after, then subtract.'}],
    work:`Before: ${f(m1)} × £${fee1} = £${f(m1*fee1)}. After: ${f(m2)} × £${fee2} = £${f(m2*fee2)}. Change = ${ans<0?'−£'+f(-ans):'£'+f(ans)}.`,use:ans>=0?'The fee rise more than made up for the lost members. You can now argue about whether that will last as more people leave.':'The lost members cost more than the fee rise brought in. That is a strong piece of evidence that the price rise was a mistake.'};}},
{src:"Exam-style · profit margins", gen(){const rev=rint(20,80)/10,m1=pick([8,9,10,12,14]),m2=m1-pick([1.5,2,2.5,3]);const ans=Math.round(rev*1e6*(m1-m2)/100);
  return {given:`A business has revenue of <b>£${rev}m</b>. Its operating profit margin falls from <b>${m1}%</b> to <b>${m2}%</b>, with revenue unchanged.`,prompt:'By how much does operating profit fall, in pounds?',pre:'£',ans,tol:1,
    traps:[{v:m1-m2,m:'That is the fall in the margin in percentage points. Turn it into pounds by multiplying by revenue.'}],
    work:`(${m1}% − ${m2}%) × £${f(rev*1e6)} = ${f(m1-m2)}% × £${f(rev*1e6)} = £${f(ans)}.`,use:'"Profit falls by £'+f(ans)+' a year" is much more powerful than "the margin fell".'};}},
{src:"Exam-style · market share", gen(){const M=pick([40,50,60,80,120]),S=r1(M*rint(5,30)/100);const ans=r1(S/M*100);
  return {given:`A market is worth <b>£${M}m</b> a year. The business has sales of <b>£${f(S)}m</b>.`,prompt:'Calculate its market share.',unit:'%',ans,tol:0.1,
    traps:[{v:r1(M/S*100),m:'Divide the business\'s sales by the size of the market, not the other way round.'}],
    work:`£${f(S)}m ÷ £${M}m × 100 = ${ans}%.`,use:'Market share tells you how strong the business is compared with rivals, which revenue alone cannot.'};}},
{src:"Exam-style · investment decisions", gen(){const s=pick([1500,2000,2500,4000]),mo=rint(6,30),C=s*mo;
  return {given:`A new machine costs <b>£${f(C)}</b>. It will save <b>£${f(s)}</b> a month in wasted materials.`,prompt:'How many months will it take for the savings to pay for the machine?',unit:'months',ans:mo,tol:0,
    traps:[{v:r1(C/(s*12)),m:'That is the answer in years. The question asks for months.'}],
    work:`£${f(C)} ÷ £${f(s)} = ${mo} months.`,use:mo<=12?'Paying for itself within a year makes this a low-risk investment.':'Over a year to pay back means more can go wrong. Ask how sure the business is about the savings.'};}},
{src:"Exam-style · real wages", gen(){let w=rint(2,6),i=rint(1,8);if(i===w)i=w+2;const ans=w-i;
  return {given:`Staff get a <b>${w}%</b> pay rise. Inflation is <b>${i}%</b>.`,prompt:'Approximately what has happened to their real pay, in %? Use a minus sign for a fall.',unit:'%',ans,tol:0.3,
    traps:[{v:i-w,m:'Check the direction. Real pay = pay rise minus inflation.'}],
    work:`${w}% − ${i}% ≈ ${ans}%.`,use:ans<0?'Staff are worse off in real terms, which helps explain falling morale or rising labour turnover.':'Staff are better off in real terms, which weakens any argument that pay is the reason they are leaving.'};}}
  ]},

{ id:5, type:'mcq', title:'What kind of business is it?', blurb:'A retailer is not a manufacturer. A business customer is not a shopper.', serve:8, pass:6,
  teach:`<p>Before you write, ask what kind of business it is, who its customers are and what situation it is in. In 2025 some students "did not consider Seabus was a retailer and framed their answers around a manufacturing process". In 2026 most students treated a business that sells to garden centres as if it sold to the public.</p>
  <p>Choose the point that fits the business in the question.</p>`,
  items:[
    {src:'AQA June 2025 · Paper 2 report', prompt:'A retailer wants to improve its inventory control. Which point fits the context?',
     o:['Reduce the amount of work-in-progress waiting on the production line','Order smaller amounts more often, so less unsold stock sits in its stores','Introduce cell production so teams take responsibility for their own output','Improve maintenance of its machines to cut breakdowns'], a:1,
     why:'A retailer buys and sells finished goods. It has no production line.'},
    {src:'Based on AQA June 2026 · Paper 2 report (Q3.1)', prompt:'A manufacturer sells only to garden centres. Which argument fits a B2B context?',
     o:['Customers buy on impulse when they see the product on the shelf','Each customer places large repeat orders','Customers follow trends on social media and buy whatever their favourite influencers recommend','Customers compare prices on the shelf before choosing between brands'], a:1,
     why:'Business customers are few, buy in bulk and order again and again, so each relationship matters.'},
    {src:'AQA June 2025 · Paper 2 report (Q3.1)', prompt:'A growing low-cost airline aims to keep labour costs below 20% of revenue. Which point uses the context?',
     o:['Lower labour costs help keep its fares low','Labour costs are part of every business\'s costs, so all firms try to control them','Motivated staff work harder, which raises productivity in any business','HR objectives should always be SMART so that progress can be measured'], a:0,
     why:'The examiner said weaker answers "did not focus on the context of a growing low-cost airline".'},
    {src:'AQA June 2022 · Paper 2 report (Q2.3)', prompt:'A question asks how a change might affect the motivation of senior managers, using Maslow. Which point fits them?',
     o:['A pay rise will meet their physiological needs, which always come first','Their lower-order needs are probably met already','They need job security above everything else, like any employee','They are motivated mainly by piece rate and bonuses'], a:1,

    {src:'AQA June 2018 · Paper 2 report (Q1.5)', prompt:'A question asks whether financial data about a business would be useful to a rival that is thinking of taking it over. Which point did the best answers make?',
     o:['The data is historical, so it says nothing useful about the future','As a rival, it knows the market and can compare the figures with its own','Financial data is always useful to anyone thinking about buying a firm','Takeovers are risky, so the rival should collect as much data as possible'], a:1,
     why:'The examiner praised students who noticed the question said "rival", so the buyer would already know market conditions and have data to compare.'},
    {src:'AQA November 2020 · Paper 2 report (Q2.2)', prompt:'A question asks how a marketing manager might respond to new tariffs on the business\'s exports. Which response is part of a marketing manager\'s job?',
     o:['Move production abroad to avoid the tariffs','Change the price or target different export markets','Cut staff wages to bring costs back down','Take out a bank loan to cover the cost of the tariffs'], a:1,
     why:'The examiner noted "suggestions that were clearly not in the remit of a marketing manager".'},
    {src:'AQA June 2025 · Paper 1 report (Q21)', prompt:'A question says a UK business\'s home market has stopped growing. How should that shape your answer?',

{src:"Exam-style · public sector", prompt:"An NHS hospital trust wants to cut its costs. Which suggestion fits a public-sector hospital?",
 o:["Reduce spending on agency staff by recruiting more permanent nurses","Raise its prices to patients so that its profit margin improves","Advertise on TV to win patients from rival hospitals","Pay a larger dividend to its shareholders to keep them invested in the trust"], a:0,
 why:"An NHS trust has no shareholders and does not charge patients for treatment. Agency staff are a large cost that many trusts are trying to reduce."},
{src:"Exam-style · small businesses", prompt:"An artisan cheese maker sells at farmers' markets and charges premium prices. Which risk of growth fits its context?",
 o:["Scaling up could damage the hand-made quality it is known for","Its overseas factories could be hit by changes in exchange rates","Its share price could fall if City investors lose confidence","It may face strike action from the union representing its staff"], a:0,
 why:"Its competitive advantage is being small and hand-made. The other options assume it is a large plc."},
{src:"Exam-style · charities", prompt:"A charity shop chain receives most of its stock as donations. Which point about its costs fits?",
 o:["Its biggest costs are likely to be rent and staff, not stock","It should negotiate bulk discounts with the suppliers of its stock","It needs JIT deliveries from its suppliers","Its raw material costs will rise with inflation"], a:0,
 why:"Donated stock costs it almost nothing, so property and wages dominate its costs."},
{src:"Exam-style · subscriptions", prompt:"A software business sells one-year subscriptions to schools. Which point fits its context?",
 o:["Schools mostly renew in summer, so cash arrives unevenly","It should hold more buffer stock of its software in case demand suddenly jumps up","Its customers buy on impulse when they see it in the checkout area of a shop","Its biggest risk is the price of raw materials"], a:0,
 why:"School budgets and buying follow the school year. Software has no physical stock or raw materials."},
{src:"Exam-style · services", prompt:"A family-owned hotel has 20 rooms. Which point about its capacity fits?",

{src:"Exam-style · luxury goods", prompt:"A luxury watch maker is thinking about cutting its prices to win market share. Which point fits its context?",

 why:"For a luxury brand, a high price is part of what makes the product desirable."},
{src:"Exam-style · start-ups", prompt:"A food delivery app has 2,000 users and is not yet profitable. Which source of finance fits best?",

 why:"It has no profit to retain, probably no property to secure a loan on, and is far too small to float."},
{src:"Exam-style · perishable goods", prompt:"A farm sells strawberries to supermarkets. Which operational issue fits its context?",
 o:["Strawberries spoil within days, so it cannot build up stock to cover busy weeks","It needs to reduce work-in-progress on its assembly line","It can store its unsold stock in a warehouse for months until prices rise again","It should offer longer warranties"], a:0,
 why:"Perishable products cannot be stockpiled. Farms have no assembly line and strawberries do not come with warranties."},
{src:"Exam-style · workforce planning", prompt:"A regional bus company has many drivers close to retirement. Which HR point fits?",
 o:["It needs to recruit and train new drivers before the others retire","It should move driving work abroad, where wages are lower","It should pay drivers piece rate for each passenger carried on their bus","It should widen its span of control"], a:0,
 why:"Bus routes have to be run locally, and training new drivers takes time, so it must plan ahead."},
{src:"Exam-style · shareholders", prompt:"Most of a plc's shares are held by pension funds. Which objective is likely to matter most to them?",
 o:["Steady dividends and a rising share price over time","Employee happiness above everything else","Paying the lowest possible tax","Becoming a social enterprise"], a:0,
 why:"Pension funds need reliable long-term returns to pay pensions."},
{src:"Exam-style · exporters", prompt:"A UK manufacturer exports 70% of its output to the USA. Which external factor matters most to it?",
 o:["The value of the pound against the dollar","UK interest rates on mortgages and personal loans","The level of the UK minimum wage for under-18s","UK house prices"], a:0,
 why:"Most of its revenue is earned in dollars, so the exchange rate affects its prices and its income in pounds."}
  ]},

{ id:6, type:'drift', title:'Stick to the case', blurb:'Use what the case tells you. Don\'t invent facts.', serve:8, pass:6,
  labels:['Supported by the case','Not in the case'], showLabel:'A sentence from a student\'s answer:',
  teach:`<p>On Paper 3, questions 1 to 5 are about the business in the case. You can draw sensible conclusions from it, but you must not invent facts. On the June 2026 Paper 3, students invented shareholders who were not in the case. They also claimed the owner had hired staff because the business became a limited company, when he already had them.</p>
  <p>Read the case below, then decide whether each sentence is supported by it.</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:false,
     text:'Customers may worry that new shareholders will push for higher prices.',
     why:'Sam holds all the shares. There are no new shareholders.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:true,
     text:'Because Sam holds every share, the people customers deal with have not changed.',
     why:'This follows directly from the case.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:false,
     text:'Sam took on three joiners after becoming a limited company, which raised his costs.',
     why:'The joiners have worked for him for over eight years. This is the kind of false premise the 2026 examiner described.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:true,
     text:'With most jobs booked six months ahead, demand is already strong, so Sam has little need to cut prices to win work.',
     why:'A reasonable conclusion from a fact in the case.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:false,
     text:'The business can now raise money by selling shares on the stock exchange.',
     why:'Only a plc can do that, and nothing in the case suggests Sam wants to sell shares.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:true,
     text:'His joiners have years of experience, so the quality of the kitchens customers receive is unlikely to change.',
     why:'Supported by "more than eight years".'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:false,
     text:'Customers will now get a wider range of kitchen designs.',
     why:'Nothing in the case says the range has changed.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:PELLOW, ok:true,
     text:'Sam\'s personal assets are now protected if the company fails, which may make him more willing to take on larger contracts.',
     why:'Limited liability follows from becoming a Ltd, and the rest is a sensible inference.'},

{ id:7, type:'mcq', title:'All businesses', blurb:'When the question says "all", the case study is not enough.', serve:8, pass:6,
  teach:`<p>Some questions ask about <b>all</b> businesses. Then you need different types of business to show where the statement holds and where it does not. In 2022 many students "struggled to apply the context beyond M&S", which limited their marks. On the June 2026 Paper 3 essay, answers that only used the case study business had their marks capped.</p>
  <p>The context does not always have to be a named company. The 2023 Paper 3 report said: "application means context, not necessarily a specific example."</p>`,
  items:[
    {src:'Based on AQA June 2026 · Paper 3 report (Q6)', prompt:'"Should all UK businesses use only UK suppliers?" Which plan best answers the "all"?',
     o:['Write three detailed paragraphs about the case study business and the suppliers it uses at the moment','Contrast a bakery needing daily deliveries with an electronics maker using parts from Asia','List the advantages and disadvantages of UK suppliers for a typical business','Write about how Brexit changed trade between the UK and the EU'], a:1,
     why:'Contrasting two types of business shows when the statement holds and when it doesn\'t.'},
    {src:'AQA June 2017 · Paper 2 report', prompt:'"Is Africa an attractive market for all businesses?" Which pair gives the strongest contrast?',
     o:['A maker of low-cost phones and a luxury car brand','Two luxury fashion brands that sell through their own shops','Only the case study business, in more depth','A list of African countries and their growth rates'], a:0,
     why:'The examiner said weaker answers "failed to recognise the fact it may be good for some and not others".'},
    {src:'AQA June 2023 · Paper 3 report', prompt:'A question asks about the importance of external factors for all businesses. Which approach did the 2023 examiner say worked best?',
     o:['Naming as many real businesses as possible','Comparing a fast-moving industry, such as technology, with a slower-moving one, such as furniture','Writing only about the case','Going through PESTLE in order'], a:1,
     why:'The examiner said the "even more successful" students compared fast-moving and slower-moving industries.'},
    {src:'AQA June 2023 · Paper 3 report', prompt:'Does context on an "all businesses" question have to be a named real company?',

     why:'"Application means context, not necessarily a specific example."'},
    {src:'AQA November 2020 · Paper 2 report (Q2.4)', prompt:'"Is Taylor\'s approach a good way for all businesses to motivate employees?" Which pair gives the strongest contrast?',

    {src:'AQA June 2022 · Paper 2 report (Q2.4)', prompt:'"Are joint ventures the best way for all businesses to grow?" What limited many answers in 2022?',
     o:['Using too many examples from different industries','Only using M&S from the case study','Doing calculations that were not asked for','Writing a conclusion that made a firm judgement'], a:1,

    {src:'AQA June 2025 · Paper 2 report (Q2.4)', prompt:'"Should all businesses segment their market by income?" Which business shows where income matters less?',

    {src:'Based on AQA June 2026 · Paper 3 report (Q6)', prompt:'In an "all businesses" answer, what should the conclusion do?',

{ id:8, type:'build', title:'Build it with the data', blurb:'Put the steps in order. One card is a trap.', serve:3, pass:2,
  teach:`<p>Now put it together. Each chain uses the case and the data at every step. Five cards, four belong. The trap card is true, but it heads away from the end point.</p>
  <p>Tap cards to place them in order, and tap a placed card to send it back. You get two checks. To score, it must be right first time.</p>`,
  items:[
    {src:'Exam-style · Bloom Garden Supplies', q:BLOOM_Q, table:BLOOM_TABLE,
     start:'Bloom raises on-time deliveries from 86% towards the industry average of 95%', end:'Bloom wins back garden centre customers',
     cards:[
      {id:'A',t:'More garden centres receive their compost when they ordered it, before the spring rush',w:'Why? At 86%, about one order in seven arrived late.'},
      {id:'B',t:'They are less likely to run out of stock at their busiest time of year',w:'Why? Their shelves are refilled when demand is highest.'},
      {id:'C',t:'Bloom becomes as reliable as rival suppliers, so the main reason to switch away goes',w:'Why? It is now 9 points below the industry; closing the gap puts it level with rivals.'},
      {id:'D',t:'Some of the 14 garden centres it lost are willing to order from Bloom again',w:'Why? A business buyer chooses a supplier mainly on reliability and price.'}],
     decoy:{id:'E',t:'Labour turnover falls from 19%, so recruitment costs fall',w:'Trap: possible, but it heads towards costs, not customers.'},
     order:['A','B','C','D']},
    {src:'Exam-style · Kaya Fresh', q:'Analyse how cutting food waste could improve Kaya Fresh\'s profit.', table:KAYA_TABLE,
     start:'Kaya cuts food waste from 9% back to 6% of stock', end:'Kaya\'s profit rises',
     cards:[
      {id:'A',t:'Kaya orders fresh food more closely in line with what each store sells',w:'Why? Less unsold food goes past its date.'},
      {id:'B',t:'For every £100 of stock, £3 less is thrown away',w:'Why? Waste falls from £9 to £6 per £100.'},
      {id:'C',t:'Kaya pays for less food that never reaches a customer, while its sales stay the same',w:'Why? The cost of the goods it sells falls.'},
      {id:'D',t:'Each £1 of sales now leaves more gross profit',w:'Why? Revenue minus cost of sales gets bigger.'}],
     decoy:{id:'E',t:'Average spend has risen from £8.40 to £9.10',w:'Trap: true, but nothing to do with cutting waste.'},
     order:['A','B','C','D']},
    {src:'Based on AQA June 2026 · Paper 3 report (Q3)', q:'A furniture maker employs five joiners. Last year two of them left for a local rival that pays 15% more. Its wage bill is £62,000 and operating profit is £85,000. Analyse how a 20% pay rise might affect labour turnover.',
     start:'The business raises pay by 20%, adding £12,400 a year to costs', end:'Labour turnover falls from last year\'s 40%',
     cards:[
      {id:'A',t:'Its joiners are now paid slightly more than the rival that attracted two of them away',w:'Why? A 20% rise more than closes a 15% gap.'},
      {id:'B',t:'Pay stops being a reason for joiners to feel dissatisfied',w:'Why? Herzberg treats pay as a hygiene factor: it removes dissatisfaction.'},
      {id:'C',t:'Joiners have less reason to look for work elsewhere',w:'Why? The push that made two of them leave has gone.'},
      {id:'D',t:'Fewer of the five joiners leave over the next year',w:'Why? With pay no longer an issue, they are more likely to stay.'}],
     decoy:{id:'E',t:'The pay rise motivates the joiners to work harder',w:'Trap: Herzberg says pay does not motivate on its own, and this heads to productivity, not turnover.'},

{ id:10, type:'write', title:'Use the data', blurb:'Write a full 9-mark answer built on the case and the data.', pass:1,
  teach:`<p>This is an exam-style 9-mark question on Bloom Garden Supplies. The skill being tested is application: everything you write should only make sense for Bloom.</p>
  <p>Write one developed argument, about 6 or 7 linked steps, with no counter-argument and no separate conclusion. Use at least two different pieces of data and work something out from them. Remember that Bloom sells to garden centres, not to the public. Finish with a sentence starting "Therefore" that uses the words of the question.</p>
  <p>Write your start point and end point first. The answer box unlocks when you have.</p>`,
  items:[{src:'Exam-style · Bloom Garden Supplies', w:{
    intro:`${BLOOM_TABLE}<div class="qbox">${BLOOM_Q} <span style="color:var(--muted);font-weight:400">(9 marks)</span></div>`,
    plan:[
      {id:'S',label:'Start point',cls:'s',ph:'What are you analysing?',ok:v=>/(deliver|on.time|reliab|late)/.test(v),hint:'Check your start point: what is Bloom improving?'},
      {id:'E',label:'End point',cls:'e',ph:'Where must the chain finish?',ok:v=>/(custom|garden cent|client|buyer)/.test(v),hint:'Check your end point. Look at the last words of the question.'}],
    planOk:'Good. Keep both in front of you while you write.',
    checks:[
      {k:'start',label:'Opens from on-time delivery',test:x=>/(deliver|on.time|reliab|late)/.test(x.firstTwo)},
      {k:'data',label:'Uses two different pieces of data from the table',test:x=>{const l=x.low;
        const a=/(\b86\b|\b94\b|\b95\b|one in seven|1 in 7)/.test(l);
        const b=/(\b140\b|\b126\b|\b14 (garden|customers|fewer)|lost 14|10%|ten per ?cent)/.test(l);
        const c=/(4\.6|4\.2|36,?5\d\d|30,?000|36\.5k|£30k)/.test(l);
        const d=/(\b19%|\b19 per|labour turnover)/.test(l);return [a,b,c,d].filter(Boolean).length>=2;}},
      {k:'calc',label:'Works something out (points below the industry, % of customers lost, revenue per customer...)',test:x=>/(\b8 (percentage )?points|\b9 (percentage )?points|one in seven|1 in 7|\b14 (garden|customers|fewer)|lost 14|10%|ten per ?cent|36,?5\d\d|30,?000|36\.5k|£30k|\b14%)/.test(x.low)},
      {k:'context',label:'Uses the B2B context (garden centres, spring, running out of stock...)',test:x=>/garden cent/.test(x.low)&&/(spring|season|run out|running out|shelves|stock|repeat|switch|supplier)/.test(x.low)},
      {k:'links',label:'At least six linking words between steps',test:x=>(x.low.match(/\b(because|so|therefore|this means|which means|as a result|meaning|leads to|resulting in|consequently|since|as)\b/g)||[]).length>=6},
      {k:'end',label:'Last sentence starts "Therefore" and answers the question',test:x=>/^therefore/.test(x.last)&&/(custom|garden cent)/.test(x.last)&&/(win|back|return|regain|re-?gain|again)/.test(x.last)}],
    warn:x=>/(profit|revenue|cost)/.test(x.last)&&!/(custom|garden cent)/.test(x.last)?{msg:'Your last sentence is about profit, revenue or costs. The end point is winning back customers.',block:true}
      :/(shoppers|consumers|impulse|social media|influencer|advert)/.test(x.low)?{msg:'Bloom sells to garden centres, not to the public. Check this part is about business customers.'}
      :/\b(however|on the other hand|in conclusion|overall,)\b/.test(x.low)?{msg:'This looks like a counter-argument or conclusion. A 9-mark answer needs one developed argument.'}:null,
    minCompare:60, minAi:80, finishLabel:'Finish the course',
    model:`<span class="src">One way to write it</span><p><span class="hl-s">Improving Bloom's on-time delivery rate</span> could help it win back garden centre customers because <span class="hl-d">at 86%, roughly one order in seven now arrives late, compared with about one in seventeen in 2024</span>. Most compost is sold in spring, <span class="hl-w">so</span> a garden centre whose delivery is late at that time has empty shelves when its own customers want to buy, and loses sales it cannot get back. <span class="hl-w">This means</span> reliability matters more to a garden centre than almost anything else when it chooses a supplier, and Bloom is now <span class="hl-d">9 percentage points below the industry average of 95%</span>, which gives buyers a clear reason to go elsewhere. That is likely to explain why <span class="hl-d">Bloom has lost 14 of its 140 garden centre customers, a fall of 10%</span>. If Bloom raises its delivery rate back to the industry level, <span class="hl-w">then</span> the main reason those buyers left is removed, <span class="hl-w">so</span> some of them are likely to try Bloom again for the next season's orders. <span class="hl-w">Because</span> each customer now spends on average <span class="hl-d">about £36,500 a year (£4.6m ÷ 126)</span>, even winning back a few of them would be worth a lot. <span class="hl-w">Therefore</span> improving its on-time delivery rate could help Bloom win back garden centre customers, because it fixes the reliability problem that is most likely to have driven them away.</p>
      <div class="key"><span><span class="hl-s">teal</span> start point</span><span><span class="hl-e">coral</span> end point</span><span><span class="hl-w">purple</span> links</span><span><span class="hl-d">underlined</span> data, worked out</span></div>
      <p style="margin-top:14px;font-size:.9rem;color:var(--muted)">Notice that nearly every sentence would make no sense for a different business. That is what application means.</p>`,
    ai:`You are an experienced AQA A-level Business teacher giving feedback on a student's 9-mark answer to: "Analyse how improving its on-time delivery rate could help Bloom Garden Supplies win back garden centre customers."
Case: Bloom makes compost and plant feed and sells them to garden centres (B2B), not to the public; most sales are in spring. Data 2024 → 2025: revenue £4.2m → £4.6m; on-time deliveries 94% → 86% (industry average 95%); garden centre customers 140 → 126; labour turnover 11% → 19% (industry 10%); operating profit margin 8.0% → 6.5% (industry 9.0%).
Rules for this question: one fully developed argument is the right approach, so never tell the student to add a counter-argument or conclusion. This course is about APPLICATION, so focus on: whether every step is specific to Bloom and its garden centre customers rather than generic; whether they treat the customers as businesses (not consumers); whether they use at least two pieces of data and work something out from them (for example 9 points below the industry, 14 customers or 10% lost, about £36,500 revenue per customer, one order in seven late) rather than just quoting figures; whether they read the data correctly (revenue rose, it did not fall); whether every step heads to WINNING BACK GARDEN CENTRE CUSTOMERS; and whether the final "Therefore" sentence uses the question's words.
Do not give a mark or level. Write in plain British English, as a teacher speaking to a Year 13 student. No headings, no bullet symbols other than simple dashes, no emoji. Give: one sentence on what works; then two or three improvements, each quoting a short phrase they wrote ("You wrote: ...") and showing a better version ("You could write: ..."). Keep it under 220 words.`,
    doneTitle:'Course complete',
    doneText:'You have written an answer where the business and the data do the work. In every answer, cover the business\'s name and ask whether the sentence would still work for any company. If it would, add the case and the numbers.'
  }}]}
];
