  <p>Examiners keep reporting the same problem: students write a good chain that ends somewhere the question did not ask about. That starts with misreading the question.</p>
  <p>For each question, tap the start point, then the end point. One wrong tap and the question counts as missed, so read it properly first.</p>`,

{ id:2, type:'drift', title:'Spot the drift', blurb:'Did the chain finish where the question asked?', serve:10, pass:8,
  teach:`<p>A chain can be well explained and still score badly if it finishes in the wrong place. The examiner calls this drifting.</p>
  <p>You will see a question and the last part of a student's chain. Decide whether it reached the end point or drifted somewhere else.</p>
  <p>Watch for the traps examiners have reported: profit instead of profit <i>margin</i>, cash flow instead of profit, employees instead of the HR function, share price instead of dividends.</p>`,

{ id:3, type:'build', title:'Build the chain', blurb:'Order the links. One card is a trap.', serve:3, pass:2,
  teach:`<p>Now you build the chain yourself. Each question has five cards but only four belong. One is a trap card: it sounds sensible but takes the chain away from the end point.</p>

    {src:'AQA June 2019 · Paper 1 · Q19', q:'To fund a new project, a business increases the proportion of its long-term funding that is debt. Analyse how this change might affect the level of dividends received by shareholders.',

     cards:[

      {id:'B',t:'Interest is paid before profit is available to shareholders, so profit after interest falls',w:'Why? Dividends come from what is left after finance costs and tax.'},
      {id:'C',t:'Cash also has to be kept back to meet loan repayments',w:'Why? The lender expects repayments on a fixed schedule.'},
      {id:'D',t:'Directors have less profit and less spare cash to pay out',w:'Why? Paying a dividend needs both profit to pay it from and the cash to pay it with.'}],
     decoy:{id:'E',t:'Investors see the business as riskier, so the share price falls',w:'Trap: share price is not dividends. This drift was named in the examiner report.'},
     order:['A','B','C','D']},
    {src:'AQA June 2022 · Paper 1 · Q20', q:'Analyse how widening a manager\'s span of control might affect labour productivity within the department she manages.',

{ id:4, type:'weak', title:'Find the weak link', blurb:'One step is wrong or just asserted. Find it and fix it.', serve:5, pass:4,
  teach:`<p>A chain is only as strong as its weakest step. Examiners give no credit for a step that is just asserted ("it improves the financial position") or that gets the theory wrong.</p>
  <p>For each chain, tap the weak step. Then choose the best replacement. You need both right first time to score.</p>
  <p>The mistakes here are ones examiners have reported in real papers.</p>`,
  items:[
    {src:'Exam-style · Herzberg', q:'Analyse how introducing a profit-sharing scheme might affect labour turnover.',
     s:['A profit-sharing scheme gives staff a bonus linked to the firm\'s profit.','According to Herzberg, pay is a motivator, so staff will be motivated by the bonus.','Staff who are satisfied with their pay are less likely to leave for a better-paid job elsewhere.','Therefore labour turnover is likely to fall.'],
     bad:1, problem:'Herzberg classes pay as a hygiene factor, not a motivator. Misusing Herzberg like this cost marks on the June 2026 Paper 3.',
     fixes:['Herzberg treats pay as a hygiene factor, so a bonus may remove a reason for dissatisfaction and stop staff leaving over pay, even if it does not motivate them on its own.','According to Maslow, pay is at the top of the hierarchy, so staff will be fully motivated.','Pay always motivates everyone equally, so staff will work harder and the business will make more profit.'], fix:0},
    {src:'Exam-style · based on June 2025 Paper 1 Q19', q:'Analyse how a government changing its fiscal policy might affect a business which produces healthcare products.',
     s:['The government increases its spending on the NHS.','This is monetary policy, so interest rates fall.','The NHS places larger orders with its suppliers.','Therefore sales revenue for the healthcare products business is likely to rise.'],
     bad:1, problem:'Government spending is fiscal policy, not monetary policy. The examiner said this confusion was common.',
     fixes:['Because interest rates fall, people borrow more money to buy healthcare products for their homes, so demand rises.','With a bigger budget, the NHS can buy more equipment and medicines, so demand from the public sector rises.','This means the business pays more corporation tax.'], fix:1},
    {src:'Exam-style · based on June 2026 Paper 1 Q19', q:'Analyse how debt factoring might affect the profit of a business.',
     s:['The business sells its unpaid invoices to a factoring company.','The factor keeps a fee, so the business receives less than the full value of each invoice.','This means the business has more cash, so its profit goes up.','Therefore debt factoring is likely to reduce the profit the business makes on its sales, even though cash arrives sooner.'],
     bad:2, problem:'Cash is not profit. Getting cash sooner improves cash flow; the fee is a cost that reduces profit.',
     fixes:['Customers pay the factor instead of the business, so the business\'s revenue doubles and its profit rises sharply as a result.','The business can use the cash to pay off its overdraft, so it has no costs at all.','The fee is an extra cost, so the business makes less on each sale than if it had waited for customers to pay.'], fix:2},
    {src:'Exam-style · based on June 2017 Paper 1 Q19', q:'Analyse how break-even analysis might help a start-up business.',
     s:['Break-even analysis shows the level of output where total revenue equals total costs.','It could help the business understand its financial position.','This means the owner can make better decisions before committing money.','Therefore break-even analysis can reduce the risk of the start-up failing.'],
     bad:1, problem:'This is an assertion. The examiner quoted almost exactly this sentence as an example of what does not show how break-even helps.',
     fixes:['The owner can see how many units must be sold each month to cover costs, and check whether that is realistic.','Break-even is the time it takes to start making a profit.','Break-even analysis guarantees the business will make a profit.'], fix:0},
    {src:'AQA June 2026 · Paper 1 · Q18', q:'Analyse how an understanding of Maslow\'s theory of motivation might help a business to lower its labour turnover.',
     s:['Many warehouse staff are on zero-hours contracts and leave within a few months.','Maslow\'s levels are physiological, safety, social, esteem and self-actualisation.','Offering permanent contracts would give staff a secure income.','Therefore fewer staff would leave, reducing labour turnover.'],
     bad:1, problem:'Listing the five levels shows knowledge but does nothing for the chain. The 2026 examiner said "many answers simply described aspects of Maslow\'s theory without demonstrating its usefulness", and that recognising its hierarchical nature was the discriminator.',
     fixes:['Self-actualisation is the most important need, so the manager should give every warehouse worker more challenging and creative work to do straight away.','Maslow says money is the only thing that motivates workers.','Maslow\'s hierarchy suggests safety needs must be met before higher needs matter, so job security is the need the manager should target first.'], fix:2},
    {src:'Exam-style · based on June 2023 Paper 3', q:'Analyse how growing organically might affect the risk faced by a small manufacturer.',
     s:['Organic growth means growing in an environmentally friendly, sustainable way.','The business expands at a pace it can fund from its own retained profit.','It does not need large loans or to buy a business it does not understand.','Therefore organic growth keeps its level of risk lower than growth by takeover.'],
     bad:0, problem:'In 2023 a notable minority thought organic growth meant environmentally friendly growth. It means growing from within.',
     fixes:['Organic growth means growing from within.','Organic growth means growing quickly by buying up competitors, which brings in new customers and expertise straight away.','Organic growth means using organic and natural materials.'], fix:0},
{src:'Exam-style · operations', q:'Analyse how introducing just-in-time production might affect the cash flow of a manufacturer.',
 s:['The manufacturer switches to just-in-time, so components arrive only when needed.','It now holds two days of stock instead of three weeks.','This means its profit rises, so its cash flow improves.','So less cash is tied up in stock, leaving more to pay bills each month.'],
 bad:2, problem:'Profit and cash flow are different. The chain should explain the cash effect directly.',
 fixes:['This means less money has been spent on stock that is sitting unused.','This means its profit rises sharply, because profit and cash flow always move together in the same direction.','This means its suppliers will give it a large discount for ordering more often.'], fix:0},
{src:'Exam-style · exchange rates', q:'Analyse how a fall in the value of the pound might affect the costs of a UK furniture retailer that imports its stock.',
 s:['The retailer buys most of its furniture from Italian suppliers, priced in euros.','The pound falls against the euro.','A weaker pound makes exports cheaper, so the retailer\'s costs fall.','So the same furniture costs more in pounds, and the retailer\'s cost of sales rises.'],
 bad:2, problem:'The retailer imports, so a weaker pound raises its costs. Exports have nothing to do with it.',
 fixes:['Each pound now buys fewer euros, so it takes more pounds to pay each invoice.','A weaker pound makes UK exports cheaper, so foreign customers will buy more furniture from the retailer.','A weaker pound has no effect, because the retailer sells all of its furniture in the UK.'], fix:0},
{src:'Exam-style · productivity', q:'Analyse how an increase in labour productivity might affect the unit costs of a manufacturer.',
 s:['Training raises output per worker from 40 to 50 units a day.','The wage bill stays the same.','So total costs fall by 20%.','So labour cost per unit falls, from £2.50 to £2.00 if each worker earns £100 a day.'],
 bad:2, problem:'Total costs do not fall. The same costs are spread over more units, so it is the cost per unit that falls.',
 fixes:['So the same wage bill is now spread over 25% more units.','So the manufacturer can now cut its workforce by half and still produce exactly the same output.','So the price of each unit must rise, because workers are now producing more.'], fix:0},
{src:'Exam-style · business forms', q:'Analyse how becoming a public limited company might affect the founder\'s control of the business.',
 s:['The business floats on the stock exchange and sells new shares to outside investors.','The founder now owns 40% of the shares instead of 100%.','Because she still owns more shares than any other single person, she keeps full control.','Outside shareholders could vote together against her on major decisions.'],
 bad:2, problem:'With 40% she no longer has a majority. The other shareholders together hold 60% and can outvote her.',
 fixes:['With only 40% of the votes, she can be outvoted if other shareholders act together.','Because she founded the business, the law says she keeps full control whatever share of the business she owns.','Because she owns 40%, she can make any decision she likes without asking the other shareholders.'], fix:0},
{src:'Exam-style · interest rates', q:'Analyse how a rise in interest rates might affect demand for a house builder\'s new homes.',
 s:['The Bank of England raises the base rate.','Mortgage rates rise, so monthly repayments go up for new buyers.','Fewer households can afford the repayments on a new home.','So the house builder\'s costs rise, because it must pay more interest on its own loans.'],
 bad:3, problem:'The question asks about demand, but this final step drifts to the builder\'s own costs.',
 fixes:['So fewer people buy new homes, and demand for the builder\'s homes falls.','So the house builder\'s profit falls, because it has to pay more interest on its loans.','So house prices across the country rise, because fewer homes are being built.'], fix:0},
{src:'Exam-style · CSR', q:'Analyse how improving its environmental performance might affect the brand image of a clothing retailer.',
 s:['The retailer switches to recycled materials and publishes its carbon emissions each year.','Many of its young customers say they care about the environment.','Elkington\'s triple bottom line says profit is the only measure that matters.','So the retailer is seen as more responsible than its rivals, improving its brand image.'],
 bad:2, problem:'The triple bottom line measures people and planet as well as profit. Used correctly, it supports the chain.',
 fixes:['Under Elkington\'s triple bottom line, it is now performing better on the planet, not just on profit.','Elkington says environmental performance never affects a brand.','Carroll\'s pyramid says environmental action is a legal responsibility for every business.'], fix:0}
  ]},

{ id:5, type:'mcq', title:'Explain the link, use the data', blurb:'Pick the "because" and the data use that earns the marks.', serve:8, pass:6,
  teach:`<p>Two things separate a good chain from an average one: a real reason between each step, and data that has been worked out rather than copied.</p>
  <p>Examiners have said it again and again: calculate, don't quote. And watch percentage changes against percentage points, and margin against absolute profit.</p>
  <p>Use a calculator if you need one.</p>`,
  items:[
    {src:'AQA June 2025 · Paper 1 · Q18', table:NEWTOWN_TABLE, prompt:'Which sentence uses the span of control data best?',
     o:['The average span of control went from 5 to 15 between the two periods shown in the table.','The span of control tripled, so each manager cannot check every decision.','The average span of control rose by 10%, from 5 to 15.','The average span of control rose by 300%, from 5 to 15.'], a:1,
     why:'Quoting 5 and 15 adds nothing. 5 to 15 is a 200% increase, not 10% or 300%. The best answer works out what the change means and uses it in the chain.'},
    {src:'AQA June 2018 · Paper 1 · Q18', table:BBB_TABLE, prompt:'BBB\'s labour turnover fell from 15% to 8%. Which statement is correct?',
     o:['It fell by 7%, from 15% to 8% of the workforce.','It fell by 7 percentage points, a fall of about 47%.','It fell by 53%, because 8 is 53% of 15.','It fell by 7 percentage points, a fall of about 88%.'], a:1,
     why:'When the figures are already percentages, the difference is in percentage points. 7 ÷ 15 = 0.467, so about a 47% fall.'},
    {src:'AQA June 2018 · Paper 1 · Q18', table:BBB_TABLE, prompt:'Which sentence makes the best use of the 2008–2017 figures?',
     o:['BBB\'s labour turnover is 15% better than its competitors\'.','Rivals lose staff at nearly three times BBB\'s rate, so BBB keeps more experienced workers.','23 of the competitors\' workers left compared with only 8 at BBB.','BBB\'s turnover is 8% while competitors\' is 23%, which is a difference of 15 between them.'], a:1,
     why:'23 ÷ 8 ≈ 2.9, so rivals lose staff nearly three times as fast. "15% better" is vague (it is a 15 percentage point gap), and the figures are percentages, not numbers of workers.'},
    {src:'Exam-style · based on June 2026 Paper 2 Q1.1', prompt:'Sales are now £330,000 after a 10% increase. What were sales before the increase?',
     o:['£297,000','£300,000','£363,000','£303,000'], a:1,
     why:'£330,000 is 110% of the original, so divide by 1.1. The June 2026 examiner reported students "deducting the percentage change rather than reversing it correctly".'},
    {src:'AQA June 2019 · Paper 1 · Q19', prompt:'Link: "The business takes on more debt" → "Dividends fall". Which "because" turns this into analysis?',
     o:['because taking on debt is bad for shareholders in general.','because the business looks riskier, so its share price will fall.','because interest is paid before profit reaches shareholders, leaving less for dividends.','because the bank will set the dividend.'], a:2,
     why:'Saying debt is "bad" is an assertion, and share price is not dividends. The correct link gives the mechanism: interest comes first, so less profit is left to pay out.'},
    {src:'AQA June 2025 · Paper 1 · Q18', prompt:'Link: "Two levels of hierarchy are removed" → "Faster response to customer enquiries". Which reason is strongest?',
     o:['because flat structures are always better than tall ones.','because communication is quicker in a flatter structure.','because an enquiry now passes through 4 levels instead of 6, so it is held up less.','because removing managers saves salaries.'], a:2,
     why:'"Communication is quicker" is true but could be about any business. The best reason explains why, using Newtown\'s data. The salary saving drifts to costs.'},
    {src:'Exam-style · Herzberg', prompt:'Link: "Workers are given more responsibility" → "Motivation rises". Which reason is accurate?',
     o:['Herzberg says responsibility is a motivator, so more control over their work can raise effort.','Herzberg says responsibility is a hygiene factor, so it stops staff being dissatisfied.','Taylor says workers want responsibility and the freedom to organise their own work, so they work harder.','Maslow says responsibility is a physiological need that must be met first.'], a:0,
     why:'Responsibility is one of Herzberg\'s motivators. Taylor argued the opposite: close supervision and pay per unit.'},
    {src:'Exam-style · based on June 2026 Paper 2 Q1.4', prompt:'Revenue rises from £20m to £25m and operating profit rises from £2m to £2.25m. What happened to the operating profit margin?',
     o:['It rose, because operating profit rose by £0.25m.','It fell, from 10% to 9%.','It stayed the same, at 10%.','It rose, from 10% to 11.25%.'], a:1,
     why:'2 ÷ 20 = 10%; 2.25 ÷ 25 = 9%. Profit went up but the margin went down. Mixing these up cost marks in June 2026.'},
    {src:'AQA June 2025 · Paper 1 · Q18', prompt:'Which final sentence finishes a Newtown answer best?',
     o:['Therefore the restructuring is good for Newtown and its customers.','Therefore Newtown\'s profit is likely to increase as its costs fall.','Therefore it is likely to speed up Newtown\'s response, as fewer enquiries wait for approval.','Therefore Newtown should remove more levels.'], a:2,
     why:'"Good for Newtown" is vague and profit is a drift. The best ending uses the question\'s own words and sums up why. Recommending more delayering is a new point the chain has not argued.'},
{src:'Exam-style · operations', prompt:'Link: "The business introduces just-in-time" → "Cash flow improves". Which "because" is strongest?',
 o:['because less cash is tied up in stock','because JIT is a modern way of working','because profit rises when storage costs fall','because suppliers will deliver more often, which means more invoices to pay each month'], a:0,
 why:'It gives the mechanism. The profit option drifts, and "modern" is an assertion.'},
{src:'Exam-style · exchange rates', prompt:'Link: "The pound falls" → "An importer\'s costs rise". Which "because" is strongest?',
 o:['because each pound buys less foreign currency, so imports cost more in pounds','because exports become cheaper','because inflation rises','because the business sells less'], a:0,
 why:'This explains the link directly. Exports are irrelevant to an importer\'s costs.'},
{src:'Exam-style · productivity', prompt:'Output per worker rises from 40 to 50 units a day. Which sentence uses the data best?',
 o:['Productivity rose by 25%','Productivity rose by 10 units, so every worker is now ten times as productive as before','Productivity rose by 20%, from 40 to 50 units for each worker every day','Productivity is now 50'], a:0,
 why:'10 ÷ 40 = 25%. Dividing by the new figure gives the wrong 20%.'},
{src:'Exam-style · using data', prompt:'A care home\'s wage bill rises by £50,000. Its revenue is £2m and its operating profit is £150,000. Which sentence uses the data best?',
 o:['The extra cost would cut operating profit by a third, from £150,000 to £100,000','The wage bill rises by £50,000','Costs rise, so profit falls','The extra cost is 2.5% of revenue, so it hardly matters'], a:0,
 why:'Comparing the cost with profit shows how serious it is. Against revenue it looks small, which is misleading.'},
{src:'Exam-style · business forms', prompt:'Link: "The founder sells 60% of the shares" → "She loses control". Which "because" is strongest?',
 o:['because others now hold most votes','because she will have less money','because a plc always has to be run by a board of directors appointed by the government','because shares can be bought and sold'], a:0,
 why:'Control goes with votes. Selling a majority hands that power to others.'},
{src:'Exam-style · market research', prompt:'A test launch sold 1,200 units in a region that has 1% of UK households. Which sentence uses the data best?',
 o:['If the region is typical, a national launch could sell around 120,000 units','1,200 units were sold in the test','The test went well','Market research is useful for reducing risk, because it gives the business information before it launches'], a:0,
 why:'1,200 ÷ 1% = 120,000. Scaling up the test result turns the data into a forecast.'},
{src:'Exam-style · interest rates', prompt:'Link: "Interest rates rise" → "Demand for new homes falls". Which "because" is strongest?',
 o:['because higher mortgage repayments mean fewer households can afford to buy','because the builder pays more interest','because house prices always rise','because people save more'], a:0,
 why:'The builder\'s own interest costs are true but are about costs, not demand.'},
{src:'Exam-style · final sentences', prompt:'Which final sentence best finishes "Analyse how JIT might affect the cash flow of a manufacturer"?',
 o:['Therefore JIT is likely to improve the manufacturer\'s cash flow, because less cash is tied up in stock','Therefore JIT is likely to increase the manufacturer\'s profit','Therefore JIT is a good idea','Therefore the manufacturer should also introduce kaizen and cell production to cut its costs even further'], a:0,
 why:'It uses the question\'s words and sums up why. The others drift, are vague, or add a new point.'},
{src:'Exam-style · Herzberg', prompt:'Which sentence uses Herzberg accurately?',
 o:['Recognition is a motivator','A pay rise is a motivator, so staff who receive it will always work harder than before','Better working conditions are a motivator','Job security is a motivator for all staff'], a:0,
 why:'Recognition is a motivator. Pay, conditions and security are hygiene factors.'},
{src:'Exam-style · percentages', prompt:'Market share rises from 12% to 15%. Which statement is correct?',
 o:['It rose by 3 percentage points, a 25% increase','It rose by 3%','It rose by 25 percentage points','It rose by 3 percentage points, a 20% increase'], a:0,
 why:'15 − 12 = 3 percentage points. 3 ÷ 12 = 25%.'},
{src:'Exam-style · organisational structure', prompt:'Which "because" explains the link "A business delayers" → "Labour costs fall"?',
 o:['because fewer managers are employed, so the salary bill is smaller','because staff are more motivated','because communication is faster','because spans of control are narrower'], a:0,
 why:'Delayering removes managers, which cuts salaries. It widens spans of control, not narrows them.'}
  ]},

{ id:6, type:'mcq', title:'Read every word', blurb:'The small words in the question change the end point.', serve:8, pass:6,
  teach:`<p>The end point is not always a single word. Phrases like "<i>than its competitors</i>", "<i>within the department she manages</i>", "<i>all employees</i>" or "<i>guaranteed</i>" are part of what you must reach.</p>
  <p>Examiners regularly report answers that reached roughly the right place but missed part of the question. Each one here is based on a real question and what the examiner said about it.</p>`,
  items:[
    {src:'AQA June 2018 · Paper 1 · Q18', table:BBB_TABLE, prompt:'"...the ability of BBB plc to provide higher-quality products than its competitors." Which final sentence answers the whole question?',
     o:['Therefore BBB\'s product quality is likely to have improved steadily over the whole period.','Therefore BBB could offer higher quality than rivals, keeping staff at 8% turnover against 23%.','Therefore BBB\'s staff are likely to be more motivated than its competitors\' staff.','Therefore BBB\'s competitors are likely to have made bigger profits than BBB over the period.'], a:1,
     why:'Only one ending compares BBB with its rivals, which "than its competitors" requires, and backs it with the data. The others miss the comparison or drift to motivation or profit.'},
    {src:'AQA June 2022 · Paper 1 · Q20', prompt:'"...labour productivity within the department she manages." Which ending fits?',
     o:['...so labour productivity across the whole business improves.','...so the workers in her department produce more output per hour.','...so the business needs fewer managers and saves money on salaries.','...so the manager herself works longer hours and gets more done each week.'], a:1,
     why:'The question limits you to her department. The whole business is too wide, and the cost saving is a drift.'},
    {src:'AQA June 2024 · Paper 1 · Q22', prompt:'Essay: "A business changes its human resource management (HRM) approach from hard HRM to soft HRM. To what extent is this change guaranteed to increase the motivation of all employees?" Which sentence stays on the question?',
     o:['This should increase sales volume, because motivated staff serve customers better.','This is likely to motivate the sales team, who are paid commission on everything that they sell each month.','Soft HRM may motivate staff who value involvement, but not all: some care most about pay.','Soft HRM is guaranteed to motivate everyone, because all staff like being consulted.'], a:2,
     why:'The examiner said many answers drifted to sales volume or profit. "All employees" and "guaranteed" are both part of the question, and only the correct option deals with them.'},
    {src:'AQA June 2019 · Paper 1 · Q24 (examiner report)', prompt:'An essay asked about the effect of mass customisation on operational performance. Which of these is an operational performance measure?',
     o:['Brand loyalty','Profit','Unit costs','Market share'], a:2,
     why:'The examiner listed unit costs, speed of response, wastage and quality as operational measures, and said answers on profit and brand loyalty did not address the question.'},
    {src:'AQA June 2019 · Paper 1 · Q18', prompt:'"Using Figure 4, analyse why choosing Option A might not be the best decision." Option A has the highest net gain. Which opening fits the question?',
     o:['Option A has the highest net gain, so it is the best choice for the business.','Let me first recalculate the net gain for each option to check the figures.','Although A has the highest net gain, its high chance of failure means a real risk of a loss.','Option A is the best decision, because a decision tree always gives managers the right answer to any problem.'], a:2,
     why:'The question asks why A might not be best. The examiner noted students lost time recalculating net gain that was already given.'},
    {src:'AQA June 2025 · Paper 1 · Q19', prompt:'"...might affect a business which produces healthcare products." Which link uses the context best?',
     o:['A rise in VAT increases prices, so demand for all of the business\'s products will fall sharply.','Healthcare products are often necessities, so a VAT rise could be passed on to buyers.','Higher interest rates make borrowing more expensive for the business.','A rise in VAT means the business pays more corporation tax on its profits.'], a:1,
     why:'The examiner said the better answers showed insight into the market, using price and income elasticity. The interest rate option is monetary policy, not fiscal.'},
    {src:'AQA June 2017 · Paper 2 · Q3.2', prompt:'"...analyse the actions Kento should take regarding its product portfolio in Europe to improve its long term financial performance." Which final step completes the chain?',
     o:['...so Kento should stop selling the dog in Europe.','...so cash cows fund problem children that can replace older products, protecting long-term profit.','...so Kento will have a balanced portfolio of products in each stage of the life cycle.','...so Kento should invest equally in every product.'], a:1,
     why:'The examiner said some answers lacked the final link to financial performance. Only one ending gets there.'},
    {src:'AQA June 2017 · Paper 2 · Q2.2', prompt:'"...the profits of car manufacturers." Which ending is aimed at the right business?',
     o:['...so car dealerships sell fewer cars and their profit falls.','...so households have less disposable income to spend.','...so manufacturers get fewer orders, and high fixed costs make profit fall faster.','...so car manufacturers raise their prices to cover the higher interest costs on their loans.'], a:2,
     why:'Dealers are not manufacturers, and disposable income is a step, not the end. The best ending reaches manufacturers\' profit and explains why the effect is bigger.'},
{src:'Exam-style · operations', prompt:'"Analyse how JIT might affect the cash flow of a manufacturer." Which ending reaches the end point?',
 o:['...so less cash is tied up in stock','...so storage costs fall and the manufacturer\'s profit rises over the year','...so the factory runs more efficiently','...so suppliers have to deliver more often'], a:0,
 why:'Cash flow is the end point. Profit is a different measure.'},
{src:'Exam-style · exchange rates', prompt:'"Analyse how a fall in the pound might affect the costs of a UK furniture importer." Which ending fits?',
 o:['...so each invoice from its Italian suppliers costs more in pounds','...so its sales fall because it has to raise its prices in its UK stores','...so its exports become cheaper','...so its profit falls'], a:0,
 why:'Costs are the end point. Sales and profit are drifts.'},
{src:'Exam-style · margins', prompt:'"Analyse how a rise in the minimum wage might affect the operating profit margin of a café." Which ending fits?',
 o:['...so wages take up more of each pound of revenue, and the margin falls','...so operating profit falls by £12,000 a year, from £60,000 to £48,000','...so staff are more motivated','...so the café raises its prices and loses some of its regular customers'], a:0,
 why:'The margin is about costs relative to revenue. A fall in profit in pounds is not the margin.'},
{src:'Exam-style · business forms', prompt:'"Analyse how becoming a plc might affect the founder\'s control." Which ending fits?',
 o:['...so she can be outvoted','...so the business can raise much more finance to open new stores across the UK','...so the business grows faster','...so its share price rises'], a:0,
 why:'Control is the end point.'},
{src:'Exam-style · market research', prompt:'"Analyse how market research might reduce the risk of launching a new product." Which ending fits?',
 o:['...so it avoids a costly failed launch','...so sales of the new product will be much higher than they would otherwise have been','...so the business knows its customers','...so the product is launched faster'], a:0,
 why:'Risk is the end point. Higher sales is a different outcome.'},
{src:'Exam-style · interest rates', prompt:'"Analyse how a rise in interest rates might affect demand for a house builder\'s homes." Which ending fits?',
 o:['...so demand falls','...so the builder\'s interest costs rise on the loans it uses to buy land','...so the builder\'s profit falls','...so house prices rise'], a:0,
 why:'Demand is the end point. The builder\'s costs and profit are drifts.'},
{src:'Exam-style · CSR', prompt:'"Analyse how improving its environmental performance might affect a retailer\'s brand image." Which ending fits?',
 o:['...so customers see it as more responsible, improving its image','...so its costs rise','...so its sales rise as more customers choose it over its rivals','...so staff are more motivated and proud to work for the business'], a:0,
 why:'Brand image is how customers see the business. Sales are a step beyond that.'},
{src:'Exam-style · organisational structure', prompt:'"Analyse how delayering might affect the motivation of the managers who remain." Which ending fits?',
 o:['...so the remaining managers have more responsibility, which Herzberg sees as a motivator','...so the business saves money','...so decisions are made faster','...so the business becomes more profitable'], a:0,
 why:'The end point is the motivation of the remaining managers.'},
{src:'Exam-style · productivity', prompt:'"Analyse how an increase in labour productivity might affect unit costs." Which ending fits?',
 o:['...so the same labour costs are spread over more units','...so the business can sell more units to its customers at the same price as before','...so revenue rises','...so staff are happier'], a:0,
 why:'Unit costs are the end point.'},
{src:'Exam-style · competition', prompt:'"Analyse how a new competitor might affect the market share of a supermarket." Which ending fits?',
 o:['...so some customers switch to the new store and the supermarket\'s share falls','...so the supermarket\'s profit falls','...so the supermarket cuts its prices','...so the supermarket\'s revenue falls'], a:0,
 why:'Market share is the end point. Profit and revenue are different measures.'}
  ]},
/* ---------------- STAGE 7 ---------------- */
{ id:7, type:'mcq', title:'Use the theory properly', blurb:'Models earn marks only when they are used accurately inside the chain.', serve:8, pass:6,
  teach:`<p>A model or theory works best as one of the links in your chain, not as a paragraph on its own. But it has to be right. A misused theory is a broken link.</p>
  <p>The examiner credited Porter's Five Forces in integration answers in June 2026. The same year, misusing Herzberg, mixing up PRP with piece rate, and confusing economies of scope with economies of scale all cost students marks.</p>`,
  items:[
    {src:'Exam-style · based on June 2026 Paper 1 Q22', prompt:'A supermarket chain takes over a rival. Which link uses Porter\'s Five Forces accurately?',
     o:['Suppliers lose bargaining power.','With fewer firms in the market, the threat of substitutes rises.','Porter\'s Five Forces shows that integration always increases profit for every business that does it.','Buyer power rises, because shoppers now have more choice of supermarket.'], a:0,
     why:'Horizontal integration reduces rivalry and strengthens the firm against suppliers. Substitutes are other products, not rival firms, and "always" is never safe.'},
    {src:'Exam-style · based on June 2026 Paper 1 Q11', prompt:'Value own-brand bread has an income elasticity of demand of −0.4. Average incomes rise by 5%. Which link is correct?',
     o:['Demand rises by about 2%, because people have more money to spend on bread.','Demand falls by about 2%, as some customers switch to premium brands.','Demand falls by 0.4%, because the YED is negative.','Demand does not change, because bread is a necessity.'], a:1,
     why:'−0.4 × 5% = −2%. Negative YED means an inferior good. This was the hardest multiple-choice question in June 2026.'},
    {src:'Exam-style · price elasticity', prompt:'A firm raises its price by 10%. Its PED is −0.3. Which link is correct?',
     o:['Quantity demanded falls by about 3%, so revenue rises.','Revenue falls, because people buy less when the price rises.','Quantity demanded falls by 30%, so revenue falls sharply.','Quantity demanded does not change, because demand is inelastic.'], a:0,
     why:'−0.3 × 10% = −3%. With inelastic demand, a price rise increases revenue.'},
    {src:'Exam-style · Ansoff\'s matrix', prompt:'A UK bakery chain plans to sell kitchen appliances in the USA. Which link uses Ansoff accurately?',
     o:['This is market development, which is low risk because the products are known.','This is diversification, the highest-risk option, as both product and market are new.','This is product development, the riskiest option on the matrix.','This is market penetration, because the bakery chain is already a strong and well-known brand in the UK.'], a:1,
     why:'New product and new market is diversification. The risk comes from knowing neither.'},
    {src:'Exam-style · Taylor', prompt:'A factory moves its staff onto piece rate. Which link uses Taylor accurately?',
     o:['Taylor believed workers want responsibility and freedom, so piece rate will motivate them.','Taylor saw pay as a hygiene factor that only stops dissatisfaction.','Taylor believed workers are motivated by money, so paying per unit raises output per hour.','Taylor believed staff work best when they set their own targets in teams.'], a:2,
     why:'Hygiene factors are Herzberg, not Taylor. Responsibility as a motivator is also Herzberg.'},
    {src:'Exam-style · based on June 2026 Paper 2 Q3.3', prompt:'Which of these describes performance-related pay (PRP)?',
     o:['A payment for each unit a worker produces.','A bonus or pay rise linked to meeting agreed targets, usually set at an appraisal.','A share of the whole company\'s profit, paid out to all members of staff once a year.','A fixed annual salary that does not change with performance.'], a:1,
     why:'Pay per unit is piece rate, and a share of company profit is profit sharing. In June 2026 many students confused PRP with piece rate.'},
    {src:'Exam-style · based on June 2026 Paper 2 Q1.4', prompt:'A brewer starts making soft drinks using the same bottling line and delivery lorries. Which link is correct?',
     o:['Economies of scale: it produces more of the same product, so unit costs fall.','Economies of scope: shared resources cover more products, so average costs fall.','Diseconomies of scale: the business becomes much harder to manage and co-ordinate as it grows.','Economies of scale: it can now buy more barley in bulk at a discount.'], a:1,
     why:'Scope comes from a wider range of products. Scale comes from more of the same. This mix-up cost marks in June 2026.'},
    {src:'Exam-style · stakeholder mapping', prompt:'A business is closing a factory. The local council has high power and high interest. Which link uses stakeholder mapping correctly?',
     o:['The council should be consulted early and closely, because it could delay the closure.','The council only needs to be monitored with minimal effort.','The council should be kept satisfied, but there is no need to tell it about the plans in advance.','The council should be kept informed through a newsletter, but not consulted.'], a:0,
     why:'High power and high interest means managing them closely. Getting this wrong means the business risks delays it could have avoided.'},
{src:'Exam-style · Herzberg', prompt:'A manager gives a team more freedom to plan its own work. Which link uses Herzberg accurately?',
 o:['More responsibility is a motivator, so the team may put in more effort','More freedom is a hygiene factor, so it stops staff being dissatisfied','More freedom means workers will be paid more','More freedom always reduces productivity'], a:0,
 why:'Responsibility is one of Herzberg\'s motivators. It is not a hygiene factor.'},
{src:'Exam-style · Lewin', prompt:'A business uses force field analysis. Which link is accurate?',
 o:['If the driving forces are stronger than the restraining forces, the change is likely to succeed','If there are more driving forces than restraining forces, the change will definitely succeed every time','Restraining forces only come from outside the business','Driving forces are always stronger'], a:0,
 why:'Strength matters, not number, and nothing is certain.'},
{src:'Exam-style · Boston Matrix', prompt:'A product has a high share of a slow-growing market. Which link uses the Boston Matrix accurately?',
 o:['It is a cash cow','As a star, it needs heavy investment to keep growing its share of the market','As a dog, it should be withdrawn','As a problem child, it needs research'], a:0,
 why:'High share, low growth is a cash cow.'},
{src:'Exam-style · Tannenbaum–Schmidt', prompt:'A manager consults staff before making a decision. Which link uses the Tannenbaum–Schmidt continuum accurately?',
 o:['A consult style can improve commitment, because staff feel their views are heard','A consult style means staff make the final decision','A consult style is always the best style','A consult style is the same as autocratic leadership'], a:0,
 why:'In a consult style the manager still decides, after hearing staff views.'},
{src:'Exam-style · price elasticity', prompt:'A café\'s demand has a PED of −2. It cuts its prices by 5%. Which link is correct?',
 o:['Quantity demanded rises by about 10%, so revenue rises','Quantity demanded rises by 2.5%, so revenue falls','Revenue falls, because the price is lower','Quantity demanded rises by 5%, so revenue stays the same'], a:0,
 why:'−2 × −5% = +10%. With elastic demand, a price cut increases revenue.'},
{src:'Exam-style · SWOT', prompt:'In a SWOT analysis, a new competitor opening nearby is:',
 o:['A threat, as it is external','A weakness, because it may take some of the business\'s customers away from it','An opportunity, because it grows the market','A strength, because competition improves quality'], a:0,
 why:'External factors are opportunities or threats. Weaknesses are internal.'},
{src:'Exam-style · Maslow', prompt:'A café uses Maslow to plan how to motivate its staff. Which link is accurate?',

{src:'Exam-style · break-even', prompt:'A firm has fixed costs of £20,000. Contribution per unit rises from £4 to £5. Which link is correct?',

{src:'Exam-style · product life cycle', prompt:'A product is in the maturity stage of its life cycle. Which link is accurate?',

/* ---------------- STAGE 8 ---------------- */
{ id:8, type:'calc', title:'Numbers in the chain', blurb:'Work out the figure, then use it as a link.', serve:6, pass:5,
  teach:`<p>A calculated figure is one of the strongest links you can put in a chain, but only if it is right. These are the calculations examiners say go wrong most often.</p>
  <p>Type your answer as a number. You get one try. After each one you will see the working and how the figure could be used in an analysis chain.</p>`,
  items:[
    {src:'Exam-style · based on June 2026 Paper 1 Q16', given:'A machine costs <b>£200,000</b>. Total net cash inflows over its 5-year life are <b>£280,000</b>.', prompt:'Calculate the average rate of return (ARR).', unit:'%', ans:8, tol:0.05,
     traps:[{v:28,m:'You did not subtract the initial cost. Only about a fifth of students got this right in June 2026, and this was the main mistake.'}],
     work:'Total profit = £280,000 − £200,000 = £80,000. Average annual profit = £80,000 ÷ 5 = £16,000. ARR = £16,000 ÷ £200,000 × 100 = 8%.',
     use:'In a chain: "an ARR of only 8% is below what the business could earn elsewhere, so the money may be better used..."'},
    {src:'AQA June 2026 · Paper 1 · Q17', given:'Kempshott plc. Selling price <b>£16,000</b> per unit. Variable cost <b>£7,000</b> per unit. Fixed costs <b>£360,000</b>. Current output <b>52 units</b>.', prompt:'Calculate the margin of safety.', unit:'units', ans:12, tol:0,
     traps:[{v:192000,m:'Margin of safety is measured in units, not pounds.'},{v:40,m:'40 is break-even output. You need one more step: actual output minus break-even.'}],
     work:'Contribution per unit = £16,000 − £7,000 = £9,000. Break-even = £360,000 ÷ £9,000 = 40 units. Margin of safety = 52 − 40 = 12 units. The mark scheme says: do not credit if margin of safety is expressed as £s.',
     use:'In a chain: "sales could fall by 12 units, about 23%, before the business makes a loss, so..."'},
    {src:'AQA June 2019 · Paper 1 · Q17', given:'A business has non-current liabilities of <b>£200,000</b> and a gearing ratio of <b>40%</b>. It then takes out a long-term loan of <b>£100,000</b>.', prompt:'Calculate its new gearing ratio.', unit:'%', ans:50, tol:0.05,
     traps:[{v:60,m:'You added the loan to non-current liabilities but not to capital employed. The examiner said this was the common mistake.'}],
     work:'Capital employed = £200,000 ÷ 0.4 = £500,000. After the loan: £300,000 ÷ £600,000 × 100 = 50%.',
     use:'In a chain: "gearing rises from 40% to 50%, so half of the long-term funding now carries interest, which..."'},
    {src:'AQA June 2025 · Paper 1 · Q16', given:'Inventories <b>£80m</b>. Receivables <b>£35m</b>. Cash <b>£40m</b>. Payables <b>£70m</b>. Net current assets <b>£85m</b>.', prompt:'Calculate the current ratio (to 2 decimal places).', unit:': 1', ans:2.21, tol:0.006,
     traps:[{v:1.21,m:'You used net current assets. The examiner said this was the common error: add the current assets together instead.'}],
     work:'Current assets = 80 + 35 + 40 = £155m. Current ratio = 155 ÷ 70 = 2.21 : 1.',
     use:'In a chain: "with a current ratio of 2.21, the business can cover its short-term debts more than twice, so..."'},
    {src:'AQA June 2025 · Paper 1 · Q17', given:'Non-current liabilities <b>£230m</b>. Total equity <b>£190m</b>. ROCE <b>12%</b>.', prompt:'Calculate operating profit.', unit:'£m', pre:true, ans:50.4, tol:0.05,
     traps:[{v:22.8,m:'You used total equity only. Capital employed is total equity plus non-current liabilities.'}],
     work:'Capital employed = 190 + 230 = £420m. Operating profit = 12% × £420m = £50.4m.',
     use:'This is a reverse calculation. The examiner said it was maths, not the formula, that caught students out.'},
    {src:'AQA June 2025 · Paper 1 · Q18', table:NEWTOWN_TABLE, prompt:'Calculate the percentage fall in Newtown\'s number of staff (to 1 decimal place).', unit:'%', ans:7.4, tol:0.051,
     traps:[{v:290,m:'290 is the fall in staff numbers. Now divide by the original figure.'},{v:8,m:'Divide by the original number of staff (3906), not the new one.'}],
     work:'Fall = 3906 − 3616 = 290. 290 ÷ 3906 × 100 = 7.4%.',
     use:'In a chain: "with 7.4% fewer staff, each person handles more enquiries, which could slow responses." The mark scheme credits this. Just do not drift into salary savings.'},
{src:'Exam-style · ARR', gen(){const C=pick([100,150,200,250]),n=pick([4,5]),arr=pick([6,8,10,12]),T=C+C*arr/100*n;
  return {given:`A machine costs <b>£${C}k</b>. Total net cash inflows over its ${n}-year life are <b>£${f(T)}k</b>.`,prompt:'Calculate the ARR.',unit:'%',ans:arr,tol:0.05,
    traps:[{v:r1(T/n/C*100),m:'Subtract the initial cost first. In June 2026 many students forgot.'}],
    work:`(£${f(T)}k − £${C}k) ÷ ${n} = £${f((T-C)/n)}k a year. ÷ £${C}k × 100 = ${arr}%.`,use:`In a chain: "an ARR of ${arr}% is above the cost of borrowing, so the machine adds to profit, as long as the inflows are achieved."`};}},
{src:'Exam-style · percentage change', gen(){const a=pick([4,5,6,8]),m=pick([2,3,4]),b=a*m;
  return {given:`The average span of control rises from <b>${a}</b> to <b>${b}</b>.`,prompt:'Calculate the percentage increase.',unit:'%',ans:(m-1)*100,tol:0.05,
    traps:[{v:b-a,m:'That is the increase in staff per manager. Divide it by the original.'},{v:m*100,m:`The new figure is ${m*100}% of the old one. The increase is ${(m-1)*100}%.`}],
    work:`(${b} − ${a}) ÷ ${a} × 100 = ${(m-1)*100}%.`,use:`In a chain: "each manager now has ${m} times as many staff, so cannot check every decision".`};}},
{src:'Exam-style · percentage points', gen(){const [a,b]=pick([[20,15],[16,12],[25,20],[24,18],[30,21]]),pct=r1((a-b)/a*100);
  return {given:`Labour turnover fell from <b>${a}%</b> to <b>${b}%</b>.`,prompt:'Calculate the percentage fall in labour turnover.',unit:'%',ans:pct,tol:0.05,
    traps:[{v:a-b,m:'That is the fall in percentage points. The percentage fall divides by the original.'}],
    work:`(${a} − ${b}) ÷ ${a} × 100 = ${pct}%.`,use:`In a chain: "labour turnover fell by ${pct}%, so the business has far fewer staff to replace and train each year".`};}},
{src:'Exam-style · reverse percentage', gen(){const O=pick([200,250,300,400,500]),x=pick([5,10,20,25]),V=O*(1+x/100);
  return {given:`Sales are now <b>£${f(V)}k</b> after a <b>${x}%</b> increase.`,prompt:'What were sales before the increase, in £k?',pre:'£',unit:'k',ans:O,tol:0.01,
    traps:[{v:r2(V*(1-x/100)),m:`You took ${x}% off. Divide by ${f(1+x/100)} instead.`}],
    work:`£${f(V)}k ÷ ${f(1+x/100)} = £${f(O)}k.`};}},
{src:'Exam-style · margins', gen(){const R1=pick([10,20,25,40]),m1=pick([8,10,12]),P1=R1*m1/100,R2=R1*pick([1.2,1.25,1.5]),P2=r2(P1*pick([1.05,1.1])),ans=r1(P2/R2*100);
  return {given:`Revenue rises from <b>£${R1}m</b> to <b>£${f(R2)}m</b>. Operating profit rises from <b>£${f(P1)}m</b> to <b>£${f(P2)}m</b>.`,prompt:'Calculate the new operating profit margin (to 1 decimal place).',unit:'%',ans,tol:0.051,
    traps:[{v:m1,m:'That is the old margin.'}],
    work:`£${f(P2)}m ÷ £${f(R2)}m × 100 = ${ans}% (was ${m1}%).`,use:'In a chain: "profit rose, but the margin fell, because revenue grew faster than profit".'};}},
{src:'Exam-style · break-even', gen(){const c=pick([4,5,8,10]),d=pick([1,2]),k=rint(20,60,5),FC=c*(c+d)*k,V=rint(5,15),P=V+c;
  return {given:`Price <b>£${P}</b>. Variable cost <b>£${V}</b> per unit. Fixed costs <b>£${f(FC)}</b>. The firm raises its price by <b>£${d}</b>.`,prompt:'Calculate the new break-even output.',unit:'units',ans:FC/(c+d),tol:0,
    traps:[{v:FC/c,m:'That is break-even at the old price. Contribution per unit has risen.'}],
    work:`New contribution = £${P+d} − £${V} = £${c+d}. £${f(FC)} ÷ £${c+d} = ${f(FC/(c+d))} units (was ${f(FC/c)}).`,use:'In a chain: "break-even output falls, so the business needs fewer sales to avoid a loss".'};}}
  ]},
/* ---------------- STAGE 9 ---------------- */
{ id:9, type:'timed', title:'Against the clock', blurb:'Twelve mixed questions, 25 seconds each.', pass:10, poolFrom:[2,5,6,7], count:12, seconds:25,
  teach:`<p>In the exam you will not have time to think slowly about every end point. This round mixes questions from stages 2, 5, 6 and 7, picked at random each time.</p>
  <p>You have <b>25 seconds</b> for each one. If the bar runs out, it counts as wrong. You need 10 out of 12.</p>`,
  items:[]},

{ id:10, type:'write', title:'The real thing', blurb:'Write a full 9-mark answer to a real past question.', pass:1,
  teach:`<p>This is the June 2025 Paper 1 question 18. Most students reached Level 2 or 3. The examiner said the two things that decided the mark were keeping the focus on <b>speed of response</b> and using <b>more than one piece of data</b>.</p>
  <p>Write one developed argument, about 6 or 7 linked steps. No counter-argument and no separate conclusion. Finish with a sentence starting "Therefore" that uses the words of the question.</p>
  <p>Write your start point and end point first. The answer box unlocks when you have.</p>`,
  items:[{src:'AQA June 2025 · Paper 1 · Q18', w:{
    intro:`<p style="margin-bottom:10px">The table below shows changes to the structure of Newtown plc.</p>${NEWTOWN_TABLE}
      <div class="qbox">Analyse how this restructuring of Newtown plc in 2024 might affect its speed of response to customer enquiries. <span style="color:var(--muted);font-weight:400">(9 marks)</span></div>`,
    plan:[
      {id:'S',label:'Start point',cls:'s',ph:'What are you analysing?',ok:v=>/(restructur|span|hierarch|level|layer|delayer)/.test(v),hint:'Check your start point: what has Newtown changed?'},
      {id:'E',label:'End point',cls:'e',ph:'Where must the chain finish?',ok:v=>/(speed|fast|quick|response|respond)/.test(v)&&/(enquir|custom|respon)/.test(v),hint:'Check your end point. Look at the last words of the question.'}],
    planOk:'Good. Keep both in front of you while you write.',
    checks:[
      {k:'start',label:'Opens from the restructuring (span of control or levels of hierarchy)',test:x=>/(restructur|span of control|levels? of hierarchy|hierarch|layers?|delayer)/.test(x.firstTwo)},
      {k:'data',label:'Uses two different pieces of data from the table',test:x=>{const l=x.low;
        const a=/\b6\b[^.]{0,40}\b4\b|\bsix\b[^.]{0,40}\bfour\b|two fewer (levels|layers)/.test(l);
        const b=/\b5\b[^.]{0,40}\b15\b|\bfive\b[^.]{0,40}\bfifteen\b|span of control[^.]{0,40}\b(15|fifteen|tripl|three times)/.test(l);
        const c=/(3906|3,906|3616|3,616|\b290\b|7\.4)/.test(l);return [a,b,c].filter(Boolean).length>=2;}},
      {k:'calc',label:'Works something out (tripled, two fewer layers, 7.4% fewer staff...)',test:x=>/(tripl|three times|third|two fewer|7\.4|\b290\b|200%|33%)/.test(x.low)},
      {k:'links',label:'At least six linking words between steps',test:x=>(x.low.match(/\b(because|so|therefore|this means|which means|as a result|meaning|leads to|resulting in|consequently|since|as)\b/g)||[]).length>=6},
      {k:'focus',label:'Keeps coming back to speed of response',test:x=>(x.low.match(/(speed|faster|quicker|sooner|respon|delay|wait)/g)||[]).length>=3},
      {k:'end',label:'Last sentence starts "Therefore" and answers the question',test:x=>/^therefore/.test(x.last)&&/(speed|respon|faster|quicker)/.test(x.last)&&/(enquir|custom)/.test(x.last)}],
    warn:x=>/(profit|cost|revenue|salar|motivat)/.test(x.last)?{msg:'Your last sentence mentions profit, costs or motivation. Is that the end point?',block:true}
      :/\b(however|on the other hand|but this depends|in conclusion|overall,)\b/.test(x.low)?{msg:'This looks like a counter-argument or conclusion. A 9-mark answer needs one developed argument only.'}:null,
    model:`<span class="src">One way to write it</span><p><span class="hl-s">Newtown's restructuring</span> is likely to increase its speed of response to customer enquiries because <span class="hl-d">the average span of control has tripled from 5 to 15</span>. A manager responsible for 15 staff cannot check every decision in the way they could with 5, <span class="hl-w">so</span> front-line staff are likely to be given more authority to deal with customers themselves. <span class="hl-w">This means</span> that a customer who calls with a problem can be given an answer in the first conversation, rather than waiting while the enquiry is passed to a manager. For the enquiries that still need a manager's decision, <span class="hl-d">the levels of hierarchy have fallen from 6 to 4, so there are two fewer layers</span> for the enquiry to travel up and back down. <span class="hl-w">Because</span> every layer is a point where a message can sit waiting to be read or approved, removing two of them takes out a delay at each stage. <span class="hl-w">As a result</span>, the time between a customer making an enquiry and getting a decision should fall. <span class="hl-w">Therefore</span> the restructuring is likely to improve <span class="hl-e">Newtown's speed of response to customer enquiries</span>, because more staff can now answer customers directly and fewer enquiries are held up passing through the hierarchy.</p>
      <div class="key"><span><span class="hl-s">teal</span> start point</span><span><span class="hl-e">coral</span> end point</span><span><span class="hl-w">purple</span> links</span><span><span class="hl-d">underlined</span> data, worked out</span></div>
      <p style="margin-top:14px;font-size:.9rem;color:var(--muted)">Notice it stays with one argument and never mentions costs or profit, even though the staff numbers fell.</p>`,
    ai:`You are an experienced AQA A-level Business teacher giving feedback on a student's 9-mark answer to: "Analyse how this restructuring of Newtown plc in 2024 might affect its speed of response to customer enquiries." Data: staff 3906 to 3616; average span of control 5 to 15; levels of hierarchy 6 to 4.
Rules for this question: one fully developed argument is the right approach, so never tell the student to add a second argument, a counter-argument or a conclusion. Focus only on: whether they start from the restructuring, whether every step stays heading to SPEED OF RESPONSE TO CUSTOMER ENQUIRIES (the examiner said many students drifted to other outcomes such as costs or profit), whether there is a reason between each step, whether they use two pieces of data and work something out rather than quoting, and whether the final "Therefore" sentence uses the question's words.
Do not give a mark or level. Write in plain British English, as a teacher speaking to a Year 13 student. No headings, no bullet symbols other than simple dashes, no emoji. Give: one sentence on what works; then two or three improvements, each quoting a short phrase they wrote ("You wrote: ...") and showing a better version ("You could write: ..."). Keep it under 220 words.`,
    doneTitle:'Course complete',
    doneText:'You have built a full chain from start point to end point on a real past question. Use the same habit every time: write the start point and end point at the top of your plan before you write anything else.'
  }}]}
];
