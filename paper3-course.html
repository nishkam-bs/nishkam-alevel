<script>
/* =====================================================================
   PAPER 3 COURSE
   One made-up case study (Ridgeway Cycles Ltd) with appendices, worked
   through question type by question type. Built on what the AQA Paper 3
   examiner reports 2017–2026 say. "Based on" means the issue comes from
   the report; the wording of every item is our own.
   Stage numbers are stored in the tracking sheet as 600 + stage.
   ===================================================================== */
const T=(head,rows)=>`<div class="tablewrap"><table class="d"><thead><tr>${head.map((h,i)=>`<th${i?' class="r"':''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="r"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const CASE_TEXT=`<p>Ridgeway Cycles Ltd was set up in 2014 by Amrit and Kiran Sandhu, a brother and sister, in Swindon. It designs and assembles electric bikes (e-bikes). Most of its bikes are sold through 140 independent bike shops in the UK. Since 2022 it has also sold directly to customers through its own website. Its bikes sell for between £2,400 and £4,500 and compete on quality and reliability rather than price.</p>
<p>Frames and batteries are bought from suppliers in Taiwan. Ridgeway assembles and tests every bike in its own factory, which employs 64 production staff. UK demand for e-bikes grew quickly between 2020 and 2022, and Ridgeway expanded its factory, funded by a £2.5m bank loan. The bank has said it will review the terms of the loan if Ridgeway's gearing goes above 50%.</p>
<p>Since 2023 the growth of the market has slowed, and cheaper imported e-bikes sold online have taken market share. Bike shops say their customers increasingly compare prices online before buying.</p>
<p>Amrit, who runs operations, wants to invest £1.2m in an automated assembly line (Appendix D). Kiran, who runs marketing, would rather spend money growing website sales, where Ridgeway does not have to give a bike shop 35% of the retail price.</p>
<p>Labour turnover in the factory rose sharply in 2024. Production staff are paid hourly, and some have left for a new warehouse nearby that pays more. The Sandhus have always run the business informally and make most decisions themselves.</p>`;
const APX_A=`<p class="apx">Appendix A: Financial information (£m)</p>`+T(['','2022','2023','2024'],[['Revenue','9.6','10.4','9.9'],['Gross profit','3.4','3.5','3.1'],['Operating profit','1.15','0.94','0.52'],['Non-current liabilities','2.5','2.3','2.1'],['Total equity','2.6','2.7','2.6']]);
const APX_B=`<p class="apx">Appendix B: Factory data</p>`+T(['','2022','2023','2024'],[['Bikes produced','4,100','4,300','4,000'],['Maximum capacity (bikes per year)','6,000','6,000','6,000'],['Labour turnover, production staff (%)','9','12','26'],['Bikes failing final testing (%)','2.1','2.4','3.6']]);
const APX_C=`<p class="apx">Appendix C: Sales channels, 2024</p>`+T(['','Bike shops','Website'],[['Bikes sold','3,200','800'],['Average retail price (£)','3,440','3,440'],['Amount Ridgeway receives per bike (£)','2,236','3,440'],['Variable cost per bike (£)','1,700','1,700'],['Delivery and online marketing per bike (£)','–','200']]);
const APX_D=`<p class="apx">Appendix D: Proposed automated assembly line</p>`+T(['','Now','With the new line'],[['Assembly time per bike (hours)','6','3.5'],['Production staff needed at current output','64','40'],['Cost of the line (£m)','–','1.2'],['Expected labour cost saving per year (£m)','–','0.6']])+
  `<p class="apx" style="margin-top:12px">Installing the line</p>`+T(['Activity','Duration (weeks)','Must follow'],[['A: Order and build equipment','10','–'],['B: Prepare factory floor','4','–'],['C: Install line','6','A and B'],['D: Train staff','3','A'],['E: Test runs','2','C and D']]);
const APX_E=`<p class="apx">Appendix E: UK e-bike market</p>`+T(['','2022','2023','2024','2025 (forecast)'],[['Market value (£m)','820','850','860','870'],['Share sold online by direct-to-customer brands (%)','18','24','31','37']]);
const APX_F=`<p class="apx">Appendix F: UK economic forecasts</p>`+T(['','2025','2026','2027'],[['GDP growth (%)','1.0','1.4','1.6'],['Bank of England base rate (%)','4.25','3.75','3.50'],['Inflation (%)','2.8','2.4','2.1']])+`<p style="font-size:.88rem;color:var(--muted);margin:-6px 0 14px">Income elasticity of demand for e-bikes: +1.8</p>`;
const CASE_OPEN=`<details class="card casebox" open><summary>Ridgeway Cycles Ltd: the case</summary>${CASE_TEXT}</details>`;
const CASE_BOX=`<details class="card casebox"><summary>Ridgeway Cycles Ltd: the case</summary>${CASE_TEXT}</details>`;
const Q={
  1:'Analyse why Ridgeway\'s operating profit margin fell between 2022 and 2024.',
  2:'Analyse how selling more bikes through its own website could improve Ridgeway\'s operating profit margin.',
  3:'Using Appendix D, assess whether Ridgeway could have the automated line running within four months of placing the order.',
  4:'To what extent is the automated line likely to improve Ridgeway\'s competitiveness?',
  5:'Using Appendices A and C, should Ridgeway invest in the automated line or in growing its website sales? Justify your answer.',
  6:'To what extent should all UK manufacturers automate their production to compete with cheaper imports?'};
const QBOX=n=>`<div class="qbox" style="margin-bottom:14px"><span style="color:var(--muted);font-weight:600">Question ${n}.</span> ${Q[n]}</div>`;

const STAGES=[
/* ---------------- STAGE 1 ---------------- */
{ id:1, type:'mcq', title:'How Paper 3 works', blurb:'Marks, timing and what each question needs.', serve:8, pass:6,
  teach:`<p>Paper 3 is one case study and six questions, 100 marks in 2 hours. Questions 1 and 2 are worth 12 marks each, questions 3 and 4 are 16 each, question 5 is 20 and question 6 is 24.</p>
  <p>Throughout this course you will work on one case, <b>Ridgeway Cycles Ltd</b>, which is made up for the course. It is at the top of every stage that uses it. First, make sure you know what each question is asking for.</p>${CASE_BOX}`,
  items:[
    {src:'AQA November 2020 · Paper 3 report', prompt:'How many marks are for evaluation (AO4) on the 16, 20 and 24-mark questions?',
     o:['7, 8 and 9','4, 5 and 6','Half the marks on each','None, because evaluation is only on Paper 1'], a:0,
     why:'The report says that without a judgement, students "severely" restrict the marks they can get.'},
    {src:'Based on AQA June 2024 · Paper 3 report', prompt:'Do questions 1 and 2, the 12-mark questions, need a conclusion?',
     o:['No: they test analysis, so use the time to develop the argument','Yes, every Paper 3 answer should end with a balanced conclusion','Only if you have time left over at the end of the exam','Only question 2, because it is the second of the two'], a:0,
     why:'They test analysis, not evaluation. A conclusion takes time and earns nothing extra.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q2)', prompt:'What approach did the June 2026 examiner show as ideal for a 12-mark question?',
     o:['One argument, fully developed in the context of the case','Three or four short points, each backed by data from the case','Two sides of the argument followed by a short conclusion','A definition of the key term followed by two developed points'], a:0,
     why:'An answer with one fully developed argument scored 12 out of 12. One with several undeveloped points scored 1.'},
    {src:'Exam-style · timing', prompt:'The paper is 2 hours for 100 marks, and you need time to read the case. About how long should question 6 (24 marks) take?',
     o:['About 25 to 30 minutes','About 10 minutes, as it is only one question','About an hour, as it is worth the most marks','Whatever time is left after the other five'], a:0,
     why:'After 15 to 20 minutes of reading and planning, you have roughly a minute per mark. Question 6 is the last question, so it is the one most often squeezed.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', prompt:'Questions 1 to 5 are about the case business. Where should your context come from?',
     o:['The case and appendices: draw sensible conclusions, but don\'t invent facts','Any real business you know well that operates in the same industry','Your own assumptions about the business','Last year\'s case study, if the business is in a similar industry'], a:0,
     why:'In 2026 students invented shareholders and built arguments on facts that were not in the case.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q6)', prompt:'Question 6 asks about all businesses. What context should you use?',
     o:['A range of different businesses or situations, not just the case','Only the case business, because the whole paper is about it','No context is needed, as long as the theory is accurate','One well-known company that everyone will recognise, used throughout'], a:0,
     why:'Answers that only used the case business had their marks capped.'},
    {src:'AQA June 2026 · Paper 3 report', prompt:'What did the 2026 examiner recommend doing each time you start a new paragraph?',
     o:['Re-read the question','Write a definition','Bring in a new model','Summarise the case'], a:0,
     why:'"It is sensible to re-read the question each time you start a new paragraph."'},
    {src:'AQA June 2026 · Paper 3 report', prompt:'What did weaker answers do on questions 1 and 4 in 2026?',
     o:['Produced purely theoretical answers, without using the case','Used too much data from the appendices','Wrote too much on each question and ran out of time','Used too many business models in their answers'], a:0,
     why:'The examiner said weaker responses "at times, produce purely theoretical answers, especially to questions 1 and 4".'},
    {src:'AQA June 2025 · Paper 3 report', prompt:'On a 16-mark question, is a conclusion that just says which side is stronger enough?',
     o:['No: it must explain why one side wins','Yes, as long as the side chosen is clearly stated in the very last sentence','Only on question 5, which is worth 20 marks','Conclusions are not marked on the 16-mark questions'], a:0,
     why:'The 2025 examiner said: "Too many simply decided which argument was stronger and restated this".'},
{src:"Exam technique · Paper 3", prompt:"How many questions are on Paper 3, and how many marks is it worth?",
 o:["Six questions, 100 marks","Five questions, 80 marks","Four questions, 100 marks","Six questions, 80 marks"], a:0,
 why:"12 + 12 + 16 + 16 + 20 + 24 = 100 marks, in 2 hours."},
{src:"Exam technique · Paper 3", prompt:"Which question on Paper 3 is worth the most marks?",
 o:["Question 6, worth 24 marks","Question 5, worth 20 marks","Question 1, worth 12 marks","They are all worth the same"], a:0,
 why:"Question 6 is also the last question, so it is the one most at risk if you run short of time."},
{src:"Exam technique · Paper 3", prompt:"What should you do in the first 15 to 20 minutes of Paper 3?",
 o:["Read the case and appendices carefully, noting key figures and facts","Start question 6 straight away, because it is worth the most","Read only the questions, then skim the case when needed","Write out a full summary of the case before you look at any of the questions"], a:0,
 why:"Every question depends on the case. Time spent understanding it saves time later."},
{src:"Exam technique · timing", prompt:"A 12-mark question asks you to analyse one factor. Roughly how long should you spend on it?",
 o:["About 12 to 15 minutes","About 5 minutes","About 30 minutes","About 45 minutes"], a:0,

{src:"Exam technique · using appendices", prompt:"A question says \"Using Appendix C\". What happens if you do not use Appendix C?",
 o:["Your mark is likely to be limited, however good the rest of the answer","Nothing, as long as your theory is accurate","You lose one mark for each missing figure","The examiner ignores the instruction"], a:0,
 why:"When a question names an appendix, using it accurately is part of what is being marked."},
{src:"Exam technique · using the case", prompt:"What is the best way to use the case in a Paper 3 answer?",
 o:["Use facts and figures from the case at each step","Copy out the relevant paragraph of the case first","Mention the name of the business at the start of every paragraph you write","Use the case only in the conclusion"], a:0,
 why:"Application means the case shapes the argument, not that it is mentioned."},
{src:"Exam technique · 16-mark questions", prompt:"What should a 16-mark answer on Paper 3 usually contain?",

 why:"7 of the 16 marks are for evaluation, so the answer needs a judgement."},
{src:"Exam technique · using the case", prompt:"Why is it worth checking what type of business the case is about before you answer?",
 o:["Arguments that fit a manufacturer may not fit a retailer or a service business","The examiner awards a separate mark for naming the type of business correctly","The type of business never changes the answer","It tells you how many marks each question is worth"], a:0,
 why:"Examiners regularly report answers that treat a retailer like a manufacturer, or a B2B business like a shop."},
{src:"Exam technique · timing", prompt:"What is the biggest risk of spending too long on questions 1 and 2?",
 o:["Less time for questions 5 and 6","Writing answers that are too detailed for the examiner to read in the time","Using too much data","Forgetting the name of the business"], a:0,
 why:"Questions 5 and 6 are worth 44 marks between them."}
  ]},

/* ---------------- STAGE 2 ---------------- */
{ id:2, type:'mcq', title:'Read the case', blurb:'Find what matters, and don\'t add what isn\'t there.', serve:8, pass:6,
  teach:`<p>Read the case below carefully. Every question in this stage is about what it does and does not say. On the June 2026 Paper 3, the worst-answered question went wrong because students built arguments on facts that were not in the case.</p>${CASE_BOX}`,

     o:['No: it is a private limited company','Yes, because every limited company has to list its shares on the London Stock Exchange','Yes, because it has a £2.5m bank loan from a major high street bank','Only after 2025, when the Sandhus plan to float the business'], a:0,
     why:'This is the kind of invented fact that cost marks in 2026.'},
    {src:'Exam-style · Ridgeway Cycles', table:CASE_OPEN, prompt:'A question asks about labour turnover. Which fact from the case matters most?',

    {src:'Exam-style · Ridgeway Cycles', table:CASE_OPEN, prompt:'Why might the bank loan limit Ridgeway\'s choices?',
     o:['The bank will review the loan terms if gearing goes above 50%','Banks do not lend to manufacturers that import their parts from abroad','The whole loan has to be repaid in full by the end of this year','Ridgeway has no bank loan, so borrowing is not an issue'], a:0,
     why:'Any option funded by more debt has to be checked against that 50% line.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q5)', table:CASE_OPEN, prompt:'How does the case describe the market since 2023?',
     o:['Growth has slowed, and cheaper imported e-bikes sold online have taken share','The market has collapsed, and sales of e-bikes are now falling fast','Demand has doubled since 2023 as more people switch to e-bikes','Bike shops across the UK are closing down'], a:0,
     why:'Keep it in proportion. The 2026 examiner credited answers that avoided exaggeration.'},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', table:CASE_OPEN, prompt:'Which statement goes beyond what the case says?',
     o:['The Sandhus are planning to sell the business','Amrit wants to invest in automation','Kiran prefers to grow website sales','The founders make most of the decisions themselves'], a:0,
     why:'Nothing in the case suggests a sale.'},
    {src:'Exam-style · Ridgeway Cycles', table:CASE_OPEN, prompt:'How does Ridgeway compete?',
     o:['On quality and reliability rather than price','As the cheapest e-bike brand on sale in the UK','Only on how quickly it delivers to bike shops','The case does not say how it competes'], a:0,
     why:'In Porter\'s terms this is differentiation, which matters when judging any plan to cut costs.'},
{src:"Exam-style · Ridgeway Cycles", table:CASE_OPEN, prompt:"Where does Ridgeway buy its frames and batteries?",
 o:["From suppliers in Taiwan","From UK suppliers based near its factory in Swindon","It makes them itself in its Swindon factory","From the bike shops"], a:0,
 why:"It buys the main parts from Taiwan and assembles and tests the bikes itself."},
{src:"Exam-style · Ridgeway Cycles", table:CASE_OPEN, prompt:"What did Ridgeway do when demand grew between 2020 and 2022?",
 o:["Expanded its factory, funded by a £2.5m bank loan","Opened its own chain of shops","Moved its production to Taiwan to be closer to its suppliers","Floated on the stock exchange"], a:0,

{src:"Exam-style · Ridgeway Cycles", table:CASE_OPEN, prompt:"A student writes: \"Ridgeway should cut its prices to match the cheap imports.\" Which fact from the case challenges this?",

 why:"The case says cheaper imports sold online have taken market share since 2023."},
{src:"Exam-style · Ridgeway Cycles", table:CASE_OPEN, prompt:"Which part of the case is most relevant to a question about Ridgeway's relationships with its business customers?",

/* ---------------- STAGE 3 ---------------- */
{ id:3, type:'calc', title:'Work out the appendices', blurb:'The figures you will need for the longer questions.', serve:6, pass:5,
  teach:`<p>The best Paper 3 answers do calculations from the appendices and then use the answers in their arguments. On the June 2025 Paper 3, the examiner expected students to calculate how long the project would take, and said answers without "accurate use of Appendix C data" were unlikely to reach Level 3 or 4.</p>
  <p>Work out each figure from Ridgeway's appendices. Give your answer as a number.</p>`,
  items:[
    {src:'Exam-style · Appendix A', table:APX_A, prompt:'Calculate Ridgeway\'s operating profit margin in 2024, to two decimal places.', unit:'%', ans:5.25, tol:0.06,
     traps:[{v:31.31,m:'That is the gross profit margin.'},{v:11.98,m:'That is 2022.'}],
     work:'£0.52m ÷ £9.9m × 100 = 5.25%.', use:'In 2022 it was about 12%. Saying the margin more than halved is much stronger than "profit fell".'},
    {src:'Exam-style · Appendix A', table:APX_A, prompt:'By how many percentage points did the operating profit margin fall between 2022 and 2024, to one decimal place?', unit:'percentage points', ans:6.7, tol:0.1,
     work:'2022: 1.15 ÷ 9.6 × 100 = 12.0%. 2024: 5.3%. 12.0 − 5.3 = 6.7 points.', use:'This is the size of the problem that question 1 asks you to explain.'},
    {src:'Exam-style · Appendix A', table:APX_A, prompt:'Calculate Ridgeway\'s gearing in 2024, to one decimal place.', unit:'%', ans:44.7, tol:0.1,
     traps:[{v:80.8,m:'You divided by total equity. Gearing = non-current liabilities ÷ capital employed (equity + non-current liabilities).'}],
     work:'Capital employed = 2.6 + 2.1 = £4.7m. 2.1 ÷ 4.7 × 100 = 44.7%.', use:'It is below the bank\'s 50% line, but not by much.'},
    {src:'Exam-style · Appendices A and D', table:APX_A, prompt:'If the £1.2m line were paid for entirely with a new loan, what would gearing become, to one decimal place?', unit:'%', ans:55.9, tol:0.1,
     traps:[{v:70.2,m:'Capital employed rises too: the new loan is part of it.'}],
     work:'Non-current liabilities = 2.1 + 1.2 = £3.3m. Capital employed = 4.7 + 1.2 = £5.9m. 3.3 ÷ 5.9 × 100 = 55.9%.', use:'Above 50%, so the bank would review the loan terms. That is a strong point for question 5.'},
    {src:'Exam-style · Appendix B', table:APX_B, prompt:'Calculate capacity utilisation in 2024, to one decimal place.', unit:'%', ans:66.7, tol:0.1,
     work:'4,000 ÷ 6,000 × 100 = 66.7%.', use:'A third of the factory is idle, so its fixed costs are spread over fewer bikes.'},
    {src:'Exam-style · Appendix C', table:APX_C, prompt:'Calculate the contribution per bike sold through the website.', pre:'£', ans:1540, tol:0,
     traps:[{v:1740,m:'Remember the £200 of delivery and online marketing.'},{v:536,m:'That is the contribution per bike through bike shops.'}],
     work:'£3,440 − £1,700 − £200 = £1,540.', use:'Through a bike shop it is £2,236 − £1,700 = £536. Each bike moved online adds about £1,000.'},
    {src:'Based on AQA June 2025 · Paper 3 report (Q3)', table:APX_D, prompt:'How long is the critical path for installing the new line?', unit:'weeks', ans:18, tol:0,
     traps:[{v:25,m:'You added every activity. Some run at the same time.'},{v:16,m:'C can only start once A and B are both finished, then E needs C and D.'}],
     work:'A (10) → C (6) → E (2) = 18 weeks. B and D run alongside.', use:'Four months is about 17 weeks, so this is just over. That is the key fact for question 3.'},
    {src:'Exam-style · Appendix D', table:APX_D, prompt:'What is the payback period of the automated line, using the expected labour saving?', unit:'years', ans:2, tol:0,
     work:'£1.2m ÷ £0.6m a year = 2 years.', use:'Payback assumes the saving actually happens. Fewer staff only saves money if the 24 posts really go.'},
{src:"Exam-style · Appendix A", table:APX_A, prompt:"Calculate Ridgeway's gross profit margin in 2024, to one decimal place.", unit:"%", ans:31.3, tol:0.1,
 traps:[{v:5.3,m:"That is the operating profit margin. Gross profit margin uses gross profit."},{v:35.4,m:"That is 2022."}],
 work:"£3.1m ÷ £9.9m × 100 = 31.3%.", use:"It was 35.4% in 2022, so the cost of each bike has risen faster than the price Ridgeway receives."},
{src:"Exam-style · Appendix A", table:APX_A, prompt:"Calculate Ridgeway's operating expenses in 2024, in £m.", pre:true, ans:2.58, tol:0.005,
 traps:[{v:0.52,m:"That is operating profit. Operating expenses = gross profit − operating profit."},{v:9.38,m:"That is all of Ridgeway's costs. Start from gross profit, not revenue."}],
 work:"£3.1m − £0.52m = £2.58m.", use:"In 2022 they were £2.25m. Expenses rose while gross profit fell, squeezing the margin from both sides."},
{src:"Exam-style · Appendix A", table:APX_A, prompt:"Calculate Ridgeway's ROCE in 2024, to one decimal place.", unit:"%", ans:11.1, tol:0.1,
 traps:[{v:20,m:"You divided by total equity only. Capital employed = total equity + non-current liabilities."}],
 work:"£0.52m ÷ (£2.6m + £2.1m) × 100 = 11.1%.", use:"It was 22.5% in 2022. Ridgeway now earns half as much on each pound invested in it."},
{src:"Exam-style · Appendix B", table:APX_B, prompt:"How many bikes failed final testing in 2024?", unit:"bikes", ans:144, tol:0.5,
 traps:[{v:86.1,m:"That is 2022."}],
 work:"3.6% × 4,000 = 144 bikes.", use:"In 2022 it was about 86. Around 58 more faulty bikes a year, each needing rework, is a concrete cost of the rise in labour turnover."},
{src:"Exam-style · Appendix C", table:APX_C, prompt:"What percentage of Ridgeway's bikes were sold through its website in 2024?", unit:"%", ans:20, tol:0.05,
 traps:[{v:25,m:"Divide by total bikes sold (4,000), not by bikes sold through shops."}],

{src:"Exam-style · Appendix C", table:APX_C, prompt:"If 400 bikes a year moved from bike shops to the website, by how much would Ridgeway's total contribution rise?", pre:"£", ans:401600, tol:0,

 work:"Website contribution = £3,440 − £1,700 − £200 = £1,540. Shop contribution = £2,236 − £1,700 = £536. 400 × (£1,540 − £536) = £401,600.", use:"That is close to the line's £0.6m saving, without the £1.2m outlay."},
{src:"Exam-style · Appendix E", table:APX_E, prompt:"Calculate the percentage growth in the UK e-bike market between 2023 and 2024, to one decimal place.", unit:"%", ans:1.2, tol:0.05,

{src:"Exam-style · Appendix D", table:APX_D, prompt:"If ordering and building the equipment (activity A) took 12 weeks instead of 10, how long would the project take?", unit:"weeks", ans:20, tol:0,

{ id:4, type:'weak', title:'The 12-mark questions', blurb:'One deep argument. Find the step that would lose marks.', serve:4, pass:3,
  teach:`<p>Questions 1 and 2 reward one argument, developed step by step in the context of the case, using the appendix data. Each chain below has one step that the reports say loses marks: going past the end point, inventing a fact, a generic point, misreading the data, or a model used wrongly.</p>
  <p>The June 2026 report said some students "pushed arguments too far", going past customer satisfaction, the end point in the question, to revenue and profit.</p>${CASE_BOX}${APX_A}${APX_B}${APX_C}`,
  items:[
    {src:'Based on AQA June 2026 · Paper 3 report', q:Q[2],
     s:['On its website Ridgeway keeps the full £3,440, instead of the £2,236 it receives through a bike shop.','Even after £200 of delivery and marketing, each website bike contributes £1,540 compared with £536.','So each bike moved from shops to the website adds about £1,000 towards fixed costs, without adding to them, so operating profit rises faster than revenue.','The extra profit can then be paid to the Sandhus as dividends, which will encourage them to grow the business.'],
     bad:3, problem:'The question ends at the operating profit margin. Going on to dividends wastes time, which is what the 2026 examiner described.',
     fixes:['Therefore selling more through its own website could improve Ridgeway\'s operating profit margin, because each sale keeps far more of the price.','The extra profit could then be reinvested in new products, which would help Ridgeway compete with cheap imports from abroad in the future.','This would also make Ridgeway more competitive in the long run.'], fix:0},
    {src:'Based on AQA June 2026 · Paper 3 report (Q1)', q:Q[1],
     s:['Labour turnover among production staff rose from 9% to 26%.','New staff are less experienced, so more bikes fail final testing: the failure rate rose from 2.1% to 3.6%.','Ridgeway also had to pay its new shareholders higher dividends, which reduced its margin.','Each faulty bike has to be reworked or scrapped, which adds cost without adding revenue.'],
     bad:2, problem:'There are no new shareholders in the case, and dividends are paid out of profit, so they do not affect operating profit.',
     fixes:['Recruiting and training replacements adds to operating expenses as well.','Dividends are always paid before operating profit is calculated.','Shareholders may have wanted Ridgeway to grow faster, so the managers spent more on marketing.'], fix:0},
    {src:'AQA June 2026 · Paper 3 report', q:'Analyse how the automated line could improve Ridgeway\'s competitiveness.',
     s:['The line would cut assembly time from 6 hours to 3.5 hours per bike.','Automation generally improves efficiency in businesses.','With fewer labour hours per bike, Ridgeway needs 40 production staff instead of 64, saving about £0.6m a year.','Lower costs per bike let it hold its prices against cheaper imports while protecting its margin.'],
     bad:1, problem:'A purely theoretical step that could be about any business. The 2026 examiner found these especially on questions 1 and 4.',
     fixes:['That is a cut of over 40%.','Machines are always better than people, because they never get tired or make mistakes.','Many manufacturers use automation.'], fix:0},
    {src:'Based on AQA June 2025 · Paper 3 report (Q3)', q:Q[1],
     s:['Ridgeway\'s revenue fell every year from 2022 to 2024.','At the same time its operating expenses rose, from £2.25m to £2.58m.','Some of this is likely to be the cost of marketing the website and recruiting replacement staff.','With costs rising faster than revenue, operating profit fell from £1.15m to £0.52m, so the margin fell from about 12% to about 5%.'],
     bad:0, problem:'This misreads Appendix A. Revenue rose to £10.4m in 2023 and was still higher in 2024 than in 2022. In 2025 the examiner showed an answer whose arguments were flawed because it misread the appendix.',
     fixes:['Ridgeway\'s revenue rose to £10.4m in 2023 before falling back to £9.9m, so it was only slightly higher in 2024 than in 2022.','Ridgeway\'s revenue doubled between 2022 and 2024, which shows that demand for its bikes has grown strongly every single year.','Ridgeway has no revenue data in the appendices.'], fix:0},
    {src:'Exam-style · Handy\'s cultures', q:'Analyse how the founders\' informal way of running the business might affect labour turnover.',
     s:['The Sandhus make most decisions themselves, which Handy would call a role culture.','Production staff have little say over shifts or how the work is organised.','Staff who feel they have no voice have less reason to stay when a nearby warehouse pays more.','So more of them leave, adding to labour turnover that has already reached 26%.'],
     bad:0, problem:'Decisions made by a few people at the centre is a power culture. Role culture is built on rules and procedures.',
     fixes:['The Sandhus make most decisions themselves, which Handy would call a power culture.','The Sandhus make most decisions themselves, which Handy would call a task culture.','The Sandhus use a person culture, because the business exists mainly to serve the two of them.'], fix:0},
{src:"Exam-style · Question 1", q:Q[1],
 s:["Ridgeway's gross profit margin fell from about 35% to about 31% between 2022 and 2024.","This shows that the cost of each bike rose faster than the amount Ridgeway received for it.","This means Ridgeway's operating expenses must have fallen.","Because less is left from each sale after paying for the bike itself, the operating profit margin falls too."],
 bad:2, problem:"A falling gross margin says nothing about operating expenses falling. In fact they rose, from £2.25m to £2.58m.",
 fixes:["Operating expenses also rose, from £2.25m to £2.58m, squeezing the margin further.","This means that Ridgeway's operating expenses must have fallen sharply, because gross profit fell.","This means that the bike shops must have raised their prices to customers."], fix:0},
{src:"Based on AQA June 2026 · Paper 3 report (Q1)", q:Q[2],
 s:["Website customers pay the same £3,440 as customers in bike shops.","But Ridgeway receives all of it, rather than the £2,236 left after the bike shop takes 35%.","Website customers are teenagers who want the cheapest bikes, so demand will be very price elastic.","So each bike sold online contributes about £1,000 more towards fixed costs."],
 bad:2, problem:"Nothing in the case says who the website customers are. It invents a fact and heads away from the margin.",
 fixes:["Even after £200 of delivery and marketing, a website bike contributes £1,540, not £536.","Website customers are probably wealthy older people who do not care at all about the price they pay.","Website sales will probably grow by 50% next year because the market is moving online."], fix:0},
{src:"Exam-style · Herzberg", q:"Analyse how Ridgeway's pay might have affected its capacity utilisation.",
 s:["Some production staff left for a nearby warehouse that pays more.","Herzberg would say they left because the job lacked motivators such as recognition.","With fewer experienced staff, output fell from 4,300 bikes in 2023 to 4,000 in 2024.","Capacity utilisation fell from about 72% to about 67%."],
 bad:1, problem:"Staff left for better pay. Herzberg treats pay as a hygiene factor, so this is dissatisfaction, not a lack of motivators.",
 fixes:["Herzberg would see pay as a hygiene factor: earning less than at the warehouse caused dissatisfaction.","Herzberg would say pay is the most important motivator.","Herzberg would say staff left because they had reached self-actualisation in their jobs."], fix:0},
{src:"Based on AQA June 2026 · Paper 3 report (Q5)", q:Q[1],
 s:["Capacity utilisation fell from about 68% in 2022 to about 67% in 2024.","This is a very large fall that explains most of the drop in the margin.","With output down, the factory's fixed costs are spread over fewer bikes.","So the cost of each bike rises, leaving less operating profit from each pound of revenue."],
 bad:1, problem:"68.3% to 66.7% is a small fall. Overstating a figure weakens the argument, so keep it in proportion.",
 fixes:["This is only a small fall.","This is the biggest fall of any figure in the appendices and is clearly the only cause.","This shows the factory is now almost empty, so Ridgeway should close it."], fix:0},
{src:"Exam-style · Appendix F", q:"Analyse how the forecast fall in interest rates could benefit Ridgeway.",
 s:["The base rate is forecast to fall from 4.25% in 2025 to 3.50% in 2027.","Ridgeway has £2.1m of non-current liabilities, which is likely to be mostly its bank loan.","If the loan has a variable rate, its interest payments will fall.","This will increase Ridgeway's operating profit."],
 bad:3, problem:"Interest is a finance cost. It comes after operating profit, so lower interest raises profit for the year, not operating profit.",
 fixes:["This leaves more profit for the year after finance costs, which can be reinvested.","This will increase Ridgeway's revenue, because customers will pay more for each of its bikes.","This will increase Ridgeway's gross profit, because its interest is part of the cost of sales."], fix:0}
  ]},

{ id:10, type:'write', title:'Write question 1', blurb:'A full 12-mark answer on Ridgeway, one developed argument.', pass:1,
  teach:`<p>Now write question 1 in full. Aim for about 12 to 15 minutes, which is roughly what you would have in the exam.</p>
  <p>Write <b>one</b> argument, developed step by step, using the case and at least two pieces of data from the appendices, with something worked out. There is no need for a counter-argument or a conclusion. Finish with a sentence starting "Therefore" that uses the words of the question.</p>
  <p>Write your start point and end point first. The answer box unlocks when you have.</p>`,
  items:[{src:'Exam-style · Ridgeway Cycles · Question 1', w:{
    intro:`${CASE_BOX}${APX_A}${APX_B}${APX_C}<div class="qbox">${Q[1]} <span style="color:var(--muted);font-weight:400">(12 marks)</span></div>`,
    plan:[
      {id:'S',label:'Start point',cls:'s',ph:'What caused the fall?',ok:v=>/(turnover|staff|defect|fail|test|capacity|utilis|idle|website|online|marketing|import|price|cost|expense|wage|recruit|gross)/.test(v),hint:'Check your start point: which cause from the case are you starting from?'},
      {id:'E',label:'End point',cls:'e',ph:'Where must the chain finish?',ok:v=>/margin/.test(v),hint:'Check your end point. The question is about the margin, not just profit.'}],
    planOk:'Good. Keep both in front of you while you write.',
    checks:[
      {k:'data',label:'Uses two different pieces of data from the appendices',test:x=>{const l=x.low;
        const g=[/(\b12(\.0)?\s?%|11\.98|5\.25|5\.3\s?%|5\.2\s?%)/,/(\b9\s?%|\b26\s?%)/,/(2\.1\s?%|3\.6\s?%)/,/(66\.7|4,?000|6,?000)/,/(2\.25|2\.58)/,/(£?3\.4m|£?3\.1m|35\.4|31\.3)/,/(1\.15|0\.52)/,/(2,?236|3,?440|1,?540|\b536\b)/];
        return g.filter(r=>r.test(l)).length>=2;}},
      {k:'calc',label:'Works something out (margin, utilisation, staff replaced, change in costs...)',test:x=>/(5\.25|5\.3\s?%|5\.2\s?%|6\.7|66\.7|one third|a third|\b17 (new |staff|people|workers|of)|2\.58|0\.33|£?330,?000|31\.3|35\.4|1\.5 (percentage )?points|more than half|55\s?%|54\.8|halved)/.test(x.low)},
      {k:'context',label:'Uses Ridgeway\'s situation (bikes, testing, staff, bike shops...)',test:x=>/(ridgeway|bike)/.test(x.low)},
      {k:'links',label:'At least six linking words between steps',test:x=>(x.low.match(/\b(because|so|therefore|this means|which means|as a result|meaning|leads to|resulting in|consequently|since|as)\b/g)||[]).length>=6},
      {k:'focus',label:'Keeps coming back to the margin',test:x=>(x.low.match(/margin/g)||[]).length>=2},
      {k:'end',label:'Last sentence starts "Therefore" and answers the question',test:x=>/^therefore/.test(x.last)&&/margin/.test(x.last)}],
    warn:x=>/(dividend|shareholder)/.test(x.low)?{msg:'Check the case. Ridgeway is a Ltd run by the Sandhus, so be careful about bringing in shareholders.'}
      :/\b(however|on the other hand|in conclusion|overall,|to conclude)\b/.test(x.low)?{msg:'This looks like a counter-argument or conclusion. A 12-mark answer needs one developed argument.',block:true}
      :x.words>380?{msg:'This is long for 12 marks. One argument, developed well, is enough.'}:null,
    minCompare:80, minAi:100, finishLabel:'Finish the course',
    model:`<span class="src">One way to write it</span><p><span class="hl-s">One reason Ridgeway's operating profit margin fell is the rise in labour turnover</span>, which went from <span class="hl-d">9% in 2022 to 26% in 2024</span>. With 64 production staff, <span class="hl-d">that means about 17 people a year are new</span> and still learning how to assemble and test a high-value e-bike. <span class="hl-w">Because</span> new staff make more mistakes, more bikes fail the final test: <span class="hl-d">the failure rate rose from 2.1% to 3.6%, an increase of about 70%</span>. Each bike that fails has to be stripped down and reworked, or its parts scrapped, <span class="hl-w">so</span> Ridgeway pays for extra labour and materials that do not lead to an extra sale. On top of that, every leaver has to be replaced, <span class="hl-w">which means</span> more spending on recruitment and training, adding to operating expenses that rose <span class="hl-d">from £2.25m to £2.58m</span>. <span class="hl-w">As a result</span>, the cost of each bike Ridgeway sells has gone up, while it cannot easily raise prices with cheaper imports on sale online. <span class="hl-w">This means</span> less of each pound of revenue is left as operating profit, and the margin fell <span class="hl-d">from about 12% to 5.25%</span>. <span class="hl-w">Therefore</span> rising labour turnover helps explain why <span class="hl-e">Ridgeway's operating profit margin fell between 2022 and 2024</span>, because it pushed up the cost of every bike while the price stayed the same.</p>
      <div class="key"><span><span class="hl-s">teal</span> start point</span><span><span class="hl-e">coral</span> end point</span><span><span class="hl-w">purple</span> links</span><span><span class="hl-d">underlined</span> data, worked out</span></div>
      <p style="margin-top:14px;font-size:.9rem;color:var(--muted)">One cause, followed all the way to the margin. Other causes, such as spare capacity or price competition, could each make a full answer on their own.</p>`,
    ai:`You are an experienced AQA A-level Business teacher giving feedback on a student's answer to a Paper 3 12-mark question: "Analyse why Ridgeway's operating profit margin fell between 2022 and 2024."
Case (made up for practice): Ridgeway Cycles Ltd, a private limited company run by siblings Amrit and Kiran Sandhu, assembles e-bikes (£2,400–£4,500) in Swindon, sold mainly through 140 independent bike shops (which keep 35% of the retail price) and since 2022 through its own website. Competes on quality, not price. Cheaper imported e-bikes sold online have taken share since 2023. 64 production staff paid hourly; some left for a nearby warehouse paying more. Decisions are made informally by the founders.
Data 2022 / 2023 / 2024: revenue £9.6m / £10.4m / £9.9m; gross profit £3.4m / £3.5m / £3.1m; operating profit £1.15m / £0.94m / £0.52m (margin about 12.0% / 9.0% / 5.25%); bikes produced 4,100 / 4,300 / 4,000 with capacity 6,000 (utilisation 66.7% in 2024); labour turnover 9% / 12% / 26%; bikes failing final testing 2.1% / 2.4% / 3.6%. 2024 channels: bike shops 3,200 bikes, Ridgeway receives £2,236 each; website 800 bikes at £3,440 with £200 delivery and marketing; variable cost £1,700 per bike.
Rules for this question: on Paper 3 12-mark questions, one fully developed argument in context is the ideal approach (an AQA examiner showed a one-argument answer scoring 12/12), so never tell the student to add a second argument, a counter-argument or a conclusion. Focus on: whether every step is specific to Ridgeway and uses the case; whether they use at least two pieces of appendix data and work something out; whether they read the data correctly (revenue rose in 2023 and was slightly higher in 2024 than 2022; there are no outside shareholders); whether the chain ends on the operating profit MARGIN, not just profit; whether they avoid going past the end point; and whether the final "Therefore" sentence uses the question's words.
Do not give a mark or level. Write in plain British English, as a teacher speaking to a Year 13 student. No headings, no bullet symbols other than simple dashes, no emoji. Give: one sentence on what works; then two or three improvements, each quoting a short phrase they wrote ("You wrote: ...") and showing a better version ("You could write: ..."). Keep it under 230 words.`,
    doneTitle:'Course complete',
    doneText:'You have worked through a full Paper 3 case question by question. In the exam, read the case once for the story and once for the numbers, plan each answer from its end point, and keep a minute per mark in mind.'
  }}]}
];
